<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kikimiru</title>
<link rel="manifest" href="/web/manifest.webmanifest">
<meta name="theme-color" content="#0e0f11">
<link rel="icon" href="/web/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="kikimiru">
<style>
  /* =========================================================
     kikimiru — 案D「SoundLeaf参照」ネイティブアプリ文法・ダーク
     Large Title / 水平カルーセル / カバー前面 / グループ化リスト /
     下部タブバー / 再開ドック / 没入型プレイヤー。
     アクセントはリーフグリーン1色。単一ファイル・外部CDNなし。
     配色・アイコンはすべて自作(参照アプリの意匠は使用しない)。
     ========================================================= */
  /* 配色は Reviewable HTML Workbench のトークンに揃える(暖色ニュートラル+構造色)。
     ライト/ダークの両方を持ち、既定はOS設定に従う(手動切替も可)。 */
  :root, [data-theme="dark"] {
    --bg: #131519;              /* bg-app: 地 */
    --bg-elev: #1c1f24;         /* paper: 浮き面(カード・検索・グループ) */
    --bg-elev2: #20242a;        /* paper-2: さらに一段(hover・プレースホルダ) */
    --sep: #2c2f35;             /* line-1 */
    --sep-2: #393d44;           /* line-2 */
    --ink: #e7e3da;
    --ink2: #a6a299;
    --ink3: #7d7a72;
    --tint: #6ea4dc;            /* brand: 構造色(リンク・現在地・アクセント) */
    --tint-soft: #1f2d3c;       /* brand-soft: 選択面 */
    --tint-hi: #8fbce8;
    --on-tint: #10151b;         /* 構造色の上に載せる文字 */
    --ok: #6dba88;              /* resolved: 聴了 */
    --warn: #d6a85a;            /* reply: 進行中・注意 */
    --r-cover: 8px; --r-card: 12px; --r-field: 10px; --r-sheet: 16px;
    --ease: cubic-bezier(.32,.72,0,1);
    /* YouTube Music参照(Material 3トークン): 入場は減速・退出は加速、退出は短く */
    --ease-in-emph: cubic-bezier(.05,.7,.1,1);
    --ease-out-emph: cubic-bezier(.3,0,.8,.15);
    --dur-enter: 500ms; --dur-exit: 350ms; --dur-snap: 400ms;
    /* テーマ非依存の薄膜(前景色ベース)。ライトでは黒、ダークでは白が乗る */
    --veil-1: rgba(255,255,255,.06);
    --veil-2: rgba(255,255,255,.10);
    --veil-3: rgba(255,255,255,.16);
    --sh-card: 0 2px 8px rgba(0,0,0,.5);
    --sh-float: 0 14px 40px rgba(0,0,0,.5);
    --sh-deep: 0 24px 70px rgba(0,0,0,.55);
    --overlay-bg: rgba(19,21,25,.94);   /* オーバーレイ下地(bg-appベース) */
    --scrim: rgba(0,0,0,.5);            /* 画像上のバッジ地 */
    --stage-bg: #000;                   /* 画像スライドのレターボックス地 */
    --slide-bg: #1c1f24;                /* テキストスライドの面 */
    --slide-ink: #e7e3da;
    --knob: #fff;
  }
  [data-theme="light"] {
    --bg: #efece5;              /* bg-app */
    --bg-elev: #fdfcf9;         /* paper */
    --bg-elev2: #f7f5f0;        /* paper-2 */
    --sep: #e6e2d8;             /* line-1 */
    --sep-2: #d6d1c5;           /* line-2 */
    --ink: #232019;
    --ink2: #5f5b51;
    --ink3: #8d887d;
    --tint: #2f6093;
    --tint-soft: #e8eff7;
    --tint-hi: #24507e;
    --on-tint: #ffffff;
    --ok: #3f8a5c;
    --warn: #a9772a;
    --veil-1: rgba(35,32,25,.05);
    --veil-2: rgba(35,32,25,.09);
    --veil-3: rgba(35,32,25,.14);
    --sh-card: 0 2px 8px rgba(40,36,28,.10);
    --sh-float: 0 10px 30px rgba(40,36,28,.16);
    --sh-deep: 0 18px 50px rgba(40,36,28,.22);
    --overlay-bg: rgba(239,236,229,.96);
    --scrim: rgba(35,32,25,.55);
    --stage-bg: #d8d4ca;               /* 明るい地でのレターボックス */
    --slide-bg: #fdfcf9;
    --slide-ink: #232019;
    --knob: #232019;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100dvh; }
  button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  svg { display: block; }
  ::placeholder { color: var(--ink3); }

  #warn { display: none; background: var(--tint-soft); color: var(--warn); font-size: 12.5px;
    padding: 8px 18px; border-bottom: 1px solid var(--sep-2); position: relative; z-index: 30; }

  /* ---- アプリ幅(iPad的な余白) ---- */
  .app { max-width: 980px; margin: 0 auto; padding: 10px 28px 170px; }
  body.mode-player .app { max-width: none; padding: 0; }

  /* ---- ナビゲーションバー(小) ---- */
  .navbar { display: flex; align-items: center; justify-content: space-between;
    height: 40px; gap: 8px; }
  .backlink { display: inline-flex; align-items: center; gap: 4px;
    font-size: 14.5px; font-weight: 600; color: var(--tint); padding: 6px 8px 6px 2px; }
  .backlink svg { width: 12px; height: 12px; }
  .lib-switch {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: none; color: var(--ink2);
    font-size: 14px; font-weight: 600; font-family: inherit;
    padding: 6px 22px 6px 10px; border-radius: 8px; max-width: 220px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" fill="none" stroke="%23a2aab3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>');
    background-repeat: no-repeat; background-position: right 6px center; background-size: 12px;
  }
  .lib-switch:hover { background-color: var(--bg-elev); }
  .lib-switch option { background: var(--bg-elev); color: var(--ink); }

  /* ---- Large Title ---- */
  .large-title { font-size: 34px; font-weight: 800; letter-spacing: .01em; margin: 2px 0 14px; }

  /* ---- 検索フィールド ---- */
  .search {
    display: flex; align-items: center; gap: 9px; width: 100%;
    background: var(--bg-elev); border-radius: var(--r-field); border: none;
    padding: 10px 12px; margin-bottom: 22px; color: var(--ink3);
    font-size: 15px; text-align: left;
  }
  .search svg { width: 16px; height: 16px; flex-shrink: 0; }
  .search input { flex: 1; min-width: 0; background: none; border: none;
    color: var(--ink); font-size: 15px; font-family: inherit; outline: none; }

  /* ---- セクション ---- */
  section.sec { margin-bottom: 24px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .sec-head h2 { font-size: 21px; font-weight: 700; }
  .sec-head .all { font-size: 13.5px; font-weight: 600; color: var(--tint);
    display: inline-flex; align-items: center; gap: 3px; }
  .sec-head .all svg { width: 10px; height: 10px; }

  /* ---- 水平カルーセル ---- */
  .carousel { display: flex; gap: 14px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    scroll-snap-type: x proximity; padding-bottom: 4px; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel > * { scroll-snap-align: start; flex-shrink: 0; }

  /* ---- 続きから: 横長レジュームカード ---- */
  .resume-card { width: 430px; max-width: 86vw; display: flex; align-items: center; gap: 14px;
    background: var(--bg-elev); border-radius: var(--r-card); padding: 10px 12px;
    transition: background-color .12s linear; }
  .resume-card:hover { background: var(--bg-elev2); }
  .resume-card .cov { width: 60px; height: 60px; border-radius: var(--r-cover);
    overflow: hidden; flex-shrink: 0; background: var(--bg-elev2); position: relative; }
  .resume-card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .resume-card .t { font-size: 14.5px; font-weight: 600; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resume-card .m { font-size: 12px; color: var(--ink2); }
  .resume-card .bar { height: 4px; border-radius: 2px; background: var(--veil-2); margin-top: 4px; }
  .resume-card .bar i { display: block; height: 100%; border-radius: 2px; background: var(--tint); }
  .play-circ { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: var(--tint); color: var(--on-tint);
    display: inline-flex; align-items: center; justify-content: center; }
  .resume-card:hover .play-circ { background: var(--tint-hi); }
  .play-circ svg { width: 18px; height: 18px; margin-left: 2px; }

  /* ---- カバー前面ブックカード ---- */
  .book-card { width: 184px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .book-card .cov { position: relative; width: 100%; aspect-ratio: 1;
    border-radius: var(--r-cover); overflow: hidden; background: var(--bg-elev);
    box-shadow: 0 1px 0 var(--veil-1) inset; display: block; }
  .cov img, .detail .cover img, .simg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book-card .t { font-size: 13.5px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .book-card a:hover .t, .book-card .t a:hover { color: var(--tint); }
  .book-card .a { font-size: 12px; color: var(--ink2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-card .m { font-size: 11.5px; color: var(--ink3); }

  /* カバー無しプレースホルダ(自作グリフ+タイトル) */
  .ph-fill { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; background: var(--bg-elev2); }
  .ph-fill svg { width: 34%; height: auto; max-width: 44px; color: var(--ink3); }
  .ph-fill .pht { font-size: 11.5px; font-weight: 600; color: var(--ink2);
    text-align: center; padding: 0 12%; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* カバー下端の進捗・聴了バッジ */
  .cov .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: var(--scrim); }
  .cov .prog i { display: block; height: 100%; background: var(--tint); }
  .done-badge { position: absolute; right: 8px; top: 8px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--tint); color: var(--on-tint);
    display: flex; align-items: center; justify-content: center; }
  .done-badge svg { width: 12px; height: 12px; }
  .seq-badge { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700;
    background: var(--scrim); color: var(--ink); border-radius: 6px; padding: 3px 7px; }

  /* デスクトップ: カバーhoverの再生オーバーレイ(即再生の保全) */
  .play-over { position: absolute; right: 8px; bottom: 10px; width: 38px; height: 38px;
    border-radius: 50%; background: var(--tint); color: var(--on-tint);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s linear; box-shadow: var(--sh-card); }
  .play-over svg { width: 15px; height: 15px; margin-left: 2px; }
  .book-card:hover .play-over, .play-over:focus-visible { opacity: 1; }
  @media (hover: none) { .play-over { display: none; } }

  /* ---- 縦グリッド(本棚・検索結果) ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px 14px; }
  .grid .book-card { width: auto; }

  /* ---- シリーズカード ---- */
  .series-card { display: flex; align-items: center; gap: 16px; width: 100%;
    background: var(--bg-elev); border-radius: var(--r-card); padding: 12px 14px;
    transition: background-color .12s linear; }
  .series-card:hover { background: var(--bg-elev2); }
  .series-card .stack { position: relative; width: 96px; height: 72px; flex-shrink: 0; }
  .series-card .stack .simg { position: absolute; width: 72px; height: 72px;
    border-radius: var(--r-cover); border: 1px solid var(--veil-2);
    overflow: hidden; background: var(--bg-elev2); }
  .series-card .stack .simg.back { left: 24px; top: 0; }
  .series-card .stack .simg.front { left: 0; top: 0; box-shadow: var(--sh-card); }
  .series-card .t { font-size: 15px; font-weight: 700; }
  .series-card .m { font-size: 12.5px; color: var(--ink2); margin-top: 4px; display: block; }
  .series-card .chev { margin-left: auto; color: var(--ink3); }
  .series-card .chev svg { width: 13px; height: 13px; }
  .series-list { display: flex; flex-direction: column; gap: 12px; }

  /* ---- グループ化されたリスト ---- */
  .group { background: var(--bg-elev); border-radius: var(--r-card); overflow: hidden; }
  .grow { display: flex; align-items: center; gap: 14px; width: 100%;
    min-height: 46px; padding: 4px 16px; text-align: left; font-size: 14.5px;
    transition: background-color .12s linear; position: relative; }
  .grow:hover { background: var(--bg-elev2); }
  .grow + .grow::before { content: ""; position: absolute; left: 50px; right: 0; top: 0;
    height: 1px; background: var(--sep); }
  .grow .gic { width: 22px; height: 22px; color: var(--tint); flex-shrink: 0; }
  .grow .gic svg { width: 22px; height: 22px; }
  .grow .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grow .val { font-size: 14px; color: var(--ink3); flex-shrink: 0; }
  .grow .chev { color: var(--ink3); flex-shrink: 0; }
  .grow .chev svg { width: 12px; height: 12px; }

  .two-col { display: grid; grid-template-columns: 380px 1fr; gap: 36px; align-items: start; }
  .browse-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---- ツールバー(絞り込みチップ・並び替え) ---- */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    color: var(--tint); background: var(--tint-soft); border: 1px solid var(--tint);
    border-radius: 8px; padding: 5px 11px; }
  .toolbar select { background: var(--bg-elev); color: var(--ink2); border: none;
    border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; }

  /* ---- 空状態 ---- */
  .empty { color: var(--ink2); font-size: 14px; padding: 18px 4px; line-height: 1.7; }
  .empty a { color: var(--tint); font-weight: 600; }
  .guide { background: var(--bg-elev); border-radius: var(--r-card); padding: 20px 22px;
    line-height: 1.8; font-size: 14px; color: var(--ink2); }
  .guide h3 { color: var(--ink); font-size: 16px; margin-bottom: 8px; }
  .guide code { background: var(--bg-elev2); border-radius: 6px; padding: 2px 7px;
    font-size: 12.5px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink); }
  .guide ol { margin: 6px 0 0 1.3em; }

  /* ---- 統計 ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .stile { background: var(--bg-elev); border-radius: var(--r-card); padding: 14px 16px; }
  .stile .v { font-size: 22px; font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .stile .l { font-size: 11.5px; color: var(--ink2); margin-top: 3px; }
  .stats-note { font-size: 12px; color: var(--ink3); margin-top: 12px; }

  /* ---- コレクション ---- */
  .colhead { display: flex; align-items: center; gap: 10px; margin: 22px 2px 10px; }
  .colhead .nm { font-size: 16px; font-weight: 700; }
  .colhead .ct { font-size: 12px; color: var(--ink3); }
  .colhead .ops { margin-left: auto; display: flex; gap: 6px; }
  .btn { background: var(--bg-elev); color: var(--ink2); border-radius: 9px;
    padding: 8px 14px; font-size: 13px; font-weight: 600;
    transition: background-color .12s linear, color .12s linear; }
  .btn:hover { background: var(--bg-elev2); color: var(--ink); }
  .btn.primary { background: var(--tint); color: var(--on-tint); }
  .btn.primary:hover { background: var(--tint-hi); }
  .btn.danger-armed { background: var(--warn); color: var(--on-tint); }
  .newcol { display: flex; gap: 8px; margin-bottom: 6px; }
  .newcol input { flex: 1; max-width: 320px; background: var(--bg-elev); border: none;
    border-radius: 9px; padding: 9px 12px; color: var(--ink); font-size: 14px; font-family: inherit; }
  .picker { background: var(--bg-elev); border-radius: var(--r-card);
    padding: 14px; margin: 10px 0 16px; display: flex; flex-direction: column; gap: 7px; }
  .picker label { display: flex; align-items: center; gap: 9px; font-size: 13.5px; padding: 3px 2px; }
  .picker input[type="checkbox"] { accent-color: var(--tint); width: 16px; height: 16px; }
  .picker .ops { display: flex; gap: 8px; margin-top: 9px; }

  /* ---- ブック詳細 ---- */
  .detail { max-width: 560px; margin: 0 auto; }
  .detail .cover { width: 200px; aspect-ratio: 1; border-radius: var(--r-cover);
    overflow: hidden; margin: 6px auto 18px; position: relative;
    box-shadow: var(--sh-float); background: var(--bg-elev); }
  .detail .btitle { font-size: 21px; font-weight: 800; text-align: center; line-height: 1.35; }
  .detail .bauthor { font-size: 14px; color: var(--tint); font-weight: 600;
    text-align: center; margin-top: 6px; display: block; }
  .detail .bmeta { font-size: 12.5px; color: var(--ink3); text-align: center; margin-top: 6px; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; margin: 18px 0 8px; background: var(--tint); color: var(--on-tint);
    border-radius: 12px; padding: 14px 0; font-size: 15.5px; font-weight: 700;
    transition: background-color .12s linear; }
  .cta:hover { background: var(--tint-hi); }
  .cta svg { width: 16px; height: 16px; }
  .sub-actions { display: flex; gap: 10px; margin-bottom: 18px; }
  .sub-actions .sab { flex: 1; font-size: 12.5px; font-weight: 600; color: var(--ink2);
    border: 1px solid var(--veil-3); border-radius: 10px; padding: 9px 0;
    text-align: center; transition: color .12s linear, border-color .12s linear; }
  .sub-actions .sab:hover { color: var(--ink); border-color: var(--sep-2); }
  .meta-group { background: var(--bg-elev); border-radius: var(--r-card);
    overflow: hidden; margin-bottom: 16px; }
  .mrow { display: flex; align-items: center; min-height: 44px; padding: 8px 14px; gap: 12px; }
  .mrow + .mrow { border-top: 1px solid var(--sep); }
  .mrow .k { font-size: 13px; color: var(--ink2); width: 62px; flex-shrink: 0; }
  .mrow .v { font-size: 13.5px; flex: 1; text-align: right; color: var(--ink); min-width: 0; }
  .mrow a.v { color: var(--tint); font-weight: 600; }
  .mrow .chev { color: var(--ink3); flex-shrink: 0; }
  .mrow .chev svg { width: 11px; height: 11px; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .tagchip { font-size: 11.5px; font-weight: 600; color: var(--ink2);
    background: var(--veil-2); border-radius: 6px; padding: 4px 9px; }
  .tagchip:hover { color: var(--tint); }
  .desc-h { font-size: 13px; font-weight: 700; color: var(--ink2);
    margin: 2px 2px 8px; letter-spacing: .04em; }
  .desc { font-size: 13.5px; line-height: 1.75; color: var(--ink2); white-space: pre-line; }
  .detail-rail { margin-top: 26px; }

  /* ---- 再開ドック(タブバー上・タップで再生画面へ) ---- */
  #dock { position: fixed; left: 0; right: 0; bottom: 62px; z-index: 20;
    background: var(--overlay-bg); backdrop-filter: blur(18px); border-top: 1px solid var(--sep); }
  #dock .inner { max-width: 980px; margin: 0 auto; padding: 8px 28px;
    display: flex; align-items: center; gap: 12px; position: relative; }
  #dock .mbar { position: absolute; left: 0; top: -1px; right: 0; height: 2px;
    background: var(--veil-2); }
  #dock .mbar i { display: block; height: 100%; background: var(--tint); }
  #dock .cov { width: 42px; height: 42px; border-radius: 6px; overflow: hidden; flex-shrink: 0;
    box-shadow: var(--sh-card); background: var(--bg-elev2); position: relative; }
  #dock .body { flex: 1; min-width: 0; }
  #dock .t { font-size: 13.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dock .m { font-size: 11.5px; color: var(--ink2); margin-top: 2px; display: block; }

<script>
(function () {
  "use strict";

  // ================= 共通ユーティリティ =================

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;

  // 時間表記: 1時間未満は M:SS、1時間以上は H:MM:SS(90分の本が「90:00」になる問題の修正)
  function fmt(sec) {

  function fmtLong(sec) {

  // #warn へ警告文を積み上げて表示する(複数件出ても既存メッセージを消さない)
  function warn(msg) {
    var w = document.getElementById("warn");
    w.style.display = "block";
    if (w.textContent) {
      var line = document.createElement("div");
      line.textContent = msg;
      w.appendChild(line);
    } else {
      w.textContent = msg;
    }
  }

  // スライド種別のallowlist(deck.json由来の値をCSSクラス名へ直接注入しない)
  var ALLOWED_KINDS = ["title", "section", "content", "question"];
  function safeKind(k) { return ALLOWED_KINDS.indexOf(k) !== -1 ? k : "content"; }

  // localStorage(Safariプライベートモード等で例外を投げるためtry/catchで包む)
  function lsGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* 保存不可環境では黙って続行 */ }
  }
  function loadPos(lib, id) {
    var raw = lsGet("kikimiru.pos." + lib + "/" + id);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }
  // s=現在スライド番号(1始まり) / n=総スライド数(再開ドック・詳細画面の表示用)
  function savePos(lib, id, t, d, s, n) {
    var rec = { t: t, d: d, at: Date.now() };
    if (s) rec.s = s;
    if (n) rec.n = n;
    lsSet("kikimiru.pos." + lib + "/" + id, JSON.stringify(rec));
    markDirty(lib, id);
  }
  function clearPos(lib, id) {
    // 端末間同期(LWW)で古いサーバ値が復活しないよう、削除でなく
    // ゼロ位置の墓標レコード(t:0,d:0,新しいat)を書いて同期させる
    savePos(lib, id, 0, 0);
  }
  // 進捗の状態判定を1箇所に集約(カード・詳細・統計で同じ閾値を使う)
  var DONE_PCT = 0.97, START_PCT = 0.02;
  function posState(pos) {
    if (!pos || !pos.d) return { st: "none", pct: 0 };
    var pct = pos.t / pos.d;
    if (pct > DONE_PCT) return { st: "done", pct: 1 };
    if (pct >= START_PCT) return { st: "listening", pct: pct };
    return { st: "none", pct: 0 };
  }

  function qs(overrides) {
    // 現在のライブラリ選択を維持したままクエリ文字列を組み立てる
    var p = new URLSearchParams();
    if (state.lib) p.set("library", state.lib);
    Object.keys(overrides || {}).forEach(function (k) {
      if (overrides[k] != null && overrides[k] !== "") p.set(k, overrides[k]);
    });
    return "?" + p.toString();
  }

  function api(path, extra) {
    var p = new URLSearchParams(extra || {});
    if (state.lib) p.set("library", state.lib);
    return fetch(path + "?" + p.toString()).then(function (r) {
      if (r.status === 401) {
        // セッション切れ。ログイン画面を出して以降の処理は静かに打ち切る
        showLogin();
        throw new Error("auth_required");
      }
      if (!r.ok) throw new Error(path + " " + r.status);
      if (!offlineNotified && r.headers.get("X-Kikimiru-Cache")) {
        // Service Workerのキャッシュから返された=サーバに届いていない
        offlineNotified = true;
        warn("オフライン表示: サーバに接続できないため、最後に取得した内容を表示しています。保存系の操作は失敗します。");
      }
      return r.json();
    });
  }

  // ================= テーマ(ライト/ダーク) =================
  // Workbenchと同じトークン体系。既定はOS設定に従い、手動切替を記憶する
  function currentTheme() {
    var saved = lsGet("kikimiru.theme");
    if (saved === "light" || saved === "dark") return saved;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
      ? "light" : "dark";
  }
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", name === "light" ? "#efece5" : "#131519");
  }
  applyTheme(currentTheme());
  // OS設定の変更に追従する(手動指定がない場合のみ)
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () {
      if (!lsGet("kikimiru.theme")) applyTheme(currentTheme());
    });
  }

  // ================= Service Worker =================
  // secure context(https または 127.0.0.1)でのみ登録する。
  // LANのhttp運用ではSWは動かないため静かにスキップ(通常動作に影響なし)
  if ("serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("/web/sw.js", { scope: "/web/" }).catch(function () {});
    // 新しいSWが有効化されたら1度だけ自動リロードして最新UIへ入れ替える
    // (PWAとしてインストールした端末で古いシェルが残り続けるのを防ぐ)
    var swReloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (swReloaded) return;
      swReloaded = true;
      location.reload();
    });
  }
  var offlineNotified = false;

  // ================= ログイン =================
  var loginShown = false;
  function showLogin() {
    if (loginShown) return;
    loginShown = true;
    var ov = el("div");
    ov.id = "login";
    var panel = el("div", "panel");
    var mark = el("div", "mark");
    mark.innerHTML = I.glyph;
    panel.appendChild(mark);
    panel.appendChild(el("h1", null, "kikimiru"));
    panel.appendChild(el("p", null, "パスワードを入力してください"));
    var form = document.createElement("form");
    var box = document.createElement("input");
    box.type = "password";
    box.setAttribute("aria-label", "パスワード");
    box.autocomplete = "current-password";
    form.appendChild(box);
    var btn = el("button", null, "ログイン");
    btn.type = "submit";
    form.appendChild(btn);
    var err = el("div", "err", "");
    form.appendChild(err);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      err.textContent = "";
      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: box.value })
      }).then(function (r) {
        if (r.ok) { location.reload(); return; }
        if (r.status === 429) {
          err.textContent = "試行回数が多すぎます。しばらく待ってから再試行してください。";
          return;
        }
        err.textContent = "パスワードが違います。";
      }).catch(function () { err.textContent = "サーバに接続できません。"; });
    });
    panel.appendChild(form);
    ov.appendChild(panel);
    document.body.appendChild(ov);
    setTimeout(function () { box.focus(); }, 0);
  }

  // ================= 進捗の端末間同期 =================
  // localStorage が常に一次ストア。サーバとはLWW(atの新しい方)でマージする。
  var dirtyProgress = {};
  function markDirty(lib, id) { dirtyProgress[lib + "/" + id] = true; }

  function forEachLocalPos(fn) {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf("kikimiru.pos.") === 0) {
          var rec = null;
          try { rec = JSON.parse(localStorage.getItem(k)); } catch (e) {}
          if (rec) fn(k.slice("kikimiru.pos.".length), rec);
        }
      }
    } catch (e) { /* localStorage不可の環境では同期しない */ }
  }

  function syncProgressDown() {
    // サーバ→localStorage。ローカルの方が新しい分・ローカルにしか無い分はdirtyへ
    return fetch("/api/progress").then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (d) {
      if (!d || !d.progress) return;
      Object.keys(d.progress).forEach(function (key) {
        var rec = d.progress[key];
        var raw = lsGet("kikimiru.pos." + key);
        var local = null;
        try { local = raw ? JSON.parse(raw) : null; } catch (e) {}
        if (!local || (rec.at || 0) > (local.at || 0)) {
          lsSet("kikimiru.pos." + key, JSON.stringify(rec));
        } else if ((local.at || 0) > (rec.at || 0)) {
          dirtyProgress[key] = true;
        }
      });
      forEachLocalPos(function (key) {
        if (!d.progress[key]) dirtyProgress[key] = true;
      });
      syncProgressUp();
    }).catch(function () { /* オフライン等では手元の進捗のまま続行 */ });
  }

  function syncProgressUp(useKeepalive) {
    var keys = Object.keys(dirtyProgress);
    if (!keys.length) return;
    var payload = {};
    keys.forEach(function (key) {
      var raw = lsGet("kikimiru.pos." + key);
      try {
        var rec = raw ? JSON.parse(raw) : null;
        if (rec) payload[key] = rec;
      } catch (e) {}
    });
    if (!Object.keys(payload).length) { dirtyProgress = {}; return; }
    fetch("/api/progress", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ progress: payload }),
      keepalive: !!useKeepalive
    }).then(function (r) {
      if (r.ok) dirtyProgress = {};
    }).catch(function () { /* 失敗は次の機会に再送 */ });
  }

  // ================= 状態 =================
  var state = {

  };
  // ?book= 単独は従来どおりプレイヤー直行(後方互換)。?view=book&book= は詳細画面
  if (state.view !== "book" && params.get("book")) state.view = "player";

  // ================= シェル(ナビ・タブバー・ドック) =================
  function renderShell() {
    if (state.view === "player") {
      document.body.classList.add("mode-player");
      return;
    }
    // タブバー
    var bar = document.getElementById("tabbar");
    bar.textContent = "";
    TABS.forEach(function (t) {
      var a = document.createElement("a");
      a.className = "tab" + (state.view === t.view ? " cur" : "");
      if (state.view === t.view) a.setAttribute("aria-current", "page");
      a.href = qs({ view: t.view });
      a.innerHTML = I[t.icon];  // 静的な自作SVG文字列のみ(外部データを混ぜない)
      a.appendChild(el("span", null, t.label));
      bar.appendChild(a);
    });
    // サブ画面には戻りリンク(iOSのバックボタン文法)
    var left = document.getElementById("navLeft");
    left.textContent = "";
    var isTab = TABS.some(function (t) { return t.view === state.view; });
    if (!isTab) {
      var back = document.createElement("a");
      back.className = "backlink";
      back.href = state.view === "book" ? qs({ view: "library" }) : qs({ view: "home" });
      back.innerHTML = I.chevL;
      back.appendChild(document.createTextNode(state.view === "book" ? "本棚" : "ホーム"));
      left.appendChild(back);
    }
    // Large Title(詳細画面は自前の見出しを持つため空にする)
    var t = document.getElementById("pageTitle");
    if (state.view === "book") { t.style.display = "none"; }
    else {
      t.textContent = TITLES[state.view] || "";
      document.title = (TITLES[state.view] || "kikimiru") + " — kikimiru";
    }
  }

  function initLibSelect(libs) {
    var sel = document.getElementById("libSel");
    sel.textContent = "";
    libs.forEach(function (l) {
      var opt = document.createElement("option");
      opt.value = l.id;
      opt.textContent = l.name + " (" + l.books + ")";
      if (l.id === state.lib) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () {
      lsSet("kikimiru.lib", sel.value);
      var p = new URLSearchParams();
      p.set("library", sel.value);
      p.set("view", state.view === "player" || state.view === "book" ? "home" : state.view);
      location.search = "?" + p.toString();
    });
    if (libs.length <= 1) sel.style.display = "none";
  }

  // 再開ドック: 最後に聴いていた進行中のブックをどの画面からも1タップで再開できる。
  // (アプリはページ遷移型のため連続再生ではなく「再開」のドック。連続再生化はPhase 1後半)
  function renderDock(books) {
    var dock = document.getElementById("dock");
    var best = null;
    books.forEach(function (b) {
      var pos = loadPos(b.library, b.id);
      var st = posState(pos);
      if (st.st !== "listening") return;
      if (!best || (pos.at || 0) > (best.pos.at || 0)) best = { book: b, pos: pos, st: st };
    });
    if (!best) { dock.hidden = true; return; }
    dock.hidden = false;
    dock.textContent = "";
    var a = document.createElement("a");
    a.className = "inner";
    a.href = qs({ book: best.book.id });
    var mbar = el("span", "mbar");
    var fill = document.createElement("i");
    fill.style.width = Math.round(best.st.pct * 100) + "%";
    mbar.appendChild(fill);
    a.appendChild(mbar);
    var cov = el("span", "cov");
    coverInto(cov, best.book.library, best.book.id, best.book.cover, best.book.title, true);
    a.appendChild(cov);
    var body = el("span", "body");
    body.appendChild(el("span", "t", best.book.title));
    var meta = "残り " + fmt(Math.max(0, best.pos.d - best.pos.t));
    if (best.pos.s && best.pos.n) meta += " · スライド " + best.pos.s + "/" + best.pos.n;
    body.appendChild(el("span", "m", meta));
    a.appendChild(body);
    var pc = el("span", "play-circ");
    pc.setAttribute("aria-hidden", "true");
    pc.innerHTML = I.play;
    a.appendChild(pc);
    a.setAttribute("aria-label", best.book.title + " を続きから再生");
    // ページ遷移せずオーバーレイで開く(再生が途切れない)
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      openPlayerOverlay(best.book.id);
    });
    dock.appendChild(a);
  }

  // ================= カバー =================
  function coverInto(container, lib, bookId, coverName, title, tiny) {
    // プレースホルダ: 自作グリフ+タイトル(グラデーション・色相ハッシュは廃止)
    var ph = el("div", "ph-fill");
    ph.innerHTML = I.glyph;
    if (!tiny) ph.appendChild(el("span", "pht", title || bookId));
    container.appendChild(ph);
    if (coverName) {
      // 注意: loading="lazy" をDOM未接続のimgに付けるとChromiumはロードを開始しない
      // (loadが永久に発火せず差し替えが起きない)。imgは即座にDOMへ入れ、
      // ロード完了までopacityで隠す方式にする(display:noneもlazyのロードを止めるため不可)。
      var img = document.createElement("img");
      img.alt = "";
      img.style.opacity = "0";
      img.style.position = "absolute";
      img.style.inset = "0";
      img.addEventListener("load", function () {
        ph.remove();
        img.style.opacity = "";
        img.style.position = "";
      });
      img.addEventListener("error", function () { img.remove(); });
      img.src = bookBase(lib, bookId) + encodeURIComponent(coverName);
      container.appendChild(img);
    }
  }

  // ================= ブックカード =================
  // カード=詳細画面へ、カバーhoverの再生ボタン=即再生(承認済みQ2の導線)
  function bookCard(b, opts) {
    opts = opts || {};
    var card = el("div", "book-card");

    var covLink = document.createElement("a");
    covLink.className = "cov";
    covLink.href = qs({ view: "book", book: b.id });
    covLink.setAttribute("aria-label", b.title + " の詳細");
    coverInto(covLink, b.library, b.id, b.cover, b.title);

    var pos = loadPos(b.library, b.id);
    var st = posState(pos);
    if (st.st === "done") {
      var done = el("span", "done-badge");
      done.title = "聴了";
      done.innerHTML = I.check;
      covLink.appendChild(done);
    } else if (st.st === "listening") {
      var prog = el("span", "prog");
      var fill = document.createElement("i");
      fill.style.width = Math.round(st.pct * 100) + "%";
      prog.appendChild(fill);
      covLink.appendChild(prog);
    }
    if (opts.showSeq && b.series && b.series.sequence) {
      covLink.appendChild(el("span", "seq-badge", "#" + b.series.sequence));
    }
    card.appendChild(covLink);

    // hover再生オーバーレイ(タッチ環境ではCSSで非表示)
    var over = document.createElement("a");
    over.className = "play-over";
    over.href = qs({ book: b.id });
    over.setAttribute("aria-label", b.title + " を再生");
    over.innerHTML = I.play;
    over.addEventListener("click", function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      openPlayerOverlay(b.id);
    });
    covLink.appendChild(over);

    var tLink = document.createElement("a");
    tLink.href = qs({ view: "book", book: b.id });
    tLink.appendChild(el("span", "t", b.title));
    card.appendChild(tLink);
    if (b.authors && b.authors.length) card.appendChild(el("span", "a", b.authors.join(" / ")));

    var meta = b.slides + "枚";
    if (b.duration) meta += " · " + fmt(b.duration);
    if (st.st === "done") meta += " · 聴了";
    else if (st.st === "listening" && pos.d) meta += " · 残り " + fmt(pos.d - pos.t);
    card.appendChild(el("span", "m", meta));
    return card;
  }

  function resumeCard(b, pos, st) {
    var a = document.createElement("a");
    a.className = "resume-card";
    a.href = qs({ book: b.id });
    var cov = el("span", "cov");
    coverInto(cov, b.library, b.id, b.cover, b.title, true);
    a.appendChild(cov);
    var body = el("span", "body");
    body.appendChild(el("span", "t", b.title));
    var meta = "残り " + fmt(Math.max(0, pos.d - pos.t));
    if (pos.s && pos.n) meta += " · スライド " + pos.s + "/" + pos.n;
    body.appendChild(el("span", "m", meta));
    var bar = el("span", "bar");
    var fill = document.createElement("i");
    fill.style.width = Math.round(st.pct * 100) + "%";
    bar.appendChild(fill);
    body.appendChild(bar);
    a.appendChild(body);
    var pc = el("span", "play-circ");
    pc.setAttribute("aria-hidden", "true");
    pc.innerHTML = I.play;
    a.appendChild(pc);
    return a;
  }

  function seriesCard(g) {
    var a = document.createElement("a");
    a.className = "series-card";
    a.href = qs({ view: "library", series: g.name, sort: "series" });
    var stack = el("span", "stack");
    var back = el("span", "simg back");
    var front = el("span", "simg front");
    if (g.sample && g.sample.cover) {
      coverInto(front, state.lib, g.sample.book, g.sample.cover, g.name, true);
      coverInto(back, state.lib, g.sample.book, g.sample.cover, g.name, true);
    } else {
      front.innerHTML = '<span class="ph-fill">' + I.glyph + "</span>";
      back.innerHTML = '<span class="ph-fill">' + I.glyph + "</span>";
    }
    stack.appendChild(back);
    stack.appendChild(front);
    a.appendChild(stack);
    var body = el("span");
    body.appendChild(el("span", "t", g.name));
    body.appendChild(el("span", "m", g.books + "冊 · " + fmt(g.duration || 0)));
    a.appendChild(body);
    var chev = el("span", "chev");
    chev.innerHTML = I.chevR;
    a.appendChild(chev);
    return a;
  }

  function groupRow(iconKey, label, value, href) {
    var a = document.createElement("a");
    a.className = "grow";
    a.href = href;
    var gic = el("span", "gic");
    gic.innerHTML = I[iconKey];
    a.appendChild(gic);
    a.appendChild(el("span", "lbl", label));
    if (value != null) a.appendChild(el("span", "val", String(value)));
    var chev = el("span", "chev");
    chev.innerHTML = I.chevR;
    a.appendChild(chev);
    return a;
  }

  function searchField(autofocus) {
    var form = document.createElement("form");
    form.className = "search";
    form.setAttribute("role", "search");
    var icon = document.createElement("span");
    icon.innerHTML = I.searchS;
    form.appendChild(icon.firstChild);
    var box = document.createElement("input");
    box.type = "search";

    form.addEventListener("submit", function (ev) {

      location.search = qs({ view: "search", q: box.value.trim() });

    if (autofocus) setTimeout(function () { box.focus(); }, 0);
    return form;
  }

  function viewHome() {
    api("/api/books", { sort: "added" }).then(function (d) {
      content.textContent = "";
      content.appendChild(searchField(false));

      if (!d.books.length) {
        // 初回起動ガイド(空のライブラリ)
        var g = el("div", "guide");
        g.appendChild(el("h3", null, "ブックがまだありません"));
        var steps = document.createElement("ol");
        [
          "ライブラリフォルダの中に、1冊 = 1フォルダで音声とスライド定義を置きます(audio.mp3 と deck.json)",
          "サーバをそのフォルダで起動し直します",
          "このページを再読み込みすると本棚に現れます"
        ].forEach(function (s) { steps.appendChild(el("li", null, s)); });
        g.appendChild(steps);
        var cmd = el("p");
        cmd.appendChild(document.createTextNode("起動例: "));
        var code = el("code", null, "python server/kikimiru_server.py --library /path/to/library");
        cmd.appendChild(code);
        g.appendChild(cmd);
        g.appendChild(el("p", null, "ファイル形式の詳細は同梱の docs/SCHEMA.md を参照してください。デモを見るには --library を付けずに起動します。"));
        content.appendChild(g);
        return;
      }

      // 「続きから」 — 進行中(2〜97%)のブックを最後に聴いた順で
      var inProgress = d.books.map(function (b) {
        var pos = loadPos(b.library, b.id);
        return { book: b, pos: pos, st: posState(pos) };
      }).filter(function (x) { return x.st.st === "listening"; })
        .sort(function (a, b) { return (b.pos.at || 0) - (a.pos.at || 0); });

      if (inProgress.length) {
        var sec1 = el("section", "sec");
        sec1.setAttribute("aria-label", "続きから");
        var h1 = el("div", "sec-head");
        h1.appendChild(el("h2", null, "続きから"));
        sec1.appendChild(h1);
        var car1 = el("div", "carousel");
        inProgress.slice(0, 6).forEach(function (x) { car1.appendChild(resumeCard(x.book, x.pos, x.st)); });
        sec1.appendChild(car1);
        content.appendChild(sec1);
      }

      // 「最近追加」 — 続きから掲載分は重複させない
      var shown = {};
      inProgress.slice(0, 6).forEach(function (x) { shown[x.book.id] = true; });
      var recent = d.books.filter(function (b) { return !shown[b.id]; }).slice(0, 12);
      if (recent.length) {
        var sec2 = el("section", "sec");
        sec2.setAttribute("aria-label", "最近追加");
        var h2 = el("div", "sec-head");
        h2.appendChild(el("h2", null, "最近追加"));
        var all2 = document.createElement("a");
        all2.className = "all";
        all2.href = qs({ view: "library", sort: "added" });
        all2.appendChild(document.createTextNode("すべて表示"));
        var ch2 = document.createElement("span");
        ch2.innerHTML = I.chevR;
        all2.appendChild(ch2.firstChild);
        h2.appendChild(all2);
        sec2.appendChild(h2);
        var car2 = el("div", "carousel");
        recent.forEach(function (b) { car2.appendChild(bookCard(b)); });
        sec2.appendChild(car2);
        content.appendChild(sec2);
      }

      // シリーズ + ブラウズ
      return api("/api/series").then(function (s) {
        var cols = el("div", "two-col");

        if (s.series.length) {
          var secS = el("section", "sec");
          secS.setAttribute("aria-label", "シリーズ");
          var hS = el("div", "sec-head");
          hS.appendChild(el("h2", null, "シリーズ"));
          var allS = document.createElement("a");
          allS.className = "all";
          allS.href = qs({ view: "series" });
          allS.appendChild(document.createTextNode("すべて表示"));
          var chS = document.createElement("span");
          chS.innerHTML = I.chevR;
          allS.appendChild(chS.firstChild);
          hS.appendChild(allS);
          secS.appendChild(hS);
          var sl = el("div", "series-list");
          s.series.slice(0, 3).forEach(function (g) { sl.appendChild(seriesCard(g)); });
          secS.appendChild(sl);
          cols.appendChild(secS);
        }

        var secB = el("section", "sec");
        secB.setAttribute("aria-label", "ブラウズ");
        var hB = el("div", "sec-head");
        hB.appendChild(el("h2", null, "ブラウズ"));
        secB.appendChild(hB);
        var bg = el("div", "browse-grid");
        // 件数はブック一覧から算出(追加リクエストなし)
        var tagCount = {}, authorCount = {}, narratorCount = {};
        d.books.forEach(function (b) {
          (b.tags || []).forEach(function (t) { tagCount[t] = 1; });
          (b.authors || []).forEach(function (a) { authorCount[a] = 1; });
          (b.narrators || []).forEach(function (n) { narratorCount[n] = 1; });
        });
        var g1 = el("div", "group");
        g1.appendChild(groupRow("person", "著者", Object.keys(authorCount).length, qs({ view: "authors" })));
        g1.appendChild(groupRow("mic", "話者", Object.keys(narratorCount).length, qs({ view: "narrators" })));
        g1.appendChild(groupRow("folder", "コレクション", null, qs({ view: "collections" })));
        bg.appendChild(g1);
        var g2 = el("div", "group");
        g2.appendChild(groupRow("tag", "タグ", Object.keys(tagCount).length, qs({ view: "tags" })));
        g2.appendChild(groupRow("stats", "統計", d.books.length + "冊", qs({ view: "stats" })));
        // テーマ切替(Workbench同様のライト/ダーク)
        var themeNow = currentTheme();
        var th = groupRow(themeNow === "light" ? "sun" : "moon", "テーマ",
                          themeNow === "light" ? "ライト" : "ダーク", "#");
        th.addEventListener("click", function (ev) {
          ev.preventDefault();
          var next = currentTheme() === "light" ? "dark" : "light";
          lsSet("kikimiru.theme", next);
          applyTheme(next);
          th.querySelector(".gic").innerHTML = I[next === "light" ? "sun" : "moon"];
          th.querySelector(".val").textContent = next === "light" ? "ライト" : "ダーク";
        });
        g2.appendChild(th);
        var lo = groupRow("logout", "ログアウト", null, "#");
        lo.addEventListener("click", function (ev) {
          ev.preventDefault();
          fetch("/api/logout", { method: "POST" })
            .then(function () { location.reload(); })
            .catch(function () { location.reload(); });
        });
        g2.appendChild(lo);
        bg.appendChild(g2);
        secB.appendChild(bg);
        cols.appendChild(secB);

        content.appendChild(cols);
      });
    }).catch(function (e) { showError(e); });
  }

  function viewLibrary() {

  function viewStats() {
    Promise.all([api("/api/stats"), api("/api/books")]).then(function (res) {
      var s = res[0].stats;
      var books = res[1].books;
      content.textContent = "";

      // 端末ローカルの進捗から聴取状況を算出
      var done = 0, listening = 0;

      var tiles = [
        [String(s.books), "ブック"],
        [fmtLong(s.duration), "総再生時間"],
        [String(s.slides), "スライド総数"],

        [String(s.narrators), "話者"],
        [String(s.series), "シリーズ"],
        [String(s.tags), "タグ"],
        [s.withCover + " / " + s.books, "カバーあり"],
        [String(done), "聴き終えた"],
        [String(listening), "聴いている途中"]

      var grid = el("div", "stats");
      tiles.forEach(function (t) {

  function viewCollections() {
    Promise.all([api("/api/collections"), api("/api/books")]).then(function (res) {
      var collections = res[0].collections;
      var books = res[1].books;
      var byId = Object.create(null);
      books.forEach(function (b) { byId[b.id] = b; });
      content.textContent = "";

      // 新規作成(インライン入力 — ブラウザのprompt()は使わない)
      var form = document.createElement("form");
      form.className = "newcol";
      var nameBox = document.createElement("input");
      nameBox.placeholder = "新しいコレクション名";
      nameBox.setAttribute("aria-label", "新しいコレクション名");
      form.appendChild(nameBox);
      var addBtn = el("button", "btn primary", "作成");
      addBtn.type = "submit";
      form.appendChild(addBtn);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var name = nameBox.value.trim();
        if (!name) return;
        collections.push({ name: name, books: [] });
        putCollections(collections);
      });
      content.appendChild(form);

      if (!collections.length) {
        content.appendChild(el("div", "empty", "コレクションはまだありません。よく聴く本や作業用プレイリストなど、自由なくくりを作れます。"));
        return;
      }

      collections.forEach(function (c, idx) {
        var head = el("div", "colhead");
        head.appendChild(el("span", "nm", c.name));
        head.appendChild(el("span", "ct", c.books.length + "冊"));
        var ops = el("div", "ops");
        var editBtn = el("button", "btn", "ブックを追加/編集");
        editBtn.type = "button";
        // 削除は2段階(1回目で確認状態、3秒で戻る) — confirm()ダイアログは使わない
        var delBtn = el("button", "btn", "削除");
        delBtn.type = "button";
        var armTimer = null;
        delBtn.addEventListener("click", function () {
          if (delBtn.classList.contains("danger-armed")) {
            collections.splice(idx, 1);
            putCollections(collections);
            return;
          }
          delBtn.classList.add("danger-armed");
          delBtn.textContent = "本当に削除?";
          armTimer = setTimeout(function () {
            delBtn.classList.remove("danger-armed");
            delBtn.textContent = "削除";
          }, 3000);
        });
        ops.appendChild(editBtn);
        ops.appendChild(delBtn);
        head.appendChild(ops);
        content.appendChild(head);

        var member = c.books.map(function (id) { return byId[id]; }).filter(Boolean);
        if (member.length) {
          var grid = el("div", "grid");
          member.forEach(function (b) { grid.appendChild(bookCard(b)); });
          content.appendChild(grid);
        } else {
          content.appendChild(el("div", "empty", "まだブックがありません。「ブックを追加/編集」から選べます。"));
        }

        editBtn.addEventListener("click", function () {
          if (head.nextElementSibling && head.nextElementSibling.classList.contains("picker")) return;
          var picker = el("div", "picker");
          var checks = [];
          books.forEach(function (b) {
            var label = document.createElement("label");
            var cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = c.books.indexOf(b.id) !== -1;
            checks.push([cb, b.id]);
            label.appendChild(cb);
            label.appendChild(document.createTextNode(b.title));
            picker.appendChild(label);
          });
          var ops2 = el("div", "ops");
          var save = el("button", "btn primary", "保存");
          save.type = "button";
          save.addEventListener("click", function () {
            c.books = checks.filter(function (x) { return x[0].checked; }).map(function (x) { return x[1]; });
            putCollections(collections);
          });
          var cancel = el("button", "btn", "キャンセル");
          cancel.type = "button";
          cancel.addEventListener("click", function () { picker.remove(); });
          ops2.appendChild(save);
          ops2.appendChild(cancel);
          picker.appendChild(ops2);
          head.after(picker);
        });
      });
    }).catch(function (e) { showError(e); });
  }

  function putCollections(collections) {
    var p = new URLSearchParams();
    if (state.lib) p.set("library", state.lib);
    fetch("/api/collections?" + p.toString(), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ collections: collections })
    }).then(function (r) {
      if (!r.ok) throw new Error("保存に失敗しました(" + r.status + ")");
      viewCollections();  // 全画面リロードせず部分再描画で反映する
    }).catch(function (e) { warn(String(e.message || e)); });
  }

  function showError(e) {
    content.textContent = "";
    content.appendChild(el("div", "empty", "読み込みエラー: " + (e.message || e)));
  }

  // ================= ブック詳細画面 =================
  function getBook(id) {
    // 単体API(v2.1)を使い、無い場合(旧サーバ)は一覧から探すフォールバック
    return api("/api/books/" + encodeURIComponent(id)).then(function (d) { return d.book; })
      .catch(function () {
        return api("/api/books").then(function (d) {
          var b = d.books.filter(function (x) { return x.id === id; })[0];
          if (!b) throw new Error("ブックが見つかりません");
          return b;
        });
      });
  }

  function metaRow(key, valueNode) {
    var row = el("div", "mrow");
    row.appendChild(el("span", "k", key));
    row.appendChild(valueNode);
    return row;
  }
  function metaLink(text, href) {
    var a = document.createElement("a");
    a.className = "v";
    a.href = href;
    a.textContent = text;
    return a;
  }

  function viewBook(bookId) {
    getBook(bookId).then(function (b) {
      document.title = b.title + " — kikimiru";
      content.textContent = "";
      var box = el("div", "detail");

      var cover = el("div", "cover");
      coverInto(cover, b.library, b.id, b.cover, b.title);
      box.appendChild(cover);

      box.appendChild(el("h2", "btitle", b.title));
      if (b.authors && b.authors.length) {
        var au = document.createElement("a");
        au.className = "bauthor";
        au.href = qs({ view: "library", author: b.authors[0] });
        au.textContent = b.authors.join(" / ");
        box.appendChild(au);
      }
      var bmeta = "スライド " + b.slides + "枚";
      if (b.duration) bmeta += " · " + fmt(b.duration);
      box.appendChild(el("div", "bmeta", bmeta));

      // CTA: 進捗があれば「続きから再生」、なければ「再生」
      var pos = loadPos(b.library, b.id);
      var st = posState(pos);
      var cta = document.createElement("a");
      cta.className = "cta";
      cta.href = qs({ book: b.id });
      cta.addEventListener("click", function (ev) {
        ev.preventDefault();
        openPlayerOverlay(b.id);
      });
      var ctaIcon = document.createElement("span");
      ctaIcon.innerHTML = I.play;
      cta.appendChild(ctaIcon.firstChild);
      cta.appendChild(document.createTextNode(
        st.st === "listening" ? "続きから再生 · " + fmt(pos.t) :
        st.st === "done" ? "もう一度再生" : "再生"));
      box.appendChild(cta);

      var subs = el("div", "sub-actions");
      var restart = document.createElement("a");
      restart.className = "sab";
      restart.href = qs({ book: b.id, restart: "1" });
      restart.textContent = "最初から再生";
      subs.appendChild(restart);
      var markDone = el("button", "sab", st.st === "done" ? "聴了を取り消す" : "聴了にする");
      markDone.type = "button";
      markDone.addEventListener("click", function () {
        if (st.st === "done") clearPos(b.library, b.id);
        else if (b.duration) savePos(b.library, b.id, b.duration, b.duration);
        viewBook(bookId);  // 状態を反映して再描画
      });
      subs.appendChild(markDone);
      box.appendChild(subs);

      var group = el("div", "meta-group");
      // 進捗
      var pv = el("span", "v");
      pv.style.cssText = "color:var(--tint);font-weight:700";
      pv.textContent = st.st === "done" ? "聴了" :
        st.st === "listening" ? Math.round(st.pct * 100) + "% · 残り " + fmt(pos.d - pos.t) : "未再生";
      group.appendChild(metaRow("進捗", pv));
      if (b.authors && b.authors.length) {
        group.appendChild(metaRow("著者", metaLink(b.authors.join(" / "), qs({ view: "library", author: b.authors[0] }))));
      }
      if (b.narrators && b.narrators.length) {
        group.appendChild(metaRow("話者", metaLink(b.narrators.join(" / "), qs({ view: "library", narrator: b.narrators[0] }))));
      }
      if (b.series) {
        var sLabel = b.series.name + (b.series.sequence ? " #" + b.series.sequence : "");
        group.appendChild(metaRow("シリーズ", metaLink(sLabel, qs({ view: "library", series: b.series.name, sort: "series" }))));
      }
      if (b.addedAt) {
        group.appendChild(metaRow("追加日", el("span", "v", b.addedAt)));
      }
      if (b.tags && b.tags.length) {
        var tags = el("span", "v tagrow");
        b.tags.forEach(function (t) {
          var a = document.createElement("a");
          a.className = "tagchip";
          a.href = qs({ view: "library", tag: t });
          a.textContent = t;
          tags.appendChild(a);

        group.appendChild(metaRow("タグ", tags));
      }
      box.appendChild(group);

      if (b.description) {
        box.appendChild(el("div", "desc-h", "説明"));
        box.appendChild(el("p", "desc", b.description));
      }

      content.appendChild(box);

      // 同シリーズの他の本
      if (b.series && b.series.name) {
        return api("/api/books", { series: b.series.name, sort: "series" }).then(function (d) {
          var others = d.books.filter(function (x) { return x.id !== b.id; });
          if (!others.length) return;
          var rail = el("section", "sec detail-rail");
          var head = el("div", "sec-head");
          head.appendChild(el("h2", null, "シリーズ「" + b.series.name + "」の他の本"));
          rail.appendChild(head);
          var car = el("div", "carousel");
          others.forEach(function (x) { car.appendChild(bookCard(x, { showSeq: true })); });
          rail.appendChild(car);
          content.appendChild(rail);
        });

    }).catch(function (e) { showError(e); });
