<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kikimiru</title>
<style>
  /* kikimiru player — 単一ファイル・外部CDNなし・ダークテーマ・スマホ縦最適化。
     ライブラリ(カバーグリッド)+プレイヤーの2画面構成。配色・装飾はkikimiru独自。 */
  :root {
    --bg: #0f1216; --bg2: #151a20; --card: #1a2027; --card-hi: #202834;
    --ink: #e9edf2; --ink2: #98a6b3; --ink3: #6b7885; --line: #28313c;
    --brand: #b39ddb; --brand-deep: #7e6ab8; --brand-dim: #292039;
    --accent-q: #d9a86a; --ok: #79c99e;
    --radius: 14px; --radius-s: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---- 共通ヘッダ ---- */
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg2) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo {
    font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--ink);
    text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .logo::before {
    content: ""; width: 10px; height: 10px; border-radius: 3px;
    background: linear-gradient(135deg, var(--brand), var(--brand-deep));
    display: inline-block;
  }
  header .crumb { font-size: 13px; color: var(--ink2); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .count { margin-left: auto; font-size: 12px; color: var(--ink3); flex-shrink: 0; }

  #warn { display: none; background: #3a2b12; color: #f0c987; font-size: 12px;
    padding: 7px 16px; border-bottom: 1px solid #57431f; }

  /* ---- ライブラリ(カバーグリッド) ---- */
  #library { display: none; padding: 18px 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 1080px; margin: 0 auto; width: 100%; }
  #library .sect { font-size: 12px; letter-spacing: .1em; color: var(--ink3); margin: 2px 2px 12px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .bcard {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; text-decoration: none; color: var(--ink); display: flex;
    flex-direction: column; transition: transform .15s ease, border-color .15s ease;
  }
  .bcard:hover { transform: translateY(-2px); border-color: var(--brand-deep); }
  .cov { position: relative; aspect-ratio: 1; background: var(--card-hi); }
  .cov img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cov .ph {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 700; color: rgba(255,255,255,.85);
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .cov .badge {
    position: absolute; right: 8px; bottom: 8px; font-size: 10px; padding: 3px 7px;
    border-radius: 99px; background: rgba(0,0,0,.55); color: #dfe6ee;
    backdrop-filter: blur(4px);
  }
  .pbar { height: 3px; background: var(--line); }
  .pbar > i { display: block; height: 100%; background: var(--brand); }
  .binfo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .binfo .t { font-size: 13.5px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .binfo .m { font-size: 11.5px; color: var(--ink2); }
  .binfo .resume { font-size: 11px; color: var(--brand); }
  #libEmpty { color: var(--ink2); font-size: 14px; padding: 24px 4px; }

  /* ---- プレイヤー ---- */
  #main { display: none; flex: 1; padding: 14px 16px calc(env(safe-area-inset-bottom) + 18px);
    max-width: 1080px; margin: 0 auto; width: 100%;
    grid-template-columns: 1fr; gap: 14px; }
  #main.show { display: grid; }
  @media (min-width: 920px) {
    #main.show { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
    #paneList { position: sticky; top: 76px; }
  }
  #paneMain { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  #slide {
    background: linear-gradient(180deg, var(--card) 0%, var(--bg2) 130%);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 26px 22px; min-height: 40dvh;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    animation: none;
  }
  #slide.flip { animation: slidein .28s ease; }
  @keyframes slidein { from { opacity: .35; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  #slide .kind {
    font-size: 11px; letter-spacing: .14em; color: var(--brand);
    display: inline-flex; align-items: center; gap: 6px;
  }
  #slide .kind::before { content: ""; width: 14px; height: 2px; background: var(--brand); display: inline-block; }
  #slide h2 { font-size: 21px; line-height: 1.45; letter-spacing: .01em; }
  #slide ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  #slide ul li { padding-left: 1.1em; text-indent: -1.1em; font-size: 15px; line-height: 1.6; }
  #slide ul li::before { content: "— "; color: var(--brand); }
  #slide .note { font-size: 12px; color: var(--ink2); border-top: 1px dashed var(--line); padding-top: 10px; }
  #slide.kind-title, #slide.kind-section { text-align: center; }
  #slide.kind-title h2 { font-size: 25px; }
  #slide.kind-title .kind, #slide.kind-section .kind { justify-content: center; }
  #slide.kind-section h2 { color: var(--brand); }
  #slide.kind-title ul li, #slide.kind-section ul li { text-indent: 0; padding-left: 0; }
  #slide.kind-title ul li::before, #slide.kind-section ul li::before { content: ""; }
  #slide.kind-question .kind { color: var(--accent-q); }
  #slide.kind-question .kind::before { background: var(--accent-q); }
  #slide.kind-question ul li::before { content: "? "; color: var(--accent-q); }

  .meter { display: flex; justify-content: space-between; font-size: 12px;
    color: var(--ink2); padding: 0 4px; font-variant-numeric: tabular-nums; }

  #controls { display: flex; flex-direction: column; gap: 10px;
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; }
  audio { width: 100%; height: 42px; }
  .row { display: flex; gap: 8px; }
  .row button {
    flex: 1; background: var(--card); color: var(--ink2); border: 1px solid var(--line);
    border-radius: var(--radius-s); padding: 10px 0; font-size: 13px;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .row button:hover { color: var(--ink); border-color: var(--brand-deep); }
  .row button.on { background: var(--brand-dim); border-color: var(--brand); color: var(--brand); }
  .row button:active { transform: translateY(1px); }
  #resume {
    display: none; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink2);
    background: var(--brand-dim); border: 1px solid var(--brand-deep);
    border-radius: var(--radius-s); padding: 9px 12px;
  }
  #resume b { color: var(--brand); font-weight: 600; }
  #resume button { margin-left: auto; background: none; border: none; color: var(--ink3);
    font-size: 14px; padding: 0 4px; }

  /* ---- スライド一覧 ---- */
  #paneList { background: var(--bg2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; min-width: 0; }
  #paneList .head { font-size: 11.5px; letter-spacing: .08em; color: var(--ink3); margin: 4px 6px 8px; }
  #list { display: flex; flex-direction: column; gap: 2px; max-height: 46dvh; overflow-y: auto; }
  @media (min-width: 920px) { #list { max-height: calc(100dvh - 200px); } }
  #list .item {
    display: flex; gap: 10px; align-items: baseline; background: none;
    border: 1px solid transparent; border-radius: var(--radius-s); padding: 8px 10px;
    color: var(--ink2); font-size: 13px; text-align: left; width: 100%;
  }
  #list .item:hover { background: var(--card); color: var(--ink); }
  #list .item .n { font-size: 11px; color: var(--ink3); min-width: 1.6em; text-align: right; }
  #list .item .t { font-variant-numeric: tabular-nums; font-size: 11.5px;
    color: var(--ink3); min-width: 3.2em; }
  #list .item .ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .item.cur { background: var(--brand-dim); border-color: var(--brand-deep); color: var(--ink); }
  #list .item.cur .t, #list .item.cur .n { color: var(--brand); }
</style>
</head>
<body>
<header>
  <a class="logo" href="?">kikimiru</a>
  <span class="crumb" id="crumb"></span>
  <span class="count" id="hCount"></span>
</header>
<div id="warn" role="status"></div>

<section id="library">
  <div class="sect">ライブラリ</div>
  <div id="grid"></div>
  <div id="libEmpty" hidden>ライブラリにブックがありません。<code>--library</code> でブックフォルダを指定してください。</div>
</section>

<main id="main">
  <div id="paneMain">
    <section id="slide" aria-live="polite"></section>
    <div class="meter"><span id="mSlide"></span><span id="mTime"></span></div>
    <div id="resume"><span>前回の続き <b id="resumeAt"></b> から再開します</span><button id="resumeOff" type="button" aria-label="最初から再生">×</button></div>
    <div id="controls">
      <audio id="audio" controls preload="metadata"></audio>
      <div class="row" id="speeds"></div>
      <div class="row">
        <button id="prev" type="button">◀ 前のスライド</button>
        <button id="next" type="button">次のスライド ▶</button>
      </div>
    </div>
  </div>
  <nav id="paneList">
    <div class="head">スライド一覧(タップで移動)</div>
    <div id="list"></div>
  </nav>
</main>

<script>
(function () {
  "use strict";
  var book = new URLSearchParams(location.search).get("book");

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }

  // #warn へ警告文を積み上げて表示する(複数件出ても既存メッセージを消さない)
  function warn(msg) {
    var w = document.getElementById("warn");
    w.style.display = "block";
    if (w.textContent) {
      var line = document.createElement("div");
      line.textContent = msg;
      w.appendChild(line);
    } else {
      w.textContent = msg;
    }
  }

  // スライド種別のallowlist(deck.json由来の値をCSSクラス名へ直接注入しない)
  var ALLOWED_KINDS = ["title", "section", "content", "question"];
  function safeKind(k) {
    return ALLOWED_KINDS.indexOf(k) !== -1 ? k : "content";
  }

  // 再生位置の保存(localStorageはSafariプライベートモード等で例外を投げるためtry/catchで包む)
  function loadPos(id) {
    try {
      var raw = localStorage.getItem("kikimiru.pos." + id);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function savePos(id, t, d) {
    try {
      localStorage.setItem("kikimiru.pos." + id, JSON.stringify({ t: t, d: d, at: Date.now() }));
    } catch (e) { /* 保存できない環境では黙って続行 */ }
  }

  // ブックIDからプレースホルダカバーの色相を決める(決定論・依存なし)
  function hueOf(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  // ================= ライブラリ画面 =================
  if (!book) {
    document.getElementById("library").style.display = "block";
    document.getElementById("crumb").textContent = "";
    fetch("/api/books").then(function (r) { return r.json(); }).then(function (d) {
      var grid = document.getElementById("grid");
      document.getElementById("hCount").textContent = d.books.length + " ブック";
      if (!d.books.length) {
        document.getElementById("libEmpty").hidden = false;
        return;
      }
      d.books.forEach(function (b) {
        var a = document.createElement("a");
        a.className = "bcard";
        a.href = "?book=" + encodeURIComponent(b.id);

        var cov = document.createElement("div");
        cov.className = "cov";
        // プレースホルダ(タイトル先頭文字+ブックID由来の色相グラデーション)
        var hue = hueOf(b.id);
        var ph = document.createElement("div");
        ph.className = "ph";
        ph.style.background = "linear-gradient(135deg, hsl(" + hue + ",42%,30%), hsl(" + ((hue + 45) % 360) + ",48%,16%))";
        ph.textContent = (b.title || b.id).charAt(0);
        cov.appendChild(ph);
        // cover.jpg があれば差し替える(無ければ404でonerror→プレースホルダのまま)
        var img = document.createElement("img");
        img.loading = "lazy";
        img.alt = "";
        img.addEventListener("load", function () { ph.replaceWith(img); });
        img.src = "/books/" + encodeURIComponent(b.id) + "/cover.jpg";
        if (b.duration) {
          var badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = fmt(b.duration);
          cov.appendChild(badge);
        }
        a.appendChild(cov);

        // 進捗バー(保存済みの再生位置から)
        var pos = loadPos(b.id);
        var pct = (pos && pos.d > 0) ? Math.min(100, Math.round(pos.t / pos.d * 100)) : 0;
        var pbar = document.createElement("div");
        pbar.className = "pbar";
        var fill = document.createElement("i");
        fill.style.width = pct + "%";
        pbar.appendChild(fill);
        a.appendChild(pbar);

        var info = document.createElement("div");
        info.className = "binfo";
        var t = document.createElement("div");
        t.className = "t";
        t.textContent = b.title;
        info.appendChild(t);
        var m = document.createElement("div");
        m.className = "m";
        m.textContent = b.slides + "枚のスライド";
        info.appendChild(m);
        if (pct > 0 && pct < 100) {
          var rs = document.createElement("div");
          rs.className = "resume";
          rs.textContent = "再生途中 " + pct + "%";
          info.appendChild(rs);
        }
        a.appendChild(info);
        grid.appendChild(a);
      });
    }).catch(function () {
      document.getElementById("libEmpty").hidden = false;
      document.getElementById("libEmpty").textContent = "サーバに接続できません。";
    });
    return;
  }

  // ================= プレイヤー画面 =================
  var base = "/books/" + encodeURIComponent(book) + "/";
  Promise.all([
    fetch(base + "deck.json").then(function (r) { if (!r.ok) throw new Error("deck.json " + r.status); return r.json(); }),
    // content.json は無くても動く(構造/本文分離): その場合はスライドID・種別のみ表示
    fetch(base + "content.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (res) {
    var deck = res[0];
    // プロトタイプ汚染耐性: 外部データ(スライドid)をキーにするためObject.create(null)にする
    var content = Object.create(null);
    if (res[1] && res[1].slides) {
      Object.keys(res[1].slides).forEach(function (k) { content[k] = res[1].slides[k]; });
    }

    document.getElementById("crumb").textContent = deck.title || book;
    if (!res[1]) {
      warn("content.json が無いため、スライドは構成情報のみ表示しています。");
    }
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: deck.title || book, artist: "kikimiru" });
    }

    document.getElementById("main").classList.add("show");
    var audio = document.getElementById("audio");

    // audio.src の組み立て前にファイル名を検証する(パス区切り・親ディレクトリ参照・
    // クエリ/フラグメントの混入を拒否し、意図しないリクエストになるのを防ぐ)
    var audioName = (deck.audio && typeof deck.audio.src === "string" && deck.audio.src) || "audio.mp3";
    if (/[\/\\]|\.\.|[?#]/.test(audioName)) {
      warn("音声ファイル名が不正なため読み込みを中止しました: " + audioName);
    } else {
      // 音声のロード失敗(ファイル未検出・コーデック非対応等)を通知する
      audio.addEventListener("error", function () {
        warn("音声を読み込めませんでした: " + audioName);
      });
      audio.src = base + encodeURIComponent(audioName);
    }

    var cues = (deck.cues || []).slice().sort(function (a, b) { return a.t - b.t; });
    if (!cues.length) {
      // cuesが空のdeckはcues[0]参照で例外になりUIが半壊するため、ここで止める
      warn("この本には再生可能なスライドがありません(deck.jsonのcuesが空です)");
      return;
    }

    // プロトタイプ汚染耐性: 外部データ(スライドid)をキーにするためObject.create(null)にする
    var slideMeta = Object.create(null);
    (deck.slides || []).forEach(function (s) { if (s && s.id) slideMeta[s.id] = s; });
    var cur = -1;

    var slideEl = document.getElementById("slide");
    function render(i) {
      var cue = cues[i];
      var meta = slideMeta[cue.slide] || {};
      var body = content[cue.slide] || {};
      var kind = safeKind(meta.kind);
      slideEl.className = "kind-" + kind;
      // 切替アニメーション(クラスを外して再付与し、リフローでアニメーションを再始動)
      void slideEl.offsetWidth;
      slideEl.classList.add("flip");
      slideEl.innerHTML = '<div class="kind"></div><h2></h2>';
      var kindLabel = { title: "タイトル", section: "セクション", question: "考えてみる" }[kind] || ("スライド " + (i + 1));
      slideEl.querySelector(".kind").textContent = kindLabel;
      slideEl.querySelector("h2").textContent = body.title || cue.slide;
      if (body.bullets && body.bullets.length) {
        var ul = document.createElement("ul");
        body.bullets.forEach(function (b) {
          var li = document.createElement("li");
          li.textContent = b;
          ul.appendChild(li);
        });
        slideEl.appendChild(ul);
      }
      if (body.note) {
        var note = document.createElement("div");
        note.className = "note";
        note.textContent = body.note;
        slideEl.appendChild(note);
      }
      document.getElementById("mSlide").textContent = "スライド " + (i + 1) + " / " + cues.length;
      var items = document.querySelectorAll("#list .item");
      items.forEach(function (el, j) { el.classList.toggle("cur", j === i); });
      // #listは独立したスクロールコンテナ(CSSでmax-height+overflow-y:auto)のため、
      // block:"nearest"はページ全体ではなく#list内のスクロールだけで完結する
      if (items[i]) items[i].scrollIntoView({ block: "nearest" });
    }

    function cueAt(t) {
      var i = 0;
      while (i + 1 < cues.length && cues[i + 1].t <= t) i++;
      return i;
    }

    var lastSaved = 0;
    audio.addEventListener("timeupdate", function () {
      var i = cueAt(audio.currentTime);
      if (i !== cur) { cur = i; render(i); }
      document.getElementById("mTime").textContent =
        fmt(audio.currentTime) + " / " + fmt(audio.duration || (deck.audio && deck.audio.duration) || 0);
      // 再生位置の保存は5秒ごとに間引く(毎timeupdateで書くとストレージ書き込みが過剰)
      var now = Date.now();
      if (now - lastSaved > 5000 && !audio.paused) {
        lastSaved = now;
        savePos(book, audio.currentTime, audio.duration || (deck.audio && deck.audio.duration) || 0);
      }
    });
    // 離脱時にも保存する(モバイルSafariはunloadが来ないためpagehide/visibilitychangeで)
    function saveNow() {
      if (audio.currentTime > 0) {
        savePos(book, audio.currentTime, audio.duration || (deck.audio && deck.audio.duration) || 0);
      }
    }
    window.addEventListener("pagehide", saveNow);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") saveNow();
    });
    audio.addEventListener("pause", saveNow);

    // 前回の続きから再開(先頭・末尾付近の保存値は無視する)
    var saved = loadPos(book);
    if (saved && saved.t > 10 && (!saved.d || saved.t < saved.d - 5)) {
      var bar = document.getElementById("resume");
      bar.style.display = "flex";
      document.getElementById("resumeAt").textContent = fmt(saved.t);
      audio.addEventListener("loadedmetadata", function () {
        if (bar.style.display !== "none") audio.currentTime = saved.t;
      }, { once: true });
      document.getElementById("resumeOff").addEventListener("click", function () {
        bar.style.display = "none";
        audio.currentTime = 0;
        cur = -1;
        render(cueAt(0));
      });
    }

    function seekTo(i) {
      audio.currentTime = cues[i].t + 0.01;
      if (audio.paused) {
        // 自動再生ブロック時のunhandled promise rejectionを防ぐ
        audio.play().catch(function () {});
      }
    }
    document.getElementById("prev").addEventListener("click", function () { seekTo(Math.max(0, cur - 1)); });
    document.getElementById("next").addEventListener("click", function () { seekTo(Math.min(cues.length - 1, cur + 1)); });

    if ("mediaSession" in navigator) {
      // ロック画面/通知からの前後スライド送り(既存のprev/nextロジックを流用)
      navigator.mediaSession.setActionHandler("previoustrack", function () { seekTo(Math.max(0, cur - 1)); });
      navigator.mediaSession.setActionHandler("nexttrack", function () { seekTo(Math.min(cues.length - 1, cur + 1)); });
    }

    [0.75, 1.0, 1.25, 1.5, 2.0].forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = "×" + v;
      if (v === 1.0) b.classList.add("on");
      b.addEventListener("click", function () {
        audio.playbackRate = v;
        document.querySelectorAll("#speeds button").forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
      });
      document.getElementById("speeds").appendChild(b);
    });

    var list = document.getElementById("list");
    cues.forEach(function (cue, i) {
      var body = content[cue.slide] || {};
      var b = document.createElement("button");
      b.type = "button";
      b.className = "item";
      b.innerHTML = '<span class="n"></span><span class="t"></span><span class="ttl"></span>';
      b.querySelector(".n").textContent = String(i + 1);
      b.querySelector(".t").textContent = fmt(cue.t);
      b.querySelector(".ttl").textContent = body.title || cue.slide;
      b.addEventListener("click", function () { seekTo(i); });
      list.appendChild(b);
    });

    cur = 0;
    render(0);
  }).catch(function (e) {
    document.getElementById("crumb").textContent = "読み込みエラー: " + e.message;
    warn("ブックを読み込めませんでした: " + e.message);
  });
})();
</script>
</body>
</html>
