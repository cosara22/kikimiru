  // ================= プレイヤーオーバーレイ制御 =================
  // YouTube Music参照: ミニプレイヤーからページ遷移せず展開し、引き下げで縮小する。
  // <audio> はオーバーレイ内に留まり破棄されないため、開閉しても再生が途切れない。
  var overlayOpen = false;
  var overlayBookId = null;

  function openPlayerOverlay(bookId) {
    if (overlayOpen && overlayBookId === bookId) return;
    var host = document.getElementById("playerHost");
    var start = function () {
      host.textContent = "";
      overlayBookId = bookId;
      overlayOpen = true;
      document.body.classList.remove("player-closing");
      document.body.classList.add("player-open");
      // URLを差し替えて共有・再読込・戻るに耐えるようにする(遷移はしない)
      try {
        history.pushState({ player: bookId }, "", qs({ book: bookId }));
      } catch (e) { /* file:// 等では無視 */ }
      viewPlayer(bookId, host);
    };
    // View Transitions が使えるならミニ⇄全画面をブラウザに補間させる
    if (document.startViewTransition) document.startViewTransition(start);
    else start();
  }

  function closePlayerOverlay(replaceUrl) {
    if (!overlayOpen) return;
    overlayOpen = false;
    document.body.classList.add("player-closing");
    document.body.classList.remove("player-open");
    document.body.classList.remove("immersive", "ui-hidden", "show-strip");
    document.getElementById("playerOverlay").style.transform = "";
    // 中身は破棄しない — <audio> を生かしたまま隠すことで再生が途切れない
    // (YouTube Music が dismiss を廃止したのと同じ考え方。破棄は別ブックを開くとき)
    setTimeout(function () {
      if (!overlayOpen) document.body.classList.remove("player-closing");
    }, 380);
    if (replaceUrl !== false) {
      try { history.pushState({}, "", qs({ view: state.view })); } catch (e) {}
    }
    // 閉じたらドックを出し直す(再生は継続している)
    api("/api/books").then(function (d) { renderDock(d.books); }).catch(function () {});
  }

  // 引き下げジェスチャー(2段スナップ: 速度500px/s超は方向優先、以下は距離で判定)
  (function initDragToClose() {
    var overlay = document.getElementById("playerOverlay");
    var handle = document.getElementById("dragHandle");
    var startY = 0, startT = 0, dragging = false, lastY = 0, lastT = 0;

    function down(ev) {
      if (!overlayOpen) return;
      dragging = true;
      startY = lastY = ev.clientY;
      startT = lastT = performance.now();
      document.body.classList.add("player-dragging");
      handle.setPointerCapture(ev.pointerId);
    }
    function move(ev) {
      if (!dragging) return;
      var dy = Math.max(0, ev.clientY - startY);   // 下方向のみ追従
      overlay.style.transform = "translateY(" + dy + "px)";
      lastY = ev.clientY; lastT = performance.now();
    }
    function up(ev) {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove("player-dragging");
      var dy = Math.max(0, ev.clientY - startY);
      var dt = Math.max(1, performance.now() - lastT + 1);
      var velocity = (ev.clientY - lastY) / dt * 1000;   // px/s
      overlay.style.transform = "";
      // フリック速度が閾値超なら位置に関係なく方向優先、以下なら移動距離で判定
      var shouldClose = velocity > 500 || (velocity > -500 && dy > window.innerHeight * 0.25);
      if (shouldClose) closePlayerOverlay();
    }
    handle.addEventListener("pointerdown", down);
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
    handle.addEventListener("click", function () { if (overlayOpen) closePlayerOverlay(); });
    handle.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); closePlayerOverlay(); }
    });
  })();

  // 戻る操作でオーバーレイを閉じる(履歴と表示を一致させる)
  window.addEventListener("popstate", function (ev) {
    var wantPlayer = ev.state && ev.state.player;
    if (overlayOpen && !wantPlayer) closePlayerOverlay(false);
    else if (!overlayOpen && wantPlayer) openPlayerOverlay(wantPlayer);
  });

  // ================= プレイヤー画面(没入) =================
  function viewPlayer(bookId, hostEl) {
    var lib = state.lib;
    var base = bookBase(lib, bookId);
    // hostEl があればオーバーレイ内へ描く(ページ遷移せず展開する経路)。
    // 無い場合は従来どおり本文領域へ描く(?book= 直リンク・再読込)
    var content = hostEl || document.getElementById("content");
    content.textContent = "";

    var glow = el("div", "glow");
    glow.setAttribute("aria-hidden", "true");
    content.appendChild(glow);

    var stage = el("div", "stage");
    var pane = el("main", "playerpane");
    pane.setAttribute("aria-label", "プレイヤー");
    // 静的な骨組みのみをinnerHTMLで作る(外部データは後から必ずtextContentで入れる)
    pane.innerHTML =
      '<div class="chrome">' +
      '<a class="cbtn" id="dismiss" aria-label="プレイヤーを閉じる">' + I.chevD + '</a>' +
      '<div class="ctx"><span class="s" id="ctxSeries"></span><span class="t" id="ctxTitle"></span></div>' +
      '<button class="zoom-btn" id="zoomBtn" type="button" aria-label="スライドを最大化">' + I.expand + '</button>' +
      '<a class="cbtn" id="toDetail" aria-label="ブック詳細">' + I.series + '</a>' +
      '</div>' +
      '<div id="resume"><span>前回の続き <b id="resumeAt"></b> から再開します</span><button id="resumeOff" type="button" aria-label="最初から再生">×</button></div>' +
      '<section id="slide" aria-live="polite"></section>' +
      '<div class="ovl-bottom">' +
      '<div class="counter">スライド <b id="mSlide">–</b> / <span id="mTotal">–</span></div>' +
      '<div class="scrubber" aria-label="シークバー"><div class="scrub-track" id="track">' +
      '<div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>' +
      '<div class="times"><span id="tCur">0:00</span><span id="tRemain">−0:00</span></div></div>' +
      '<div class="transport">' +
      '<button class="speed" id="speed" type="button" aria-label="再生速度の変更"></button>' +
      '<button class="tbtn small" id="prev" type="button" aria-label="前のスライド">' + I.prevSlide + '</button>' +
      '<button class="tbtn skipnum" id="back10" type="button" aria-label="10秒戻す">' + I.back10 + '<span class="n">10</span></button>' +
      '<button class="play-main" id="playBtn" type="button" aria-label="再生">' + I.playBig + '</button>' +
      '<button class="tbtn skipnum" id="fwd10" type="button" aria-label="10秒進める">' + I.fwd10 + '<span class="n">10</span></button>' +
      '<button class="tbtn small" id="next" type="button" aria-label="次のスライド">' + I.nextSlide + '</button>' +
      '</div>' +
      '<div class="strip-head"><span class="h">スライド一覧</span><span class="sub">タップで移動</span></div>' +
      '<div class="strip" id="strip" role="list"></div>' +
      '<button class="list-btn" id="listBtn" type="button" aria-label="スライド一覧の表示切替">一覧</button>' +
      '</div>' +
      '<audio id="audio" preload="metadata" style="display:none"></audio>';
    stage.appendChild(pane);
    content.appendChild(stage);

    var dismissEl = document.getElementById("dismiss");
    dismissEl.href = qs({ view: "book", book: bookId });
    document.getElementById("toDetail").href = qs({ view: "book", book: bookId });
    // オーバーレイで開いている場合、閉じるボタンはページ遷移せず縮小する
    if (hostEl) {
      dismissEl.addEventListener("click", function (ev) {
        ev.preventDefault();
        closePlayerOverlay();
      });
    }

    // ---- 没入モード(スライド最大化) ----
    // 端末ごとに好みを記憶する。モバイルは既定で没入(縦画面ではこれが最も読める)
    var isNarrow = window.matchMedia("(max-width: 760px)").matches;
    var savedImmersive = lsGet("kikimiru.immersive");
    var immersive = savedImmersive === null ? isNarrow : savedImmersive === "1";
    var zoomBtn = document.getElementById("zoomBtn");
    var hideTimer = null;

    function showUI() {
      document.body.classList.remove("ui-hidden");
      if (hideTimer) clearTimeout(hideTimer);
      // 再生中だけ自動で隠す(停止中は操作したいはずなので出したままにする)
      var audioEl = document.getElementById("audio");
      if (immersive && audioEl && !audioEl.paused) {
        hideTimer = setTimeout(function () {
          document.body.classList.add("ui-hidden");
        }, 2600);
      }
    }
    // オーバーレイの実高を測ってCSS変数へ入れる(内容や画面幅が変わっても追従する)
    function measureOverlays() {
      if (!immersive) return;
      var chromeEl = document.querySelector(".chrome");
      var ovlEl = document.querySelector(".ovl-bottom");
      if (!chromeEl || !ovlEl) return;
      var top = Math.round(chromeEl.getBoundingClientRect().height);
      var bottom = Math.round(ovlEl.getBoundingClientRect().height);
      document.body.style.setProperty("--ovl-top", top + "px");
      document.body.style.setProperty("--ovl-bottom", bottom + "px");
    }

    function applyImmersive() {
      document.body.classList.toggle("immersive", immersive);
      zoomBtn.innerHTML = immersive ? I.collapse : I.expand;
      zoomBtn.setAttribute("aria-label", immersive ? "最大化を解除" : "スライドを最大化");
      if (!immersive) {
        document.body.classList.remove("ui-hidden");
        if (hideTimer) clearTimeout(hideTimer);
      } else {
        showUI();
      }
      // レイアウト確定後に測る(スライド一覧の生成前後で高さが変わるため2回)
      requestAnimationFrame(measureOverlays);
      setTimeout(measureOverlays, 300);
    }
    window.addEventListener("resize", measureOverlays);
    zoomBtn.addEventListener("click", function () {
      immersive = !immersive;
      lsSet("kikimiru.immersive", immersive ? "1" : "0");
      applyImmersive();
    });
    // 没入時のスライド一覧トグル(既定は畳んでスライドに面積を譲る)
    document.getElementById("listBtn").addEventListener("click", function () {
      document.body.classList.toggle("show-strip");
      requestAnimationFrame(measureOverlays);
      showUI();
    });
    // 操作の気配があればUIを出す(マウス移動・タップ・キー)
    ["mousemove", "pointerdown", "keydown"].forEach(function (ev) {
      document.addEventListener(ev, function () { if (immersive) showUI(); });
    });
    // 没入中にスライド面をタップ/クリックしたらUIの表示を切り替える
    document.getElementById("slide").addEventListener("click", function () {
      if (!immersive) return;
      if (document.body.classList.contains("ui-hidden")) showUI();
      else document.body.classList.add("ui-hidden");
    });

    // ---- 縦画面: 端末を横向きにすると全画面になることを初回だけ案内する ----
    function isPortraitNarrow() {
      return window.matchMedia("(orientation: portrait) and (max-width: 760px)").matches;
    }
    function showRotateHint() {
      if (!immersive || !isPortraitNarrow()) return;
      if (lsGet("kikimiru.rothint") === "1") return;
      lsSet("kikimiru.rothint", "1");
      var hint = el("div", "rot-hint", "横向きにすると全画面で読めます");
      document.body.appendChild(hint);
      setTimeout(function () {
        hint.style.opacity = "0";
        setTimeout(function () { hint.remove(); }, 450);
      }, 3500);
    }
    applyImmersive();
    setTimeout(showRotateHint, 1200);

    Promise.all([
      fetch(base + "deck.json").then(function (r) { if (!r.ok) throw new Error("deck.json " + r.status); return r.json(); }),
      // content.json は無くても動く(構造/本文分離): その場合はスライドID・種別のみ表示
      fetch(base + "content.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      // 書誌(カバー・著者・シリーズ)はミニ情報として使う。取れなくても再生は成立させる
      getBook(bookId).catch(function () { return null; })
    ]).then(function (res) {
      var deck = res[0];
      var meta = res[2];
      // プロトタイプ汚染耐性: 外部データ(スライドid)をキーにするためObject.create(null)にする
      var bodyMap = Object.create(null);
      if (res[1] && res[1].slides) {
        Object.keys(res[1].slides).forEach(function (k) { bodyMap[k] = res[1].slides[k]; });
      }

      var title = (typeof deck.title === "string" && deck.title) || bookId;
      document.getElementById("ctxTitle").textContent = title;
      if (meta && meta.series) {
        document.getElementById("ctxSeries").textContent =
          meta.series.name + (meta.series.sequence ? " #" + meta.series.sequence : "");
      }
      document.title = title + " — kikimiru";
      if (!res[1]) warn("content.json が無いため、スライドは構成情報のみ表示しています。");

      if ("mediaSession" in navigator) {
        var msMeta = { title: title, artist: (meta && meta.authors && meta.authors.join(" / ")) || "kikimiru" };
        if (meta && meta.cover) {
          msMeta.artwork = [{ src: bookBase(lib, bookId) + encodeURIComponent(meta.cover) }];
        }
        navigator.mediaSession.metadata = new MediaMetadata(msMeta);
      }

      var audio = document.getElementById("audio");

      // audio.src の組み立て前にファイル名を検証する(パス区切り・親ディレクトリ参照・
      // クエリ/フラグメントの混入を拒否し、意図しないリクエストになるのを防ぐ)
      var audioName = (deck.audio && typeof deck.audio.src === "string" && deck.audio.src) || "audio.mp3";
      if (/[\/\\]|\.\.|[?#]/.test(audioName)) {
        warn("音声ファイル名が不正なため読み込みを中止しました: " + audioName);
      } else {
        audio.addEventListener("error", function () {
          warn("音声を読み込めませんでした: " + audioName);
        });
        audio.src = base + encodeURIComponent(audioName);
      }

      var cues = (deck.cues || []).slice().sort(function (a, b) { return a.t - b.t; });
      if (!cues.length) {
        // cuesが空のdeckはcues[0]参照で例外になりUIが半壊するため、ここで止める
        warn("この本には再生可能なスライドがありません(deck.jsonのcuesが空です)");
        return;
      }

      var slideMeta = Object.create(null);
      (deck.slides || []).forEach(function (s) { if (s && s.id) slideMeta[s.id] = s; });
      var cur = -1;

      function dur() { return audio.duration || (deck.audio && deck.audio.duration) || 0; }

      document.getElementById("mTotal").textContent = String(cues.length);

      // ---- スライド描画 ----
      var slideEl = document.getElementById("slide");

      // 画像スライド(v2.1)のパス検証とURL化。各セグメントを個別に検査・エンコード
      function slideImageUrl(image) {
        if (typeof image !== "string" || !image) return null;
        var segs = image.split("/");
        if (segs.length > 2) return null;
        for (var k = 0; k < segs.length; k++) {
          if (!segs[k] || segs[k].charAt(0) === "." ||
              /\\|\.\.|[?#]/.test(segs[k])) return null;
        }
        return base + segs.map(encodeURIComponent).join("/");
      }
      // 先読み済み画像の保持。切替時に「読み込み済みか」を同期的に判定できるようにし、
      // テキスト面が一瞬見えてから画像に差し替わる(チラつき)のを防ぐ
      var imgCache = Object.create(null);
      function prefetchSlideImage(i) {
        if (i < 0 || i >= cues.length) return;
        var sm2 = slideMeta[cues[i].slide] || {};
        var url = slideImageUrl(sm2.image);
        if (!url || imgCache[url]) return;
        var im = new Image();
        im.src = url;
        imgCache[url] = im;
      }

      function render(i) {
        var cue = cues[i];
        var sm = slideMeta[cue.slide] || {};
        var body = bodyMap[cue.slide] || {};
        var kind = safeKind(sm.kind);
        var imgUrl = slideImageUrl(sm.image);
        // 画像が既に読み込み済みなら、テキスト面を描く前に has-img を付けておく
        // (className を組み立てる時点で決めるため、1フレームも露出しない)
        var cached = imgUrl ? imgCache[imgUrl] : null;
        var readyNow = !!(cached && cached.complete && cached.naturalWidth > 0);
        slideEl.className = "kind-" + kind + (readyNow ? " has-img" : "");
        // 切替アニメーション(クラスを外して再付与し、リフローで再始動)
        void slideEl.offsetWidth;
        slideEl.classList.add("flip");
        slideEl.innerHTML = '<div class="kind"></div><h2></h2>';
        var kindLabel = { title: "タイトル", section: "セクション", question: "考えてみる" }[kind] || ("スライド " + (i + 1));
        slideEl.querySelector(".kind").textContent = kindLabel;
        slideEl.querySelector("h2").textContent = body.title || cue.slide;
        if (body.bullets && body.bullets.length) {
          var ul = document.createElement("ul");
          body.bullets.forEach(function (b) {
            var li = document.createElement("li");
            li.textContent = b;
            ul.appendChild(li);
          });
          slideEl.appendChild(ul);
        }
        if (body.note) slideEl.appendChild(el("div", "note", body.note));

        // 画像スライド: テキスト面の上に全面表示。意味層(alt/本文)は読み上げ・
        // 検索・画像ロード失敗時のフォールバックとして機能する
        if (imgUrl) {
          var img = document.createElement("img");
          img.className = "slide-img";
          img.alt = (typeof body.alt === "string" && body.alt) || body.title || cue.slide;
          if (!readyNow) {
            // 未読込のときだけ load を待つ(この間はテキスト面が見えるが、
            // 先読みが効いていれば通常ここへは来ない)
            img.addEventListener("load", function () { slideEl.classList.add("has-img"); });
          }
          // ロード失敗時はテキスト面がそのまま見える(has-imgを外す)
          img.addEventListener("error", function () {
            img.remove();
            slideEl.classList.remove("has-img");
          });
          img.src = imgUrl;
          if (!imgCache[imgUrl]) imgCache[imgUrl] = img;
          slideEl.appendChild(img);
        }
        // 前後2枚を先読みしておく(逆再生・シークでもチラつかせない)
        prefetchSlideImage(i + 1);
        prefetchSlideImage(i + 2);
        prefetchSlideImage(i - 1);
        document.getElementById("mSlide").textContent = String(i + 1);
        // フィルムストリップの状態更新
        var thumbs = document.querySelectorAll("#strip .thumb");
        thumbs.forEach(function (elm, j) {
          elm.classList.toggle("cur", j === i);
          elm.classList.toggle("played", j < i);
          if (j === i) elm.setAttribute("aria-current", "true");
          else elm.removeAttribute("aria-current");
        });
        if (thumbs[i]) thumbs[i].scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      function cueAt(t) {
        var i = 0;
        while (i + 1 < cues.length && cues[i + 1].t <= t) i++;
        return i;
      }

      // ---- スクラバー ----
      var track = document.getElementById("track");
      var fill = document.getElementById("fill");
      var knob = document.getElementById("knob");
      function paintScrub() {
        var d = dur();
        var pct = d > 0 ? Math.min(1, audio.currentTime / d) : 0;
        fill.style.width = (pct * 100) + "%";
        knob.style.left = (pct * 100) + "%";
        document.getElementById("tCur").textContent = fmt(audio.currentTime);
        document.getElementById("tRemain").textContent = "−" + fmt(Math.max(0, d - audio.currentTime));
      }
      // cue位置の目盛(メタデータ取得後に配置。deck.audio.durationがあれば先に描ける)
      function paintCueDots() {
        var d = dur();
        if (!d) return;
        track.querySelectorAll(".cue").forEach(function (c) { c.remove(); });
        cues.forEach(function (cue, i) {
          if (i === 0) return;
          var dot = el("span", "cue");
          dot.style.left = (cue.t / d * 100) + "%";
          track.appendChild(dot);
        });
      }
      paintCueDots();
      audio.addEventListener("loadedmetadata", paintCueDots);
      function scrubTo(clientX) {
        var rect = track.getBoundingClientRect();
        var pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        var d = dur();
        if (d > 0) { audio.currentTime = pct * d; paintScrub(); }
      }
      var dragging = false;
      track.addEventListener("pointerdown", function (ev) {
        dragging = true;
        track.setPointerCapture(ev.pointerId);
        scrubTo(ev.clientX);
      });
      track.addEventListener("pointermove", function (ev) { if (dragging) scrubTo(ev.clientX); });
      track.addEventListener("pointerup", function () { dragging = false; });

      // ---- 再生/一時停止 ----
      var playBtn = document.getElementById("playBtn");
      function paintPlay() {
        playBtn.innerHTML = audio.paused ? I.playBig : I.pauseBig;
        playBtn.setAttribute("aria-label", audio.paused ? "再生" : "一時停止");
      }
      playBtn.addEventListener("click", function () {
        if (audio.paused) audio.play().catch(function () {});
        else audio.pause();
      });
      audio.addEventListener("play", paintPlay);
      audio.addEventListener("pause", paintPlay);
      paintPlay();
      // 再生を始めたら操作UIを自動的に引っ込める(没入時)。停止したら出したままにする
      audio.addEventListener("play", showUI);
      audio.addEventListener("pause", showUI);

      // ---- ±10秒 ----
      document.getElementById("back10").addEventListener("click", function () {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      });
      document.getElementById("fwd10").addEventListener("click", function () {
        audio.currentTime = Math.min(dur() || Infinity, audio.currentTime + 10);
      });

      // ---- 速度(サイクル式・端末に記憶) ----
      var RATES = [0.75, 1.0, 1.25, 1.5, 2.0];
      var rate = parseFloat(lsGet("kikimiru.rate") || "1") || 1.0;
      if (RATES.indexOf(rate) === -1) rate = 1.0;
      var speedBtn = document.getElementById("speed");
      function applyRate() {
        audio.playbackRate = rate;
        speedBtn.textContent = rate.toFixed(2).replace(/0$/, "").replace(/\.0$/, ".0") + "×";
        speedBtn.setAttribute("aria-label", "再生速度 " + rate + "倍(タップで変更)");
      }
      speedBtn.addEventListener("click", function () {
        rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
        lsSet("kikimiru.rate", String(rate));
        applyRate();
      });
      applyRate();
      // playbackRateはsrc設定後にリセットされる環境があるため再適用
      audio.addEventListener("loadedmetadata", function () { audio.playbackRate = rate; });

      // ---- 前後スライド ----
      function seekTo(i) {
        audio.currentTime = cues[i].t + 0.01;
        if (audio.paused) {
          // 自動再生ブロック時のunhandled promise rejectionを防ぐ
          audio.play().catch(function () {});
        }
      }
      document.getElementById("prev").addEventListener("click", function () { seekTo(Math.max(0, cur - 1)); });
      document.getElementById("next").addEventListener("click", function () { seekTo(Math.min(cues.length - 1, cur + 1)); });

      // ロック画面のスクラバー対応(位置情報の通知。5秒間引きで十分)
      function updatePositionState() {
        if (!("mediaSession" in navigator) || !("setPositionState" in navigator.mediaSession)) return;
        var d = dur();
        if (!d) return;
        try {
          navigator.mediaSession.setPositionState({
            duration: d,
            playbackRate: audio.playbackRate,
            position: Math.min(audio.currentTime, d)
          });
        } catch (e) { /* 一部環境の引数検証エラーは無視 */ }
      }

      if ("mediaSession" in navigator) {
        navigator.mediaSession.setActionHandler("previoustrack", function () { seekTo(Math.max(0, cur - 1)); });
        navigator.mediaSession.setActionHandler("nexttrack", function () { seekTo(Math.min(cues.length - 1, cur + 1)); });
        try {
          navigator.mediaSession.setActionHandler("play", function () { audio.play().catch(function () {}); });
          navigator.mediaSession.setActionHandler("pause", function () { audio.pause(); });
          navigator.mediaSession.setActionHandler("seekbackward", function () {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
          });
          navigator.mediaSession.setActionHandler("seekforward", function () {
            audio.currentTime = Math.min(dur() || Infinity, audio.currentTime + 10);
          });
          navigator.mediaSession.setActionHandler("seekto", function (detail) {
            if (detail.fastSeek && "fastSeek" in audio) { audio.fastSeek(detail.seekTime); }
            else { audio.currentTime = detail.seekTime; }
            updatePositionState();
          });
        } catch (e) { /* 未対応環境は無視 */ }
        audio.addEventListener("loadedmetadata", updatePositionState);
        audio.addEventListener("ratechange", updatePositionState);
      }

      // ---- キーボード操作(Space=再生/停止・←→=前後スライド) ----
      document.addEventListener("keydown", function (ev) {
        var tg = ev.target;
        if (tg && /^(INPUT|SELECT|TEXTAREA|BUTTON|AUDIO)$/.test(tg.tagName)) return;
        if (ev.key === " ") {
          ev.preventDefault();
          if (audio.paused) audio.play().catch(function () {});
          else audio.pause();
        } else if (ev.key === "ArrowLeft") {
          seekTo(Math.max(0, cur - 1));
        } else if (ev.key === "ArrowRight") {
          seekTo(Math.min(cues.length - 1, cur + 1));
        } else if (ev.key === "f" || ev.key === "F") {
          zoomBtn.click();   // 最大化のトグル
        } else if (ev.key === "Escape" && immersive) {
          zoomBtn.click();   // 最大化の解除
        }
      });

      // ---- 進行と保存 ----
      var lastSaved = 0;
      audio.addEventListener("timeupdate", function () {
        var i = cueAt(audio.currentTime);
        if (i !== cur) { cur = i; render(i); }
        paintScrub();
        // 再生位置の保存は5秒ごとに間引く(毎timeupdateで書くとストレージ書き込みが過剰)
        var now = Date.now();
        if (now - lastSaved > 5000 && !audio.paused) {
          lastSaved = now;
          savePos(lib, bookId, audio.currentTime, dur(), cur + 1, cues.length);
          updatePositionState();
        }
      });
      // 離脱時にも保存する(モバイルSafariはunloadが来ないためpagehide/visibilitychangeで)
      function saveNow() {
        if (audio.currentTime > 0) {
          savePos(lib, bookId, audio.currentTime, dur(), cur + 1, cues.length);
        }
      }
      window.addEventListener("pagehide", saveNow);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") saveNow();
      });
      audio.addEventListener("pause", saveNow);

      // 端末間同期: 再生中は30秒ごと、停止・離脱時は即時に送る
      // (saveNow が先に登録済みのため、送信時にはdirtyが最新化されている)
      setInterval(function () { if (!audio.paused) syncProgressUp(); }, 30000);
      audio.addEventListener("pause", function () { syncProgressUp(); });
      window.addEventListener("pagehide", function () { syncProgressUp(true); });

      // ---- 前回の続きから再開(先頭・末尾付近の保存値は無視する) ----
      // ?restart=1(詳細画面の「最初から再生」)なら保存値を破棄して先頭から
      if (params.get("restart")) clearPos(lib, bookId);
      var saved = loadPos(lib, bookId);
      if (saved && saved.t > 10 && (!saved.d || saved.t < saved.d - 5)) {
        var bar = document.getElementById("resume");
        var resumeDismissed = false;
        bar.style.display = "flex";
        document.getElementById("resumeAt").textContent = fmt(saved.t);
        audio.addEventListener("loadedmetadata", function () {
          if (!resumeDismissed) { audio.currentTime = saved.t; paintScrub(); }
        }, { once: true });
        document.getElementById("resumeOff").addEventListener("click", function () {
          resumeDismissed = true;
          bar.style.display = "none";
          audio.currentTime = 0;
          cur = -1;
          render(cueAt(0));
          paintScrub();
        });
        // 用が済んだら自動的に引っ込める(6秒。スライド面を長く覆わない)。
        // 「最初から」を押す機会は残しつつ、押されなければ黙って消える
        setTimeout(function () {
          if (resumeDismissed) return;
          bar.style.transition = "opacity .4s linear";
          bar.style.opacity = "0";
          setTimeout(function () {
            if (!resumeDismissed) bar.style.display = "none";
          }, 420);
        }, 6000);
      }

      // ---- フィルムストリップ ----
      var strip = document.getElementById("strip");
      cues.forEach(function (cue, i) {
        var body = bodyMap[cue.slide] || {};
        var b = document.createElement("button");
        b.type = "button";
        b.className = "thumb";
        b.setAttribute("role", "listitem");
        var row = el("span", "row");
        row.appendChild(el("span", "no", String(i + 1)));
        row.appendChild(el("span", "tm", fmt(cue.t)));
        b.appendChild(row);
        b.appendChild(el("span", "tt", body.title || cue.slide));
        b.addEventListener("click", function () { seekTo(i); });
        strip.appendChild(b);
      });

      // 画像スライドのブックは全枚を裏で先読みしておく(切替のチラつきを完全に無くす。
      // 画像は1枚あたり数十〜数百KBで、シーク主体の使い方でも待たされないことを優先する)
      if (cues.some(function (c) { return (slideMeta[c.slide] || {}).image; })) {
        cues.forEach(function (_c, i) { prefetchSlideImage(i); });
      }

      cur = 0;
      render(0);
      paintScrub();
    }).catch(function (e) {
      warn("ブックを読み込めませんでした: " + (e.message || e));
    });
  }

  // ================= 起動 =================
  fetch("/api/libraries").then(function (r) {
    if (r.status === 401) { showLogin(); return null; }
    return r.json();
  }).then(function (d) {
    if (!d) return;  // ログイン待ち
    var libs = d.libraries || [];
    if (!libs.length) {
      warn("ライブラリがありません。--library でブックフォルダのディレクトリを指定してください。");
      return;
    }
    // 選択中ライブラリの解決(URL > localStorage > 先頭)
    var known = libs.map(function (l) { return l.id; });
    if (known.indexOf(state.lib) === -1) state.lib = known[0];
    lsSet("kikimiru.lib", state.lib);

    renderShell();
    initLibSelect(libs);

    // 進捗をサーバとマージしてから描画する(続きから・ドックが端末横断で揃う)
    syncProgressDown().then(function () {
      var book = params.get("book");
      switch (state.view) {
        case "player": viewPlayer(book); return;  // 没入画面: ドックは出さない
        case "book": viewBook(book); break;
        case "library": viewLibrary(); break;
        case "series": viewSeries(); break;
        case "search": viewSearch(); break;
        case "authors": viewPeople("authors"); break;
        case "narrators": viewPeople("narrators"); break;
        case "tags": viewTags(); break;
        case "stats": viewStats(); break;
        case "collections": viewCollections(); break;
        default: state.view = "home"; renderShell(); viewHome();
      }
      // 再開ドック(プレイヤー以外の全画面)
      api("/api/books").then(function (d2) { renderDock(d2.books); }).catch(function () {});
    });
  }).catch(function () {
    warn("サーバに接続できません。");
  });
})();
</script>
</body>
</html>
