<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kikimiru</title>
<link rel="manifest" href="/web/manifest.webmanifest">
<meta name="theme-color" content="#131519">
<link rel="icon" href="/web/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/web/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="kikimiru">
<style>
  /* =========================================================
     kikimiru — 単一ファイルのライブラリ+プレイヤーUI(ネイティブアプリ文法)
     Large Title / 水平カルーセル / カバー前面 / グループ化リスト /
     下部タブバー / 再開ドック / 2表示タブのNow Playing。
     アクセントはリーフグリーン1色。単一ファイル・外部CDNなし。
     配色・アイコンはすべて自作(参照アプリの意匠は使用しない)。
     ========================================================= */
  /* 配色トークン(暖色ニュートラル+構造色)。
     ライト/ダークの両方を持ち、既定はOS設定に従う(手動切替も可)。 */
  :root, [data-theme="dark"] {
    --bg: #131519;              /* bg-app: 地 */
    --bg-elev: #1c1f24;         /* paper: 浮き面(カード・検索・グループ) */
    --bg-elev2: #20242a;        /* paper-2: さらに一段(hover・プレースホルダ) */
    --sep: #2c2f35;             /* line-1 */
    --sep-2: #393d44;           /* line-2 */
    --ink: #e7e3da;
    --ink2: #a6a299;
    --ink3: #7d7a72;
    --tint: #6ea4dc;            /* brand: 構造色(リンク・現在地・アクセント) */
    --tint-soft: #1f2d3c;       /* brand-soft: 選択面 */
    --tint-hi: #8fbce8;
    --on-tint: #10151b;         /* 構造色の上に載せる文字 */
    --ok: #6dba88;              /* resolved: 聴了 */
    --warn: #d6a85a;            /* reply: 進行中・注意 */
    --r-cover: 8px; --r-card: 12px; --r-field: 10px; --r-sheet: 16px;
    --ease: cubic-bezier(.32,.72,0,1);
    /* 画面遷移の運動規律: 入場は減速カーブで長め・退出は加速カーブで短く */
    --ease-in-emph: cubic-bezier(.05,.7,.1,1);
    --ease-out-emph: cubic-bezier(.3,0,.8,.15);
    --dur-enter: 500ms; --dur-exit: 350ms; --dur-snap: 400ms;
    /* テーマ非依存の薄膜(前景色ベース)。ライトでは黒、ダークでは白が乗る */
    --veil-1: rgba(255,255,255,.06);
    --veil-2: rgba(255,255,255,.10);
    --veil-3: rgba(255,255,255,.16);
    --sh-card: 0 2px 8px rgba(0,0,0,.5);
    --sh-float: 0 14px 40px rgba(0,0,0,.5);
    --sh-deep: 0 24px 70px rgba(0,0,0,.55);
    --overlay-bg: rgba(19,21,25,.94);   /* オーバーレイ下地(bg-appベース) */
    --scrim: rgba(0,0,0,.5);            /* 画像上のバッジ地 */
    --stage-bg: #000;                   /* 画像スライドのレターボックス地 */
    --slide-bg: #1c1f24;                /* テキストスライドの面 */
    --slide-ink: #e7e3da;
    --knob: #fff;
  }
  [data-theme="light"] {
    --bg: #efece5;              /* bg-app */
    --bg-elev: #fdfcf9;         /* paper */
    --bg-elev2: #f7f5f0;        /* paper-2 */
    --sep: #e6e2d8;             /* line-1 */
    --sep-2: #d6d1c5;           /* line-2 */
    --ink: #232019;
    --ink2: #5f5b51;
    --ink3: #8d887d;
    --tint: #2f6093;
    --tint-soft: #e8eff7;
    --tint-hi: #24507e;
    --on-tint: #ffffff;
    --ok: #3f8a5c;
    --warn: #a9772a;
    --veil-1: rgba(35,32,25,.05);
    --veil-2: rgba(35,32,25,.09);
    --veil-3: rgba(35,32,25,.14);
    --sh-card: 0 2px 8px rgba(40,36,28,.10);
    --sh-float: 0 10px 30px rgba(40,36,28,.16);
    --sh-deep: 0 18px 50px rgba(40,36,28,.22);
    --overlay-bg: rgba(239,236,229,.96);
    --scrim: rgba(35,32,25,.55);
    --stage-bg: #d8d4ca;               /* 明るい地でのレターボックス */
    --slide-bg: #fdfcf9;
    --slide-ink: #232019;
    --knob: #232019;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; min-height: 100dvh; }
  button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  svg { display: block; }
  ::placeholder { color: var(--ink3); }

  #warn { display: none; background: var(--tint-soft); color: var(--warn); font-size: 12.5px;
    padding: 8px 18px; border-bottom: 1px solid var(--sep-2); position: relative; z-index: 30; }

  /* ---- アプリ幅(iPad的な余白) ---- */
  .app { max-width: 980px; margin: 0 auto;
    padding: 10px 28px calc(170px + env(safe-area-inset-bottom, 0px)); }
  body.mode-player .app { max-width: none; padding: 0; }
  /* ?book= 直リンク時はプレイヤーが全画面を占める(空のナビ・見出しを出さない) */
  body.mode-player .navbar, body.mode-player .large-title { display: none; }

  /* ---- ナビゲーションバー(小) ---- */
  .navbar { display: flex; align-items: center; justify-content: space-between;
    height: 40px; gap: 8px; }
  .backlink { display: inline-flex; align-items: center; gap: 4px;
    font-size: 14.5px; font-weight: 600; color: var(--tint); padding: 6px 8px 6px 2px; }
  .backlink svg { width: 12px; height: 12px; }
  .lib-switch {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: none; color: var(--ink2);
    font-size: 14px; font-weight: 600; font-family: inherit;
    padding: 6px 22px 6px 10px; border-radius: 8px; max-width: 220px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" fill="none" stroke="%23a2aab3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>');
    background-repeat: no-repeat; background-position: right 6px center; background-size: 12px;
  }
  .lib-switch:hover { background-color: var(--bg-elev); }
  .lib-switch option { background: var(--bg-elev); color: var(--ink); }

  /* ---- Large Title ---- */
  .large-title { font-size: 34px; font-weight: 800; letter-spacing: .01em; margin: 2px 0 14px; }

  /* ---- オフラインバッジ(ヘッダ) ---- */
  #netBadge { align-items: center; font-size: 11.5px; font-weight: 700;
    color: var(--warn); border: 1px solid var(--warn); border-radius: 99px;
    padding: 3px 10px; margin-right: 6px; }
  /* オフライン中、保存されていないブックの再生CTAは薄く見せる(入口ガードは
     openPlayerOverlay 側で行うため、これは視覚上の予告) */
  body.app-offline .cta.cta-unsaved { opacity: .45; }

  /* ---- オフライン保存の管理画面 ---- */
  .off-gauge { background: var(--bg-elev); border-radius: var(--r-card);
    padding: 14px 16px; margin-bottom: 16px; }
  .off-gauge .row1 { display: flex; justify-content: space-between;
    font-size: 13px; color: var(--ink2); margin-bottom: 8px;
    font-variant-numeric: tabular-nums; }
  .off-gauge .bar { height: 6px; border-radius: 3px; background: var(--veil-2); }
  .off-gauge .bar i { display: block; height: 100%; border-radius: 3px;
    background: var(--tint); }
  .off-row-del { color: var(--warn); font-size: 12.5px; font-weight: 600;
    flex-shrink: 0; padding: 6px 10px; border-radius: 8px; }
  .off-row-del:hover { background: var(--veil-1); }

  /* ---- 検索フィールド ---- */
  .search {
    display: flex; align-items: center; gap: 9px; width: 100%;
    background: var(--bg-elev); border-radius: var(--r-field); border: none;
    padding: 10px 12px; margin-bottom: 22px; color: var(--ink3);
    font-size: 15px; text-align: left;
  }
  .search svg { width: 16px; height: 16px; flex-shrink: 0; }
  .search input { flex: 1; min-width: 0; background: none; border: none;
    color: var(--ink); font-size: 15px; font-family: inherit; outline: none; }

  /* ---- セクション ---- */
  section.sec { margin-bottom: 24px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .sec-head h2 { font-size: 21px; font-weight: 700; }
  .sec-head .all { font-size: 13.5px; font-weight: 600; color: var(--tint);
    display: inline-flex; align-items: center; gap: 3px; }
  .sec-head .all svg { width: 10px; height: 10px; }

  /* ---- 水平カルーセル ---- */
  .carousel { display: flex; gap: 14px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    scroll-snap-type: x proximity; padding-bottom: 4px; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel > * { scroll-snap-align: start; flex-shrink: 0; }

  /* ---- 続きから: 横長レジュームカード ---- */
  .resume-card { width: 430px; max-width: 86vw; display: flex; align-items: center; gap: 14px;
    background: var(--bg-elev); border-radius: var(--r-card); padding: 10px 12px;
    transition: background-color .12s linear; }
  .resume-card:hover { background: var(--bg-elev2); }
  .resume-card .cov { width: 60px; height: 60px; border-radius: var(--r-cover);
    overflow: hidden; flex-shrink: 0; background: var(--bg-elev2); position: relative; }
  .resume-card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .resume-card .t { font-size: 14.5px; font-weight: 600; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resume-card .m { font-size: 12px; color: var(--ink2); }
  .resume-card .bar { height: 4px; border-radius: 2px; background: var(--veil-2); margin-top: 4px; }
  .resume-card .bar i { display: block; height: 100%; border-radius: 2px; background: var(--tint); }
  .play-circ { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: var(--tint); color: var(--on-tint);
    display: inline-flex; align-items: center; justify-content: center; }
  .resume-card:hover .play-circ { background: var(--tint-hi); }
  .play-circ svg { width: 18px; height: 18px; margin-left: 2px; }

  /* ---- カバー前面ブックカード ---- */
  .book-card { width: 184px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .book-card .cov { position: relative; width: 100%; aspect-ratio: 1;
    border-radius: var(--r-cover); overflow: hidden; background: var(--bg-elev);
    box-shadow: 0 1px 0 var(--veil-1) inset; display: block; }
  .cov img, .detail .cover img, .simg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 縦長(書籍型)の表紙: 正方形タイルでは切り抜かず全体を収め、
     余白はぼかした同じ表紙で埋める(coverIntoが縦横比で自動判定して付与) */
  /* 二重クラスで詳細度を上げる(後方の .np-cover img 等の cover 指定に勝つため) */
  .cov-tall.cov-tall img { object-fit: contain; position: relative; z-index: 1; }
  .cov-tall.cov-tall img.cov-bg { position: absolute; inset: 0; z-index: 0;
    object-fit: cover; filter: blur(16px) brightness(.6) saturate(1.1);
    transform: scale(1.3); }
  .book-card .t { font-size: 13.5px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .book-card a:hover .t, .book-card .t a:hover { color: var(--tint); }
  .book-card .a { font-size: 12px; color: var(--ink2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-card .m { font-size: 11.5px; color: var(--ink3); }

  /* カバー無しプレースホルダ(自作グリフ+タイトル) */
  .ph-fill { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; background: var(--bg-elev2); }
  .ph-fill svg { width: 34%; height: auto; max-width: 44px; color: var(--ink3); }
  .ph-fill .pht { font-size: 11.5px; font-weight: 600; color: var(--ink2);
    text-align: center; padding: 0 12%; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* カバー下端の進捗・聴了バッジ */
  .cov .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: var(--scrim); }
  .cov .prog i { display: block; height: 100%; background: var(--tint); }
  .done-badge { position: absolute; right: 8px; top: 8px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--tint); color: var(--on-tint);
    display: flex; align-items: center; justify-content: center; }
  .done-badge svg { width: 12px; height: 12px; }
  /* オフライン保存済みバッジ(カバー左下。右上=聴了・左上=巻数・下端=進捗と重ねない) */
  .dl-badge { position: absolute; left: 8px; bottom: 10px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--scrim); color: #fff;
    display: flex; align-items: center; justify-content: center; }
  .dl-badge svg { width: 12px; height: 12px; }
  .seq-badge { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700;
    background: var(--scrim); color: var(--ink); border-radius: 6px; padding: 3px 7px; }

  /* デスクトップ: カバーhoverの再生オーバーレイ(即再生の保全) */
  .play-over { position: absolute; right: 8px; bottom: 10px; width: 38px; height: 38px;
    border-radius: 50%; background: var(--tint); color: var(--on-tint);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s linear; box-shadow: var(--sh-card); }
  .play-over svg { width: 15px; height: 15px; margin-left: 2px; }
  .book-card:hover .play-over, .play-over:focus-visible { opacity: 1; }
  @media (hover: none) { .play-over { display: none; } }

  /* ---- 縦グリッド(本棚・検索結果) ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px 14px; }
  .grid .book-card { width: auto; }

  /* ---- シリーズカード ---- */
  .series-card { display: flex; align-items: center; gap: 16px; width: 100%;
    background: var(--bg-elev); border-radius: var(--r-card); padding: 12px 14px;
    transition: background-color .12s linear; }
  .series-card:hover { background: var(--bg-elev2); }
  .series-card .stack { position: relative; width: 96px; height: 72px; flex-shrink: 0; }
  .series-card .stack .simg { position: absolute; width: 72px; height: 72px;
    border-radius: var(--r-cover); border: 1px solid var(--veil-2);
    overflow: hidden; background: var(--bg-elev2); }
  .series-card .stack .simg.back { left: 24px; top: 0; }
  .series-card .stack .simg.front { left: 0; top: 0; box-shadow: var(--sh-card); }
  .series-card .t { font-size: 15px; font-weight: 700; }
  .series-card .m { font-size: 12.5px; color: var(--ink2); margin-top: 4px; display: block; }
  .series-card .chev { margin-left: auto; color: var(--ink3); }
  .series-card .chev svg { width: 13px; height: 13px; }
  .series-list { display: flex; flex-direction: column; gap: 12px; }

  /* ---- グループ化されたリスト ---- */
  .group { background: var(--bg-elev); border-radius: var(--r-card); overflow: hidden; }
  .grow { display: flex; align-items: center; gap: 14px; width: 100%;
    min-height: 46px; padding: 4px 16px; text-align: left; font-size: 14.5px;
    transition: background-color .12s linear; position: relative; }
  .grow:hover { background: var(--bg-elev2); }
  .grow + .grow::before { content: ""; position: absolute; left: 50px; right: 0; top: 0;
    height: 1px; background: var(--sep); }
  .grow .gic { width: 22px; height: 22px; color: var(--tint); flex-shrink: 0; }
  .grow .gic svg { width: 22px; height: 22px; }
  .grow .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grow .val { font-size: 14px; color: var(--ink3); flex-shrink: 0; }
  .grow .chev { color: var(--ink3); flex-shrink: 0; }
  .grow .chev svg { width: 12px; height: 12px; }

  .two-col { display: grid; grid-template-columns: 380px 1fr; gap: 36px; align-items: start; }
  .browse-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---- ツールバー(絞り込みチップ・並び替え) ---- */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    color: var(--tint); background: var(--tint-soft); border: 1px solid var(--tint);
    border-radius: 8px; padding: 5px 11px; }
  .toolbar select { background: var(--bg-elev); color: var(--ink2); border: none;
    border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; }

  /* ---- 空状態 ---- */
  .empty { color: var(--ink2); font-size: 14px; padding: 18px 4px; line-height: 1.7; }
  .empty a { color: var(--tint); font-weight: 600; }
  .guide { background: var(--bg-elev); border-radius: var(--r-card); padding: 20px 22px;
    line-height: 1.8; font-size: 14px; color: var(--ink2); }
  .guide h3 { color: var(--ink); font-size: 16px; margin-bottom: 8px; }
  .guide code { background: var(--bg-elev2); border-radius: 6px; padding: 2px 7px;
    font-size: 12.5px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink); }
  .guide ol { margin: 6px 0 0 1.3em; }

  /* ---- 統計 ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .stile { background: var(--bg-elev); border-radius: var(--r-card); padding: 14px 16px; }
  .stile .v { font-size: 22px; font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .stile .l { font-size: 11.5px; color: var(--ink2); margin-top: 3px; }
  .stats-note { font-size: 12px; color: var(--ink3); margin-top: 12px; }

  /* ---- コレクション ---- */
  .colhead { display: flex; align-items: center; gap: 10px; margin: 22px 2px 10px; }
  .colhead .nm { font-size: 16px; font-weight: 700; }
  .colhead .ct { font-size: 12px; color: var(--ink3); }
  .colhead .ops { margin-left: auto; display: flex; gap: 6px; }
  .btn { background: var(--bg-elev); color: var(--ink2); border-radius: 9px;
    padding: 8px 14px; font-size: 13px; font-weight: 600;
    transition: background-color .12s linear, color .12s linear; }
  .btn:hover { background: var(--bg-elev2); color: var(--ink); }
  .btn.primary { background: var(--tint); color: var(--on-tint); }
  .btn.primary:hover { background: var(--tint-hi); }
  .btn.danger-armed { background: var(--warn); color: var(--on-tint); }
  .newcol { display: flex; gap: 8px; margin-bottom: 6px; }
  .newcol input { flex: 1; max-width: 320px; background: var(--bg-elev); border: none;
    border-radius: 9px; padding: 9px 12px; color: var(--ink); font-size: 14px; font-family: inherit; }
  .picker { background: var(--bg-elev); border-radius: var(--r-card);
    padding: 14px; margin: 10px 0 16px; display: flex; flex-direction: column; gap: 7px; }
  .picker label { display: flex; align-items: center; gap: 9px; font-size: 13.5px; padding: 3px 2px; }
  .picker input[type="checkbox"] { accent-color: var(--tint); width: 16px; height: 16px; }
  .picker .ops { display: flex; gap: 8px; margin-top: 9px; }

  /* ---- ブック詳細 ---- */
  .detail { max-width: 560px; margin: 0 auto; }
  .detail .cover { width: 200px; aspect-ratio: 1; border-radius: var(--r-cover);
    overflow: hidden; margin: 6px auto 18px; position: relative;
    box-shadow: var(--sh-float); background: var(--bg-elev); }
  .detail .btitle { font-size: 21px; font-weight: 800; text-align: center; line-height: 1.35; }
  .detail .bauthor { font-size: 14px; color: var(--tint); font-weight: 600;
    text-align: center; margin-top: 6px; display: block; }
  .detail .bmeta { font-size: 12.5px; color: var(--ink3); text-align: center; margin-top: 6px; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; margin: 18px 0 8px; background: var(--tint); color: var(--on-tint);
    border-radius: 12px; padding: 14px 0; font-size: 15.5px; font-weight: 700;
    transition: background-color .12s linear; }
  .cta:hover { background: var(--tint-hi); }
  .cta svg { width: 16px; height: 16px; }
  .sub-actions { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .sub-actions .sab { flex: 1 1 40%; font-size: 12.5px; font-weight: 600; color: var(--ink2);
    border: 1px solid var(--veil-3); border-radius: 10px; padding: 9px 0;
    text-align: center; transition: color .12s linear, border-color .12s linear; }
  .sub-actions .sab:hover { color: var(--ink); border-color: var(--sep-2); }
  .meta-group { background: var(--bg-elev); border-radius: var(--r-card);
    overflow: hidden; margin-bottom: 16px; }
  .mrow { display: flex; align-items: center; min-height: 44px; padding: 8px 14px; gap: 12px; }
  .mrow + .mrow { border-top: 1px solid var(--sep); }
  .mrow .k { font-size: 13px; color: var(--ink2); width: 62px; flex-shrink: 0; }
  .mrow .v { font-size: 13.5px; flex: 1; text-align: right; color: var(--ink); min-width: 0; }
  .mrow a.v { color: var(--tint); font-weight: 600; }
  .mrow .chev { color: var(--ink3); flex-shrink: 0; }
  .mrow .chev svg { width: 11px; height: 11px; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .tagchip { font-size: 11.5px; font-weight: 600; color: var(--ink2);
    background: var(--veil-2); border-radius: 6px; padding: 4px 9px; }
  .tagchip:hover { color: var(--tint); }
  .desc-h { font-size: 13px; font-weight: 700; color: var(--ink2);
    margin: 2px 2px 8px; letter-spacing: .04em; }
  .desc { font-size: 13.5px; line-height: 1.75; color: var(--ink2); white-space: pre-line; }
  .detail-rail { margin-top: 26px; }

  /* ---- 再開ドック(タブバー上・タップで再生画面へ) ---- */
  #dock { position: fixed; left: 0; right: 0; z-index: 20;
    bottom: calc(62px + env(safe-area-inset-bottom, 0px));
    background: var(--overlay-bg); backdrop-filter: blur(18px); border-top: 1px solid var(--sep); }
  #dock .inner { max-width: 980px; margin: 0 auto; padding: 8px 28px;
    display: flex; align-items: center; gap: 12px; position: relative; }
  #dock .mbar { position: absolute; left: 0; top: -1px; right: 0; height: 2px;
    background: var(--veil-2); }
  #dock .mbar i { display: block; height: 100%; background: var(--tint); }
  #dock .cov { width: 42px; height: 42px; border-radius: 6px; overflow: hidden; flex-shrink: 0;
    box-shadow: var(--sh-card); background: var(--bg-elev2); position: relative; }
  #dock .body { flex: 1; min-width: 0; }
  /* display:block が無いと span のままで ellipsis が効かず、
     長いタイトルが再生ボタンの下へ潜り込む(実機レビュー指摘) */
  #dock .t { display: block; font-size: 13.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dock .m { font-size: 11.5px; color: var(--ink2); margin-top: 2px; display: block; }
  #dock .play-circ { width: 38px; height: 38px; }
  #dock .play-circ svg { width: 15px; height: 15px; }

  /* ---- 下部タブバー ---- */
  /* 高さはsafe-area(iPhoneのホームインジケータ)分だけ外側に伸ばす。
     固定62pxのままpadding-bottomを足すと、アイコン+ラベルの領域が
     62-34=28px に潰れてレイアウトがずれる(実機レビュー指摘) */
  #tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    height: calc(62px + env(safe-area-inset-bottom, 0px));
    background: var(--overlay-bg); backdrop-filter: blur(18px); border-top: 1px solid var(--sep);
    display: flex; justify-content: center; align-items: center; gap: 70px;
    padding: 0 10px env(safe-area-inset-bottom, 0px); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 500; color: var(--ink3); min-width: 58px; }
  .tab svg { width: 24px; height: 24px; }
  .tab.cur { color: var(--tint); }
  body.mode-player #tabbar, body.mode-player #dock { display: none; }

  /* ================= プレイヤーオーバーレイ =================
     ページ遷移せずミニ⇄全画面を行き来する。<audio>は破棄されないので再生が途切れない。
     入場は減速カーブで長め、退出は加速カーブで短め */
  #playerOverlay {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: none; flex-direction: column;
    transform: translateY(100%);
    transition: transform var(--dur-enter) var(--ease-in-emph);
    will-change: transform;
  }
  body.player-open #playerOverlay { display: flex; transform: translateY(0); }
  body.player-closing #playerOverlay {
    transition: transform var(--dur-exit) var(--ease-out-emph);
    transform: translateY(100%);
  }
  /* ドラッグ追従中はトランジションを切る(指に張り付かせる) */
  body.player-dragging #playerOverlay { transition: none; }
  body.player-open { overflow: hidden; }
  body.player-open #dock { display: none; }
  /* 引き下げハンドル: 掴める範囲は広く(48px)、見た目のバーは細く残す
     — 視覚インジケータを残して「引き下げられる」ことを示す */
  .drag-handle { flex-shrink: 0; height: 22px; display: flex; align-items: center;
    justify-content: center; cursor: grab; touch-action: none; }
  .drag-handle::before { content: ""; width: 36px; height: 4px; border-radius: 2px;
    background: var(--sep-2); }
  .drag-handle:active { cursor: grabbing; }
  /* オーバーレイ内の描画先(プレイヤー本体は .np-wrap 側が持つ) */
  #playerHost { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ================= プレイヤー(Now Playing・再構築版) =================
     構成: 表紙(正方形)既定の縦積み画面+下部アクション列 /
     上部タブで表紙⇄スライド(16:9)を切替 /
     下スクロールで章要約が縦に積み上がり、タップでその時間へ飛ぶ /
     全画面はタップでコントロール表示・再生中は自動で隠れる */
  .np-wrap { position: relative; flex: 1; min-height: 0; display: flex;
    flex-direction: column; overflow: hidden; background: var(--bg); }
  body.mode-player .np-wrap { height: 100vh; height: 100dvh; }

  /* 表紙モードのぼかし背景(表紙自身をぼかして敷く)。下端は地色へ溶かす */
  .np-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .np-bg img { width: 100%; height: 100%; object-fit: cover;
    filter: blur(64px) saturate(1.15); transform: scale(1.5); opacity: .5; }
  [data-theme="light"] .np-bg img { opacity: .35; }
  .np-bg::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--bg) 30%, transparent) 0%,
      color-mix(in srgb, var(--bg) 55%, transparent) 45%,
      var(--bg) 82%); }
  .np-wrap.mode-slide .np-bg { display: none; }

  .np-scroll { position: relative; z-index: 1; flex: 1; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
    display: flex; flex-direction: column; }
  .np-scroll::-webkit-scrollbar { display: none; }

  /* ---- 上部バー: 閉じる / 表紙⇄スライドのセグメントタブ / 詳細 ---- */
  .np-top { position: sticky; top: 0; z-index: 40; flex-shrink: 0; }
  .np-wrap.scrolled .np-top { background: var(--overlay-bg);
    backdrop-filter: blur(16px); border-bottom: 1px solid var(--sep); }
  .np-top .row { display: flex; align-items: center; height: 52px; padding: 0 8px; }
  .np-icobtn { width: 42px; height: 42px; border-radius: 50%; color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background-color .12s linear; }
  .np-icobtn:hover { background: var(--veil-1); }
  .np-icobtn svg { width: 22px; height: 22px; }
  .np-seg { margin: 0 auto; display: flex; background: var(--veil-2);
    border-radius: 99px; padding: 3px; }
  .np-seg button { width: 52px; height: 34px; border-radius: 99px; color: var(--ink2);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .12s linear, color .12s linear; }
  .np-seg button.cur { background: var(--veil-3); color: var(--ink); }
  .np-seg svg { width: 20px; height: 20px; }

  /* 表紙モードでスクロールした時だけ出る小型バー(チャプター閲覧中も再生を手放さない) */
  .np-compact { display: none; align-items: center; gap: 10px; padding: 0 14px 10px; }
  .np-wrap.mode-cover.scrolled .np-compact { display: flex; }
  .np-compact .cc { width: 40px; height: 40px; border-radius: 6px; overflow: hidden;
    background: var(--bg-elev2); position: relative; flex-shrink: 0; }
  .np-compact .cc img { width: 100%; height: 100%; object-fit: cover; }
  .np-compact .ct { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np-compact .np-icobtn { width: 38px; height: 38px; }

  /* ---- メディア面 ---- */
  .np-media { position: relative; z-index: 30; width: 100%; flex-shrink: 0; }
  /* 表紙モード: 正方形ボックス */
  .np-cover { display: none; width: min(78vw, 44vh, 380px);
    width: min(78vw, 44dvh, 380px); aspect-ratio: 1;
    margin: 14px auto 6px; border-radius: 12px; overflow: hidden; position: relative;
    background: var(--bg-elev); box-shadow: var(--sh-deep); }
  .np-cover img { width: 100%; height: 100%; object-fit: cover; }
  .np-wrap.mode-cover .np-cover { display: block; }
  /* スライドモード: 16:9・幅いっぱい。スクロール中も上部に貼り付く */
  .np-stagebox { display: none; position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; overflow: hidden; container-type: inline-size;
    max-height: 52vh; max-height: 52dvh; margin: 0 auto; }
  .np-wrap.mode-slide .np-stagebox { display: block; }
  .np-wrap.mode-slide .np-media { position: sticky; top: 52px; background: var(--bg); }
  @media (min-width: 761px) {
    .np-stagebox { max-width: 92vh; max-width: 92dvh; }
  }

  /* スライド面(テキスト/画像)。文字サイズは面の幅に追従する(全画面でも同比率) */
  #slide { position: absolute; inset: 0; background: var(--slide-bg);
    display: flex; flex-direction: column; justify-content: center; gap: .6em;
    padding: 4% 6%; overflow: hidden; }
  #slide.flip { animation: slidefade .14s linear; }
  @keyframes slidefade { from { opacity: .45; } to { opacity: 1; } }
  #slide .kind { font-weight: 700; letter-spacing: .14em; color: var(--tint);
    display: inline-flex; align-items: center; gap: 8px;
    font-size: clamp(10px, 2.6vw, 14px); font-size: clamp(10px, 2.1cqw, 18px); }
  #slide .kind::before { content: ""; width: 14px; height: 2px; background: var(--tint);
    border-radius: 1px; }
  #slide h2 { font-weight: 800; line-height: 1.4; letter-spacing: .01em;
    font-size: clamp(15px, 5vw, 27px); font-size: clamp(15px, 4.4cqw, 42px); }
  #slide ul { list-style: none; display: flex; flex-direction: column; gap: .55em;
    max-width: 92%; }
  #slide li { line-height: 1.6; color: var(--slide-ink); padding-left: 1.2em;
    text-indent: -1.2em;
    font-size: clamp(12px, 3.2vw, 16px); font-size: clamp(12px, 2.6cqw, 25px); }
  #slide li::before { content: "— "; color: var(--tint); }
  #slide .note { color: var(--ink2); border-top: 1px dashed var(--sep-2);
    padding-top: .7em; max-width: 92%;
    font-size: clamp(10px, 2.6vw, 12.5px); font-size: clamp(10px, 2cqw, 18px); }
  #slide.kind-title, #slide.kind-section { text-align: center; align-items: center; }
  #slide.kind-section h2 { color: var(--tint); }
  #slide.kind-title li, #slide.kind-section li { text-indent: 0; padding-left: 0; }
  #slide.kind-title li::before, #slide.kind-section li::before { content: ""; }
  #slide.kind-question .kind, #slide.kind-question li::before { color: var(--warn); }
  #slide.kind-question .kind::before { background: var(--warn); }
  /* 画像スライド(v2.1): 画像そのものが面になる(黒レターボックス) */
  #slide.has-img { padding: 0; background: #000; }
  #slide.has-img > :not(.slide-img) { visibility: hidden; }
  #slide .slide-img { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; }

  /* ---- タップで出るメディアコントロール(再生中は自動で隠れる) ---- */
  .mctl { position: absolute; inset: 0; z-index: 3; color: #fff;
    background: rgba(0,0,0,.42); opacity: 0; pointer-events: none;
    /* 非表示中は visibility でタブ移動・読み上げの対象からも外す
       (フェードアウト完了後に hidden へ切り替える) */
    visibility: hidden;
    transition: opacity .18s linear, visibility 0s linear .18s; }
  .np-stagebox.ctl .mctl { opacity: 1; pointer-events: auto;
    visibility: visible; transition: opacity .18s linear; }
  .mctl .c-center { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; gap: clamp(24px, 9vw, 64px); }
  .mctl .c-btn { width: 46px; height: 46px; border-radius: 50%; color: #fff;
    background: rgba(0,0,0,.3); display: inline-flex; align-items: center;
    justify-content: center; }
  .mctl .c-btn svg { width: 24px; height: 24px; }
  .mctl .c-play { width: 60px; height: 60px; }
  .mctl .c-play svg { width: 30px; height: 30px; }
  .mctl .c-bottom { position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 12px; padding: 14px 56px 12px 14px;
    /* 横向き全画面でノッチ/ホームバーに操作が欠けないよう安全域を足す */
    padding: 14px calc(56px + env(safe-area-inset-right, 0px))
      calc(12px + env(safe-area-inset-bottom, 0px))
      calc(14px + env(safe-area-inset-left, 0px));
    font-size: 11.5px; font-variant-numeric: tabular-nums;
    background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .mctl .c-track { flex: 1; position: relative; height: 3px; border-radius: 2px;
    background: rgba(255,255,255,.32); cursor: pointer; touch-action: none; }
  .mctl .c-track::before { content: ""; position: absolute; left: 0; right: 0;
    top: -10px; bottom: -10px; }
  .mctl .c-track .fill { position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 2px; background: var(--tint-hi); }
  .mctl .c-track .cue { position: absolute; top: 50%; transform: translate(-50%,-50%);
    width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.8);
    pointer-events: none; }
  /* 大画面用の追加操作。狭い画面では出さない(下部UIが担う) */
  .mctl .c-skip { display: none; }
  .mctl .c-mini { display: none; color: #fff; font-size: 12px; font-weight: 700;
    min-width: 36px; height: 28px; border-radius: 6px; padding: 0 6px;
    align-items: center; justify-content: center; gap: 4px; flex-shrink: 0;
    font-variant-numeric: tabular-nums; }
  .c-mini svg { width: 18px; height: 18px; }
  .c-mini .lb { font-size: 11px; }
  .c-mini.on { color: var(--tint-hi); }
  .c-mini:hover { background: rgba(255,255,255,.15); }
  /* 全画面中は下部UIが覆われて代替が無いため、幅に関係なく±30/速度/タイマーを出す */
  body.np-fs .mctl .c-skip, body.np-fs .mctl .c-mini { display: inline-flex; }

  /* 速度・タイマーの選択ポップアップ(ボタン近くに出す。全端末共通) */
  .np-pop { position: fixed; z-index: 120; min-width: 132px; padding: 6px;
    background: var(--overlay-bg); backdrop-filter: blur(16px);
    border: 1px solid var(--sep-2); border-radius: 12px; box-shadow: var(--sh-float);
    display: flex; flex-direction: column; }
  .np-pop-item { text-align: left; font-size: 14px; font-weight: 600; color: var(--ink);
    padding: 10px 14px 10px 32px; border-radius: 8px; position: relative;
    font-variant-numeric: tabular-nums; }
  .np-pop-item:hover { background: var(--veil-1); }
  .np-pop-item.cur { color: var(--tint); background: var(--tint-soft); }
  .np-pop-item.cur::before { content: "✓"; position: absolute; left: 12px; }
  /* 全画面ボタン(スライド右下)。常時表示にせず、タップで出るコントロールと
     一緒に表示/自動非表示する */
  .np-fsbtn { position: absolute; right: 8px; bottom: 8px; z-index: 4;
    right: calc(8px + env(safe-area-inset-right, 0px));
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: 40px; height: 40px; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .18s linear, visibility 0s linear .18s; }
  .np-stagebox.ctl .np-fsbtn { opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .18s linear; }
  /* 非全画面・未スクロール: 直下に本体トランスポートがあり操作が二重になるため、
     スライド面のコントロールは⛶のみ(スクリムも敷かない) */
  body:not(.np-fs) .np-wrap:not(.scrolled) .mctl { background: transparent; }
  body:not(.np-fs) .np-wrap:not(.scrolled) .mctl .c-center,
  body:not(.np-fs) .np-wrap:not(.scrolled) .mctl .c-bottom { display: none; }
  /* チャプターへスクロール中(メディア固定・本体トランスポートは画面外):
     フル操作を出し、シークバーと⛶は面の下端へ寄せる */
  body:not(.np-fs) .np-wrap.scrolled .mctl .c-bottom {
    padding: 10px 48px 4px 10px; }
  /* ⛶はタップ時もスクロール時も同じ位置(下端寄せ)に固定する
     — 状態で位置が跳ばないように(実機レビュー指摘) */
  body:not(.np-fs) .np-fsbtn { right: 4px; bottom: 2px; }
  /* 下地の箱は敷かない(タップ時はスクリムが出るため不要・実機レビュー指摘)。
     明るいスライド上での視認用にグリフへ薄い落ち影だけ残す */
  .np-fsbtn svg { width: 20px; height: 20px;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
  /* 全画面時の上部バー(タイトル+終了)。コントロール表示中のみ */
  /* タイトルは上端に張り付けない: 横向きでは safe-area-inset-top がほぼ0になり、
     8pxだとノッチ・角丸に隠れて読めない(実機レビュー指摘)。余裕を持って下げる */
  .mctl .fs-top { display: none; position: absolute; left: 0; right: 0; top: 0;
    align-items: center; gap: 8px; padding: 26px 16px 22px;
    padding: calc(26px + env(safe-area-inset-top, 0px))
      calc(16px + env(safe-area-inset-right, 0px)) 22px
      calc(16px + env(safe-area-inset-left, 0px));
    color: #fff;
    background: linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.3) 60%, transparent);
    font-size: 14px; font-weight: 600; }
  body.np-fs .mctl .fs-top { display: flex; }
  .mctl .fs-top .t { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }

  /* ---- 全画面(手動⛶ / 端末を横向きにすると自動) ---- */
  body.np-fs { overflow: hidden; }
  body.np-fs .np-stagebox { position: fixed; inset: 0; z-index: 80;
    aspect-ratio: auto; max-height: none; max-width: none; }
  /* .np-top(z:40)が .np-media(z:30)のスタッキング文脈より上に来るため、
     全画面中は上部バーを隠し、メディア面の文脈自体を持ち上げる */
  body.np-fs .np-top { visibility: hidden; }
  body.np-fs .np-media { z-index: 100; }
  body.np-fs #tabbar, body.np-fs #dock { display: none; }
  .np-stagebox:fullscreen { width: 100%; height: 100%; aspect-ratio: auto;
    max-height: none; max-width: none; }

  /* ---- 最初の画面(タイトル→チップ→シーク→操作→アクションの縦積み) ---- */
  .np-head { position: relative; z-index: 1; width: 100%; max-width: 560px;
    margin: 0 auto; padding: 16px 20px 0; flex-shrink: 0; }
  .np-resume { display: none; align-items: center; gap: 10px; margin-bottom: 12px;
    font-size: 12.5px; color: var(--ink2); background: var(--bg-elev);
    border: 1px solid var(--sep); border-radius: 10px; padding: 8px 12px; }
  .np-resume b { color: var(--tint); }
  .np-resume button { margin-left: auto; color: var(--tint); font-size: 12.5px;
    font-weight: 600; flex-shrink: 0; }
  /* タイトルは1行。収まらない長題は左右に流して全文を見せる(マーキー) */
  .np-title h1 { font-size: 21px; font-weight: 800; line-height: 1.35;
    white-space: nowrap; overflow: hidden; }
  .np-title h1 span { display: inline-block; white-space: nowrap; }
  .np-title h1.marquee span {
    animation: np-marq var(--marq-dur, 12s) linear infinite alternate; }
  @keyframes np-marq {
    0%, 18% { transform: translateX(0); }
    82%, 100% { transform: translateX(var(--marq-x, 0)); }
  }
  .np-title .sub { margin-top: 4px; font-size: 13.5px; color: var(--ink2); }
  /* 全画面ダブルタップの±10秒表示 */
  .np-skipflash { position: absolute; top: 50%; transform: translateY(-50%);
    z-index: 5; color: #fff; font-size: 15px; font-weight: 700;
    background: rgba(0,0,0,.45); border-radius: 99px; padding: 10px 18px;
    pointer-events: none; animation: np-skipfade .7s ease-out forwards; }
  .np-skipflash.left { left: 10%; }
  .np-skipflash.right { right: 10%; }
  @keyframes np-skipfade { 0% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; } }
  .np-chips { display: flex; gap: 9px; margin-top: 14px; overflow-x: auto;
    scrollbar-width: none; }
  .np-chips::-webkit-scrollbar { display: none; }
  .np-chip { flex-shrink: 0; display: inline-flex; align-items: center;
    font-size: 13px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--sep-2); border-radius: 99px; padding: 8px 16px;
    transition: background-color .12s linear; }
  .np-chip:hover { background: var(--veil-1); }

  /* シークバー(cue位置の目盛付き)+ 残り時間(再生速度で換算) */
  .np-seek { margin-top: 16px; padding: 6px 0; touch-action: none; }
  .np-track { position: relative; height: 4px; border-radius: 2px;
    background: var(--veil-3); cursor: pointer; }
  /* 見た目は細いまま、タップ判定だけ上下に広げる(疑似要素はイベントを
     track 本体へ届けるので bindScrub の判定がそのまま効く) */
  .np-track::before { content: ""; position: absolute; left: 0; right: 0;
    top: -10px; bottom: -10px; }
  .np-track .fill { position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 2px; background: var(--tint); }
  .np-track .knob { position: absolute; top: 50%; left: 0;
    transform: translate(-50%,-50%); width: 15px; height: 15px; border-radius: 50%;
    background: var(--tint); box-shadow: var(--sh-card); pointer-events: none; }
  .np-track .cue { position: absolute; top: 50%; transform: translate(-50%,-50%);
    width: 3px; height: 3px; border-radius: 50%; background: var(--ink3);
    pointer-events: none; }
  .np-times { display: flex; align-items: baseline; margin-top: 8px;
    font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .np-times .mid { flex: 1; text-align: center; color: var(--ink3); }

  /* トランスポート(前章 / −30秒 / 再生 / +30秒 / 次章) */
  .np-transport { display: flex; align-items: center; justify-content: center;
    gap: clamp(4px, 2.6vw, 18px); margin: 12px 0 4px; }
  /* 幅320px級でも正円のまま収まるよう、固定pxでなく clamp で追従縮小させる
     (flex-shrink による横方向だけの潰れ=楕円化を防ぐ) */
  .np-tbtn { width: clamp(44px, 14vw, 54px); height: clamp(44px, 14vw, 54px);
    border-radius: 50%; color: var(--ink); flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .12s linear; }
  .np-tbtn:hover { background: var(--veil-1); }
  .np-tbtn svg { width: 28px; height: 28px; }
  .np-play { width: clamp(58px, 19vw, 74px); height: clamp(58px, 19vw, 74px);
    border-radius: 50%; flex-shrink: 0;
    background: var(--ink); color: var(--bg);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--sh-float); transition: transform .12s var(--ease); }
  .np-play:active { transform: scale(.96); }
  .np-play svg { width: 30px; height: 30px; }
  .skipnum { position: relative; }
  .skipnum .n { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 9.5px; font-weight: 700; padding-top: 2px; }

  /* 下部アクション列(速度 / タイマー / タイトル詳細) */
  .np-actions { display: flex; align-items: flex-start; justify-content: space-around;
    margin: 14px 0 0; }
  .np-act { display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 76px; padding: 8px 6px; font-size: 12px; color: var(--ink);
    border-radius: 12px; transition: background-color .12s linear; }
  .np-act:hover { background: var(--veil-1); }
  .np-act .ic { height: 26px; display: flex; align-items: center; }
  .np-act .ic svg { width: 24px; height: 24px; }
  .np-act .big { font-size: 17px; font-weight: 800; height: 26px; display: flex;
    align-items: center; font-variant-numeric: tabular-nums; }
  .np-act .lb { font-size: 11.5px; color: var(--ink2); }
  .np-act.on, .np-act.on .lb { color: var(--tint); }

  /* チャプターへの誘い(下部シート風の取っ手) */
  .np-hint { display: flex; flex-direction: column; align-items: center; gap: 9px;
    width: 100%; padding: 16px 0 14px; color: var(--ink2); font-size: 12.5px; }
  .np-hint::before { content: ""; width: 40px; height: 4px; border-radius: 2px;
    background: var(--sep-2); }

  /* ---- チャプター(番号+時刻+見出し+要点の縦積み) ---- */
  .np-chapters { position: relative; z-index: 1; background: var(--bg);
    border-top: 1px solid var(--sep); flex-shrink: 0;
    min-height: 62vh; min-height: 62dvh;
    padding-bottom: calc(env(safe-area-inset-bottom) + 28px); }
  .np-ch-head { max-width: 560px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: baseline; }
  .np-ch-tab { padding: 13px 2px 10px; font-size: 15px; font-weight: 700;
    border-bottom: 2.5px solid var(--tint); }
  .np-ch-count { margin-left: auto; font-size: 12.5px; color: var(--ink3); }
  .np-chlist { max-width: 560px; margin: 0 auto; display: flex;
    flex-direction: column; }
  .np-chap { display: flex; gap: 14px; width: 100%; text-align: left;
    padding: 16px 20px; transition: background-color .12s linear; }
  .np-chap + .np-chap { border-top: 1px solid var(--sep); }
  .np-chap:hover { background: var(--veil-1); }
  .np-chap .no { flex-shrink: 0; width: 58px; }
  .np-chap .no b { display: block; font-size: 28px; font-weight: 800;
    line-height: 1.1; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .np-chap .no .tm { display: block; margin-top: 5px; font-size: 11.5px;
    color: var(--ink3); font-variant-numeric: tabular-nums; }
  .np-chap .bd { flex: 1; min-width: 0; }
  .np-chap .tt { display: block; font-size: 15px; font-weight: 700;
    line-height: 1.45; }
  .np-chap ul { list-style: none; margin-top: 7px; display: flex;
    flex-direction: column; gap: 4px; }
  .np-chap li { font-size: 13px; line-height: 1.6; color: var(--ink2);
    padding-left: 1.1em; text-indent: -1.1em; }
  .np-chap li::before { content: "- "; color: var(--ink3); }
  .np-chap .alt { margin-top: 7px; font-size: 13px; line-height: 1.6;
    color: var(--ink2); }
  .np-chap .nt { margin-top: 7px; font-size: 11.5px; color: var(--ink3); }
  .np-chap.cur { background: var(--tint-soft); }
  .np-chap.cur .no b, .np-chap.cur .no .tm { color: var(--tint); }

  /* ---- デスクトップ/ウェブ版: 2カラム ----
     左=メディア+タイトル+操作 / 右=チャプター(独立スクロール)。
     全画面時・狭い画面は従来どおり */
  @media (min-width: 1000px) {
    body:not(.np-fs) .np-scroll { display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 0 28px; padding: 0 32px; overflow: hidden; }
    body:not(.np-fs) .np-top { grid-column: 1 / -1; grid-row: 1; }
    body:not(.np-fs) .np-media,
    body:not(.np-fs) .np-wrap.mode-slide .np-media {
      grid-column: 1; grid-row: 2; position: static; background: none; }
    body:not(.np-fs) .np-head { grid-column: 1; grid-row: 3; overflow-y: auto;
      min-height: 0; max-width: none; margin: 0; padding: 16px 4px 24px;
      scrollbar-width: none; }
    body:not(.np-fs) .np-head::-webkit-scrollbar { display: none; }
    body:not(.np-fs) .np-chapters { grid-column: 2; grid-row: 2 / span 2;
      overflow-y: auto; min-height: 0; border-top: none;
      border-left: 1px solid var(--sep); padding-bottom: 24px;
      scrollbar-width: thin; }
    body:not(.np-fs) .np-ch-head { position: sticky; top: 0;
      background: var(--bg); z-index: 2; }
    /* 右にチャプターが常時見えるため、誘導用の取っ手とチップは不要 */
    body:not(.np-fs) .np-hint, body:not(.np-fs) #chipChapters { display: none; }
    body:not(.np-fs) .np-cover { margin: 24px auto 8px; }

    /* ---- スライドタブでは操作を全てメディア内オーバーレイへ(ホバー表示)。
       下はタイトルだけにして、スライドをほぼ画面いっぱいにする。
       表紙タブはオーバーレイを持たないため従来の下部操作を残す ---- */
    body:not(.np-fs) .np-wrap.mode-slide .np-seek,
    body:not(.np-fs) .np-wrap.mode-slide .np-transport,
    body:not(.np-fs) .np-wrap.mode-slide .np-actions { display: none; }
    body:not(.np-fs) .np-stagebox { max-width: none;
      max-height: calc(100vh - 200px); max-height: calc(100dvh - 200px); }
    /* 未スクロールでもフル操作を出す(下部の重複UIが無いため)。
       スライドを読んでいる最中に暗くしないようスクリムは敷かない */
    body:not(.np-fs) .np-wrap:not(.scrolled) .mctl .c-center { display: flex; }
    body:not(.np-fs) .np-wrap:not(.scrolled) .mctl .c-bottom { display: flex; }
    body:not(.np-fs) .mctl { background: transparent; }
    .mctl .c-skip { display: inline-flex; }
    .mctl .c-mini { display: inline-flex; }
  }

  /* ---- モバイル ---- */
  @media (max-width: 700px) {
    .app { padding: 8px 16px calc(170px + env(safe-area-inset-bottom, 0px)); }
    .large-title { font-size: 32px; }
    .resume-card { width: 322px; }
    .book-card { width: 152px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .two-col { grid-template-columns: 1fr; gap: 26px; }
    .browse-grid { grid-template-columns: 1fr; }
    #tabbar { gap: 0; justify-content: space-around; }
    #dock .inner { padding: 8px 14px; }
  }

  /* ---- ログインオーバーレイ ---- */
  #login { position: fixed; inset: 0; z-index: 40; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  #login .panel { width: 340px; max-width: 100%; text-align: center; }
  /* ロゴは2色。ヘッドフォンが --ink、スクリーンが --glyph-tint。
     --glyph-tint を指定しない場所(カバーのプレースホルダ)では単色に落ちる */
  #login .mark { width: 56px; height: 56px; margin: 0 auto 14px;
    color: var(--ink); --glyph-tint: var(--tint); }
  #login .mark svg { width: 100%; height: 100%; }
  #login h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  #login p { font-size: 13px; color: var(--ink2); margin-bottom: 20px; }
  #login input { width: 100%; background: var(--bg-elev); border: none;
    border-radius: var(--r-field); padding: 12px 14px; color: var(--ink);
    font-size: 15px; font-family: inherit; text-align: center; }
  #login button { width: 100%; margin-top: 12px; background: var(--tint);
    color: var(--on-tint); border-radius: 12px; padding: 13px 0;
    font-size: 15px; font-weight: 700; transition: background-color .12s linear; }
  #login button:hover { background: var(--tint-hi); }
  #login .err { font-size: 12.5px; color: var(--warn); margin-top: 12px; min-height: 1.2em; }

  /* 動きを減らす設定を尊重する */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<body>

<div id="warn" role="status"></div>

<div class="app">
  <header class="navbar" id="navbar">
    <span id="navLeft"></span>
    <span id="netBadge" style="display:none" role="status">オフライン</span>
    <select id="libSel" class="lib-switch" aria-label="ライブラリ選択"></select>
  </header>
  <h1 class="large-title" id="pageTitle"></h1>
  <div id="content"></div>
</div>

<div id="dock" role="region" aria-label="再生中のブック" hidden></div>
<nav id="tabbar" aria-label="メインタブ"></nav>
<!-- プレイヤーオーバーレイ(ページ遷移せず展開/縮小する。音声は破棄されない) -->
<div id="playerOverlay" role="dialog" aria-label="プレイヤー" aria-modal="true">
  <div class="drag-handle" id="dragHandle" aria-label="引き下げて閉じる" role="button" tabindex="0"></div>
  <div id="playerHost"></div>
</div>

<script>
(function () {
  "use strict";

  // ================= 共通ユーティリティ =================
  var params = new URLSearchParams(location.search);

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // 時間表記: 1時間未満は M:SS、1時間以上は H:MM:SS(90分の本が「90:00」になる問題の修正)
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    return m + ":" + String(s).padStart(2, "0");
  }

  function fmtLong(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    return h > 0 ? h + "時間" + m + "分" : m + "分" + (sec % 60) + "秒";
  }

  // #warn へ警告文を積み上げて表示する(複数件出ても既存メッセージを消さない)
  function warn(msg) {
    var w = document.getElementById("warn");
    w.style.display = "block";
    if (w.textContent) {
      var line = document.createElement("div");
      line.textContent = msg;
      w.appendChild(line);
    } else {
      w.textContent = msg;
    }
  }

  // スライド種別のallowlist(deck.json由来の値をCSSクラス名へ直接注入しない)
  var ALLOWED_KINDS = ["title", "section", "content", "question"];
  function safeKind(k) { return ALLOWED_KINDS.indexOf(k) !== -1 ? k : "content"; }

  // localStorage(Safariプライベートモード等で例外を投げるためtry/catchで包む)
  function lsGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* 保存不可環境では黙って続行 */ }
  }
  function loadPos(lib, id) {
    var raw = lsGet("kikimiru.pos." + lib + "/" + id);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }
  // s=現在スライド番号(1始まり) / n=総スライド数(再開ドック・詳細画面の表示用)
  function savePos(lib, id, t, d, s, n) {
    var rec = { t: t, d: d, at: Date.now() };
    if (s) rec.s = s;
    if (n) rec.n = n;
    lsSet("kikimiru.pos." + lib + "/" + id, JSON.stringify(rec));
    markDirty(lib, id);
  }
  function clearPos(lib, id) {
    // 端末間同期(LWW)で古いサーバ値が復活しないよう、削除でなく
    // ゼロ位置の墓標レコード(t:0,d:0,新しいat)を書いて同期させる
    savePos(lib, id, 0, 0);
  }
  // 進捗の状態判定を1箇所に集約(カード・詳細・統計で同じ閾値を使う)
  var DONE_PCT = 0.97, START_PCT = 0.02;
  function posState(pos) {
    if (!pos || !pos.d) return { st: "none", pct: 0 };
    var pct = pos.t / pos.d;
    if (pct > DONE_PCT) return { st: "done", pct: 1 };
    if (pct >= START_PCT) return { st: "listening", pct: pct };
    return { st: "none", pct: 0 };
  }

  function qs(overrides) {
    // 現在のライブラリ選択を維持したままクエリ文字列を組み立てる
    var p = new URLSearchParams();
    if (state.lib) p.set("library", state.lib);
    Object.keys(overrides || {}).forEach(function (k) {
      if (overrides[k] != null && overrides[k] !== "") p.set(k, overrides[k]);
    });
    return "?" + p.toString();
  }

  function api(path, extra) {
    var p = new URLSearchParams(extra || {});
    if (state.lib) p.set("library", state.lib);
    return fetch(path + "?" + p.toString()).then(function (r) {
      if (r.status === 401) {
        // セッション切れ。ログイン画面を出して以降の処理は静かに打ち切る
        showLogin();
        throw new Error("auth_required");
      }
      if (!r.ok) throw new Error(path + " " + r.status);
      if (!offlineNotified && r.headers.get("X-Kikimiru-Cache")) {
        // Service Workerのキャッシュから返された=サーバに届いていない
        offlineNotified = true;
        warn("オフライン表示: サーバに接続できないため、最後に取得した内容を表示しています。保存系の操作は失敗します。");
      }
      return r.json();
    });
  }

  // ================= テーマ(ライト/ダーク) =================
  // 既定はOS設定に従い、手動切替を記憶する
  function currentTheme() {
    var saved = lsGet("kikimiru.theme");
    if (saved === "light" || saved === "dark") return saved;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
      ? "light" : "dark";
  }
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", name === "light" ? "#efece5" : "#131519");
  }
  applyTheme(currentTheme());
  // OS設定の変更に追従する(手動指定がない場合のみ)
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () {
      if (!lsGet("kikimiru.theme")) applyTheme(currentTheme());
    });
  }

  // ================= Service Worker =================
  // secure context(https または 127.0.0.1)でのみ登録する。
  // LANのhttp運用ではSWは動かないため静かにスキップ(通常動作に影響なし)
  if ("serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("/web/sw.js", { scope: "/web/" }).catch(function () {});
    // 新しいSWが有効化されたら1度だけ自動リロードして最新UIへ入れ替える
    // (PWAとしてインストールした端末で古いシェルが残り続けるのを防ぐ)
    var swReloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (swReloaded) return;
      swReloaded = true;
      location.reload();
    });
  }
  var offlineNotified = false;

  // ================= ログイン =================
  var loginShown = false;
  function showLogin() {
    if (loginShown) return;
    loginShown = true;
    var ov = el("div");
    ov.id = "login";
    var panel = el("div", "panel");
    var mark = el("div", "mark");
    mark.innerHTML = I.glyph;
    panel.appendChild(mark);
    panel.appendChild(el("h1", null, "kikimiru"));
    panel.appendChild(el("p", null, "パスワードを入力してください"));
    var form = document.createElement("form");
    var box = document.createElement("input");
    box.type = "password";
    box.setAttribute("aria-label", "パスワード");
    box.autocomplete = "current-password";
    form.appendChild(box);
    var btn = el("button", null, "ログイン");
    btn.type = "submit";
    form.appendChild(btn);
    var err = el("div", "err", "");
    form.appendChild(err);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      err.textContent = "";
      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: box.value })
      }).then(function (r) {
        if (r.ok) { location.reload(); return; }
        if (r.status === 429) {
          err.textContent = "試行回数が多すぎます。しばらく待ってから再試行してください。";
          return;
        }
        err.textContent = "パスワードが違います。";
      }).catch(function () { err.textContent = "サーバに接続できません。"; });
    });
    panel.appendChild(form);
    ov.appendChild(panel);
    document.body.appendChild(ov);
    setTimeout(function () { box.focus(); }, 0);
  }

  // ================= 進捗の端末間同期 =================
  // localStorage が常に一次ストア。サーバとはLWW(atの新しい方)でマージする。
  var dirtyProgress = {};
  function markDirty(lib, id) { dirtyProgress[lib + "/" + id] = true; }

  function forEachLocalPos(fn) {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf("kikimiru.pos.") === 0) {
          var rec = null;
          try { rec = JSON.parse(localStorage.getItem(k)); } catch (e) {}
          if (rec) fn(k.slice("kikimiru.pos.".length), rec);
        }
      }
    } catch (e) { /* localStorage不可の環境では同期しない */ }
  }

  function syncProgressDown() {
    // サーバ→localStorage。ローカルの方が新しい分・ローカルにしか無い分はdirtyへ
    return fetch("/api/progress").then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (d) {
      if (!d || !d.progress) return;
      Object.keys(d.progress).forEach(function (key) {
        var rec = d.progress[key];
        var raw = lsGet("kikimiru.pos." + key);
        var local = null;
        try { local = raw ? JSON.parse(raw) : null; } catch (e) {}
        if (!local || (rec.at || 0) > (local.at || 0)) {

        } else if ((local.at || 0) > (rec.at || 0)) {
          dirtyProgress[key] = true;
        }

      forEachLocalPos(function (key) {
        if (!d.progress[key]) dirtyProgress[key] = true;
      });
      syncProgressUp();
    }).catch(function () { /* オフライン等では手元の進捗のまま続行 */ });

    var keys = Object.keys(dirtyProgress);
    if (!keys.length) return;
    var payload = {};
    keys.forEach(function (key) {
      var raw = lsGet("kikimiru.pos." + key);
      try {
        var rec = raw ? JSON.parse(raw) : null;
        if (rec) payload[key] = rec;
      } catch (e) {}
    });
    if (!Object.keys(payload).length) { dirtyProgress = {}; return; }
    fetch("/api/progress", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ progress: payload }),
      keepalive: !!useKeepalive

  // 音声を進捗つきで取得する。途中で切れたら Range: bytes=N- で続きから再開する
  // (サーバは常に Content-Length を返すため確定的な%表示ができる)
  function fetchAudioResumable(url, onProgress) {
    var chunks = [], got = 0, total = 0, type = "";
    function attempt(retries) {
      var opts = got > 0 ? { headers: { "Range": "bytes=" + got + "-" } } : {};
      return fetch(url, opts).then(function (r) {
        if (r.status !== 200 && r.status !== 206) throw new Error("audio " + r.status);
        if (r.status === 200 && got > 0) { chunks = []; got = 0; }
        if (!total) {
          if (r.status === 206) {
            var cr = /\/(\d+)$/.exec(r.headers.get("Content-Range") || "");
            total = cr ? parseInt(cr[1], 10) : 0;
          } else {
            total = parseInt(r.headers.get("Content-Length") || "0", 10);
          }
        }
        if (!type) type = r.headers.get("Content-Type") || "";
        if (!r.body || !r.body.getReader) {
          return r.blob().then(function (b) {
            chunks.push(b);
            got += b.size;
            onProgress(got, total);
            return new Blob(chunks, { type: type });
          });
        }
        var reader = r.body.getReader();
        function pump() {
          return reader.read().then(function (res) {
            if (res.done) return new Blob(chunks, { type: type });
            chunks.push(res.value);
            got += res.value.byteLength;
            onProgress(got, total);
            return pump();
          });
        }
        return pump();
      }).catch(function (e) {
        // 途中まで取れていればRangeで再開を試みる(最大2回)
        if (retries > 0 && got > 0) return attempt(retries - 1);
        throw e;
      });
    }
    return attempt(2);

  function downloadBook(book, onProgress) {
    var lib = book.library, id = book.id;
    var base = bookBase(lib, id);
    var cname = bookCacheName(lib, id);
    var audioBytes = 0;
    return caches.open(cname).then(function (cache) {
      return fetch(base + "deck.json").then(function (r) {
        if (!r.ok) throw new Error("deck.json " + r.status);
        return r.clone().json().then(function (deck) {
          return cache.put(base + "deck.json", r).then(function () { return deck; });
        });
      }).then(function (deck) {
        // 付随ファイル(無いものは静かにスキップ)
        var extras = ["content.json"];
        if (book.cover) extras.push(encodeURIComponent(book.cover));
        (deck.slides || []).forEach(function (s) {
          if (s && typeof s.image === "string" && s.image &&
              !/\\|\.\.|[?#]/.test(s.image) && s.image.split("/").length <= 2) {
            extras.push(s.image.split("/").map(encodeURIComponent).join("/"));

        var chain = Promise.resolve();
        extras.forEach(function (name) {
          chain = chain.then(function () {
            return fetch(base + name).then(function (r) {

            }

      });
    }).then(function () {
      lsSet("kikimiru.dl." + lib + "/" + id, JSON.stringify({ bytes: audioBytes, at: Date.now() }));

  function listSavedBooks() {

        var slash = rest.indexOf("/");
        if (slash < 0) return;
        var lib = rest.slice(0, slash), id = rest.slice(slash + 1);
        var bytes = 0;
        try {
          var rec = JSON.parse(lsGet("kikimiru.dl." + lib + "/" + id) || "null");
          if (rec && rec.bytes) bytes = rec.bytes;
        } catch (e) {}
        items.push({ lib: lib, id: id, bytes: bytes });
      });
      // 記録だけ残ってキャッシュが無いもの=消去された保存(件数を防御表示に使う)
      var evicted = 0;
      try {

            if (!found) {

              i--;

          }
        }
      } catch (e) {}
      return { items: items, evicted: evicted };
    });

  // 再開ドック: 最後に聴いていた進行中のブックをどの画面からも1タップで再開できる。
  // オーバーレイのaudioが生きている間はそれに直結し、進捗・再生状態をライブ同期する。
  var dockCleanup = null;
  function renderDock(books) {
    if (dockCleanup) { try { dockCleanup(); } catch (e) {} dockCleanup = null; }
    var dock = document.getElementById("dock");
    var best = null;
    books.forEach(function (b) {
      var pos = loadPos(b.library, b.id);
      var st = posState(pos);
      if (st.st !== "listening") return;
      if (!best || (pos.at || 0) > (best.pos.at || 0)) best = { book: b, pos: pos, st: st };
    });
    // 読み込み済みのブックを最優先(閉じても audio は生きている)
    var liveAudio = null;
    if (overlayBookId) {
      var la = document.querySelector("#playerHost audio");
      var loaded = books.filter(function (b) { return b.id === overlayBookId; })[0];
      if (la && loaded) {
        liveAudio = la;
        var lpos = loadPos(loaded.library, loaded.id) || { t: la.currentTime, d: la.duration || 0 };
        best = { book: loaded, pos: lpos, st: posState(lpos) };
      }
    }
    if (!best) { dock.hidden = true; return; }
    dock.hidden = false;
    dock.textContent = "";
    var a = document.createElement("a");
    a.className = "inner";
    a.href = qs({ book: best.book.id });
    var mbar = el("span", "mbar");
    var fill = document.createElement("i");
    fill.style.width = Math.round(best.st.pct * 100) + "%";
    mbar.appendChild(fill);
    a.appendChild(mbar);
    var cov = el("span", "cov");
    coverInto(cov, best.book.library, best.book.id, best.book.cover, best.book.title, true);
    a.appendChild(cov);
    var body = el("span", "body");
    body.appendChild(el("span", "t", best.book.title));
    var mEl = el("span", "m");
    function metaText(t, d) {
      var s = "残り " + fmt(Math.max(0, d - t));
      var pos2 = loadPos(best.book.library, best.book.id);
      if (pos2 && pos2.s && pos2.n) s += " · スライド " + pos2.s + "/" + pos2.n;
      return s;
    }
    mEl.textContent = metaText(best.pos.t, best.pos.d);
    body.appendChild(mEl);
    a.appendChild(body);
    var pc = el("span", "play-circ");
    pc.innerHTML = I.play;
    a.appendChild(pc);
    a.setAttribute("aria-label", best.book.title + " を続きから再生");
    // ページ遷移せずオーバーレイで開く(再生が途切れない)
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      openPlayerOverlay(best.book.id);
    });
    if (liveAudio) {
      // ライブ同期: 進捗バー・残り時間・再生状態を audio に追従させ、
      // 再生ボタンはその場で再生/一時停止を切り替える(オーバーレイは開かない)
      var laRef = liveAudio;
      function dockPaint() {
        var d = laRef.duration || best.pos.d || 0;
        var t = laRef.currentTime;
        if (d > 0) fill.style.width = Math.min(100, t / d * 100) + "%";
        mEl.textContent = metaText(t, d);
        pc.innerHTML = laRef.paused ? I.play : I.pauseBig;
        pc.setAttribute("aria-label", laRef.paused ? "再生" : "一時停止");
      }
      pc.setAttribute("role", "button");
      pc.addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (laRef.paused) laRef.play().catch(function () {});
        else laRef.pause();
      });
      laRef.addEventListener("timeupdate", dockPaint);
      laRef.addEventListener("play", dockPaint);
      laRef.addEventListener("pause", dockPaint);
      dockCleanup = function () {
        laRef.removeEventListener("timeupdate", dockPaint);
        laRef.removeEventListener("play", dockPaint);
        laRef.removeEventListener("pause", dockPaint);
      };
      dockPaint();
    } else {
      // まだプレイヤーが読み込まれていない(起動直後の初回タップ)。
      // ▶はオーバーレイを開かず、裏でプレイヤーを用意してその場で再生を開始する
      pc.setAttribute("role", "button");
      pc.setAttribute("aria-label", "再生");
      pc.addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        var host = document.getElementById("playerHost");
        if (overlayBookId !== best.book.id || host.childElementCount === 0) {
          host.textContent = "";
          overlayBookId = best.book.id;
          viewPlayer(best.book.id, host);
        }
        var la2 = document.querySelector("#playerHost audio");
        if (la2) {
          var tryPlay = function () { la2.play().catch(function () {}); };
          tryPlay();  // srcが未設定なら失敗するが、canplayで再試行する
          la2.addEventListener("canplay", tryPlay, { once: true });
        }
        // ライブ同期版のドックに描き直す
        api("/api/books").then(function (d2) { renderDock(d2.books); }).catch(function () {});
      });
    }
    dock.appendChild(a);
  }

  // ================= カバー =================
  function coverInto(container, lib, bookId, coverName, title, tiny) {
    // プレースホルダ: 自作グリフ+タイトル(グラデーション・色相ハッシュは廃止)
    var ph = el("div", "ph-fill");
    ph.innerHTML = I.glyphSmall;
    if (!tiny) ph.appendChild(el("span", "pht", title || bookId));
    container.appendChild(ph);
    if (coverName) {
      // 注意: loading="lazy" をDOM未接続のimgに付けるとChromiumはロードを開始しない
      // (loadが永久に発火せず差し替えが起きない)。imgは即座にDOMへ入れ、
      // ロード完了までopacityで隠す方式にする(display:noneもlazyのロードを止めるため不可)。
      var img = document.createElement("img");
      img.alt = "";
      img.style.opacity = "0";
      img.style.position = "absolute";
      img.style.inset = "0";
      img.addEventListener("load", function () {
        ph.remove();
        img.style.opacity = "";
        img.style.position = "";
        // 縦長(書籍型)の表紙は切り抜かず全体を見せ、背景をぼかし表紙で埋める
        if (img.naturalHeight > img.naturalWidth * 1.04) {
          container.classList.add("cov-tall");
          var bg = document.createElement("img");
          bg.className = "cov-bg";
          bg.alt = "";
          bg.src = img.src;
          container.insertBefore(bg, img);
        }
      });
      img.addEventListener("error", function () { img.remove(); });
      img.src = bookBase(lib, bookId) + encodeURIComponent(coverName);
      container.appendChild(img);
    }
  }

  // ================= ブックカード =================
  // カード=詳細画面へ、カバーhoverの再生ボタン=即再生(2導線を分ける)
  function bookCard(b, opts) {
    opts = opts || {};
    var card = el("div", "book-card");

    var covLink = document.createElement("a");
    covLink.className = "cov";
    covLink.href = qs({ view: "book", book: b.id });
    covLink.setAttribute("aria-label", b.title + " の詳細");
    coverInto(covLink, b.library, b.id, b.cover, b.title);

    var pos = loadPos(b.library, b.id);
    var st = posState(pos);
    if (st.st === "done") {
      var done = el("span", "done-badge");
      done.title = "聴了";
      done.innerHTML = I.check;
      covLink.appendChild(done);
    } else if (st.st === "listening") {
      var prog = el("span", "prog");
      var fill = document.createElement("i");
      fill.style.width = Math.round(st.pct * 100) + "%";
      prog.appendChild(fill);
      covLink.appendChild(prog);
    }
    if (opts.showSeq && b.series && b.series.sequence) {
      covLink.appendChild(el("span", "seq-badge", "#" + b.series.sequence));
    }
    // オフライン保存済みバッジ(非同期確認。カード破棄後は付けない)
    if (offlineCapable()) {
      isBookDownloaded(b.library, b.id).then(function (has) {
        if (!has || !covLink.isConnected) return;
        var dlb = el("span", "dl-badge");
        dlb.title = "オフライン保存済み";
        dlb.innerHTML = I.download;
        covLink.appendChild(dlb);
      });
    }
    card.appendChild(covLink);

    // hover再生オーバーレイ(タッチ環境ではCSSで非表示)
    var over = document.createElement("a");
    over.className = "play-over";
    over.href = qs({ book: b.id });
    over.setAttribute("aria-label", b.title + " を再生");
    over.innerHTML = I.play;
    over.addEventListener("click", function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      openPlayerOverlay(b.id);
    });
    covLink.appendChild(over);

    var tLink = document.createElement("a");
    tLink.href = qs({ view: "book", book: b.id });
    tLink.appendChild(el("span", "t", b.title));
    card.appendChild(tLink);
    if (b.authors && b.authors.length) card.appendChild(el("span", "a", b.authors.join(" / ")));

    var meta = b.slides + "枚";
    if (b.duration) meta += " · " + fmt(b.duration);
    if (st.st === "done") meta += " · 聴了";
    else if (st.st === "listening" && pos.d) meta += " · 残り " + fmt(pos.d - pos.t);
    card.appendChild(el("span", "m", meta));
    return card;
  }

  function resumeCard(b, pos, st) {

  function seriesCard(g) {
    var a = document.createElement("a");
    a.className = "series-card";
    a.href = qs({ view: "library", series: g.name, sort: "series" });
    var stack = el("span", "stack");

    if (g.sample && g.sample.cover) {
      coverInto(front, state.lib, g.sample.book, g.sample.cover, g.name, true);
      coverInto(back, state.lib, g.sample.book, g.sample.cover, g.name, true);
    } else {
      front.innerHTML = '<span class="ph-fill">' + I.glyphSmall + "</span>";
      back.innerHTML = '<span class="ph-fill">' + I.glyphSmall + "</span>";

    stack.appendChild(back);
    stack.appendChild(front);
    a.appendChild(stack);
    var body = el("span");

  // ================= 各画面 =================
  var content = document.getElementById("content");

  function searchField(autofocus) {
    var form = document.createElement("form");

  function viewHome() {
    api("/api/books", { sort: "added" }).then(function (d) {
      content.textContent = "";
      content.appendChild(searchField(false));

      if (!d.books.length) {
        // 初回起動ガイド(空のライブラリ)
        var g = el("div", "guide");
        g.appendChild(el("h3", null, "ブックがまだありません"));
        var steps = document.createElement("ol");
        [
          "ライブラリフォルダの中に、1冊 = 1フォルダで音声とスライド定義を置きます(audio.mp3 と deck.json)",
          "サーバをそのフォルダで起動し直します",
          "このページを再読み込みすると本棚に現れます"
        ].forEach(function (s) { steps.appendChild(el("li", null, s)); });
        g.appendChild(steps);
        var cmd = el("p");
        cmd.appendChild(document.createTextNode("起動例: "));
        var code = el("code", null, "python server/kikimiru_server.py --library /path/to/library");
        cmd.appendChild(code);
        g.appendChild(cmd);
        g.appendChild(el("p", null, "ファイル形式の詳細は同梱の docs/SCHEMA.md を参照してください。デモを見るには --library を付けずに起動します。"));
        content.appendChild(g);
        return;
      }

      // 「続きから」 — 進行中(2〜97%)のブックを最後に聴いた順で
      var inProgress = d.books.map(function (b) {
        var pos = loadPos(b.library, b.id);
        return { book: b, pos: pos, st: posState(pos) };
      }).filter(function (x) { return x.st.st === "listening"; })
        .sort(function (a, b) { return (b.pos.at || 0) - (a.pos.at || 0); });

      if (inProgress.length) {
        var sec1 = el("section", "sec");
        sec1.setAttribute("aria-label", "続きから");
        var h1 = el("div", "sec-head");
        h1.appendChild(el("h2", null, "続きから"));
        sec1.appendChild(h1);
        var car1 = el("div", "carousel");
        inProgress.slice(0, 6).forEach(function (x) { car1.appendChild(resumeCard(x.book, x.pos, x.st)); });
        sec1.appendChild(car1);
        content.appendChild(sec1);
      }

      // 「最近追加」 — 続きから掲載分は重複させない
      var shown = {};
      inProgress.slice(0, 6).forEach(function (x) { shown[x.book.id] = true; });
      var recent = d.books.filter(function (b) { return !shown[b.id]; }).slice(0, 12);
      if (recent.length) {
        var sec2 = el("section", "sec");
        sec2.setAttribute("aria-label", "最近追加");
        var h2 = el("div", "sec-head");
        h2.appendChild(el("h2", null, "最近追加"));
        var all2 = document.createElement("a");
        all2.className = "all";
        all2.href = qs({ view: "library", sort: "added" });
        all2.appendChild(document.createTextNode("すべて表示"));
        var ch2 = document.createElement("span");
        ch2.innerHTML = I.chevR;
        all2.appendChild(ch2.firstChild);
        h2.appendChild(all2);
        sec2.appendChild(h2);
        var car2 = el("div", "carousel");
        recent.forEach(function (b) { car2.appendChild(bookCard(b)); });
        sec2.appendChild(car2);
        content.appendChild(sec2);
      }

      // シリーズ + ブラウズ
      return api("/api/series").then(function (s) {
        var cols = el("div", "two-col");

        if (s.series.length) {
          var secS = el("section", "sec");
          secS.setAttribute("aria-label", "シリーズ");
          var hS = el("div", "sec-head");
          hS.appendChild(el("h2", null, "シリーズ"));
          var allS = document.createElement("a");
          allS.className = "all";
          allS.href = qs({ view: "series" });
          allS.appendChild(document.createTextNode("すべて表示"));
          var chS = document.createElement("span");
          chS.innerHTML = I.chevR;
          allS.appendChild(chS.firstChild);
          hS.appendChild(allS);
          secS.appendChild(hS);
          var sl = el("div", "series-list");
          s.series.slice(0, 3).forEach(function (g) { sl.appendChild(seriesCard(g)); });
          secS.appendChild(sl);
          cols.appendChild(secS);
        }

        var secB = el("section", "sec");
        secB.setAttribute("aria-label", "ブラウズ");
        var hB = el("div", "sec-head");
        hB.appendChild(el("h2", null, "ブラウズ"));
        secB.appendChild(hB);
        var bg = el("div", "browse-grid");
        // 件数はブック一覧から算出(追加リクエストなし)
        var tagCount = {}, authorCount = {}, narratorCount = {};
        d.books.forEach(function (b) {
          (b.tags || []).forEach(function (t) { tagCount[t] = 1; });
          (b.authors || []).forEach(function (a) { authorCount[a] = 1; });
          (b.narrators || []).forEach(function (n) { narratorCount[n] = 1; });
        });
        var g1 = el("div", "group");
        g1.appendChild(groupRow("person", "著者", Object.keys(authorCount).length, qs({ view: "authors" })));
        g1.appendChild(groupRow("mic", "話者", Object.keys(narratorCount).length, qs({ view: "narrators" })));
        g1.appendChild(groupRow("folder", "コレクション", null, qs({ view: "collections" })));
        bg.appendChild(g1);
        var g2 = el("div", "group");
        g2.appendChild(groupRow("tag", "タグ", Object.keys(tagCount).length, qs({ view: "tags" })));
        g2.appendChild(groupRow("stats", "統計", d.books.length + "冊", qs({ view: "stats" })));
        if (offlineCapable()) {
          var offRow = groupRow("download", "オフライン保存", "…", qs({ view: "offline" }));
          listSavedBooks().then(function (s) {
            var total = s.items.reduce(function (sum, it) { return sum + (it.bytes || 0); }, 0);

          });

        // テーマ切替(ライト/ダーク)
        var themeNow = currentTheme();

                          themeNow === "light" ? "ライト" : "ダーク", "#");
        th.addEventListener("click", function (ev) {
          ev.preventDefault();
          var next = currentTheme() === "light" ? "dark" : "light";
          lsSet("kikimiru.theme", next);
          applyTheme(next);
          th.querySelector(".gic").innerHTML = I[next === "light" ? "sun" : "moon"];
          th.querySelector(".val").textContent = next === "light" ? "ライト" : "ダーク";
        });
        g2.appendChild(th);
        var lo = groupRow("logout", "ログアウト", null, "#");
        lo.addEventListener("click", function (ev) {

          fetch("/api/logout", { method: "POST" })

            .catch(function () { location.reload(); });

        g2.appendChild(lo);
        bg.appendChild(g2);
        secB.appendChild(bg);
        cols.appendChild(secB);

        content.appendChild(cols);
      });
    }).catch(function (e) { showError(e); });

  function viewStats() {
    Promise.all([api("/api/stats"), api("/api/books")]).then(function (res) {
      var s = res[0].stats;
      var books = res[1].books;
      content.textContent = "";

      // 端末ローカルの進捗から聴取状況を算出

      });

      var tiles = [
        [String(s.books), "ブック"],
        [fmtLong(s.duration), "総再生時間"],
        [String(s.slides), "スライド総数"],
        [String(s.authors), "著者"],
        [String(s.narrators), "話者"],
        [String(s.series), "シリーズ"],
        [String(s.tags), "タグ"],
        [s.withCover + " / " + s.books, "カバーあり"],
        [String(done), "聴き終えた"],
        [String(listening), "聴いている途中"]
      ];
      var grid = el("div", "stats");
      tiles.forEach(function (t) {
        var tile = el("div", "stile");
        tile.appendChild(el("div", "v", t[0]));
        tile.appendChild(el("div", "l", t[1]));

      });

        var offTile = el("div", "stile");

        offTile.appendChild(el("div", "l", "オフライン保存済み"));
        grid.appendChild(offTile);
        listSavedBooks().then(function (s) { offV.textContent = String(s.items.length); });
      }
