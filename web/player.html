    }).catch(function (e) { showError(e); });
  }

  function viewCollections() {
    Promise.all([api("/api/collections"), api("/api/books")]).then(function (res) {
      var collections = res[0].collections;
      var books = res[1].books;
      var byId = Object.create(null);
      books.forEach(function (b) { byId[b.id] = b; });
      content.textContent = "";

      // 新規作成(インライン入力 — ブラウザのprompt()は使わない)
      var form = document.createElement("form");
      form.className = "newcol";
      var nameBox = document.createElement("input");
      nameBox.placeholder = "新しいコレクション名";
      nameBox.setAttribute("aria-label", "新しいコレクション名");
      form.appendChild(nameBox);
      var addBtn = el("button", "btn primary", "作成");
      addBtn.type = "submit";
      form.appendChild(addBtn);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var name = nameBox.value.trim();
        if (!name) return;
        collections.push({ name: name, books: [] });
        putCollections(collections);
      });
      content.appendChild(form);

      if (!collections.length) {
        content.appendChild(el("div", "empty", "コレクションはまだありません。よく聴く本や作業用プレイリストなど、自由なくくりを作れます。"));
        return;
      }

      collections.forEach(function (c, idx) {
        var head = el("div", "colhead");
        head.appendChild(el("span", "nm", c.name));
        head.appendChild(el("span", "ct", c.books.length + "冊"));
        var ops = el("div", "ops");
        var editBtn = el("button", "btn", "ブックを追加/編集");
        editBtn.type = "button";
        // 削除は2段階(1回目で確認状態、3秒で戻る) — confirm()ダイアログは使わない
        var delBtn = el("button", "btn", "削除");
        delBtn.type = "button";
        var armTimer = null;
        delBtn.addEventListener("click", function () {
          if (delBtn.classList.contains("danger-armed")) {
            collections.splice(idx, 1);
            putCollections(collections);
            return;
          }
          delBtn.classList.add("danger-armed");
          delBtn.textContent = "本当に削除?";
          armTimer = setTimeout(function () {
            delBtn.classList.remove("danger-armed");
            delBtn.textContent = "削除";
          }, 3000);
        });
        ops.appendChild(editBtn);
        ops.appendChild(delBtn);
        head.appendChild(ops);
        content.appendChild(head);

        var member = c.books.map(function (id) { return byId[id]; }).filter(Boolean);
        if (member.length) {
          var grid = el("div", "grid");
          member.forEach(function (b) { grid.appendChild(bookCard(b)); });
          content.appendChild(grid);
        } else {
          content.appendChild(el("div", "empty", "まだブックがありません。「ブックを追加/編集」から選べます。"));
        }

        editBtn.addEventListener("click", function () {
          if (head.nextElementSibling && head.nextElementSibling.classList.contains("picker")) return;
          var picker = el("div", "picker");
          var checks = [];
          books.forEach(function (b) {
            var label = document.createElement("label");
            var cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = c.books.indexOf(b.id) !== -1;
            checks.push([cb, b.id]);
            label.appendChild(cb);
            label.appendChild(document.createTextNode(b.title));
            picker.appendChild(label);
          });
          var ops2 = el("div", "ops");
          var save = el("button", "btn primary", "保存");
          save.type = "button";
          save.addEventListener("click", function () {
            c.books = checks.filter(function (x) { return x[0].checked; }).map(function (x) { return x[1]; });
            putCollections(collections);
          });
          var cancel = el("button", "btn", "キャンセル");
          cancel.type = "button";
          cancel.addEventListener("click", function () { picker.remove(); });
          ops2.appendChild(save);
          ops2.appendChild(cancel);
          picker.appendChild(ops2);
          head.after(picker);
        });
      });
    }).catch(function (e) { showError(e); });
  }

  // ================= オフライン保存の管理画面 =================
  function viewOffline() {
    Promise.all([
      listSavedBooks(),
      api("/api/books").catch(function () { return { books: [] }; })
    ]).then(function (res) {
      var saved = res[0];
      var byId = Object.create(null);
      res[1].books.forEach(function (b) { byId[b.library + "/" + b.id] = b; });
      content.textContent = "";

      if (saved.evicted > 0) {
        warn("一部のオフライン保存(" + saved.evicted + "件)がシステムにより削除されていました。必要なら保存し直してください。");
      }

      // 使用量ゲージ(storage.estimate が使える環境のみ quota を表示)
      var totalBytes = saved.items.reduce(function (s, it) { return s + (it.bytes || 0); }, 0);
      var gauge = el("div", "off-gauge");
      var row1 = el("div", "row1");
      row1.appendChild(el("span", null, "保存済み " + saved.items.length + "冊 · " + fmtMB(totalBytes)));
      var quotaLabel = el("span", null, "");
      row1.appendChild(quotaLabel);
      gauge.appendChild(row1);
      var bar = el("div", "bar");
      var fill = document.createElement("i");
      bar.appendChild(fill);
      gauge.appendChild(bar);
      content.appendChild(gauge);
      if (navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(function (est) {
          if (!est || !est.quota) { quotaLabel.textContent = "空き容量: 不明"; return; }
          quotaLabel.textContent = "端末の割当 " + fmtMB(est.quota) + " 中 " + fmtMB(est.usage || 0) + " 使用";
          fill.style.width = Math.min(100, (est.usage || 0) / est.quota * 100) + "%";
        }).catch(function () { quotaLabel.textContent = "空き容量: 不明"; });
      } else {
        quotaLabel.textContent = "空き容量: 不明";
      }

      if (!saved.items.length) {
        content.appendChild(el("div", "empty",
          "オフライン保存はまだありません。ブック詳細の「オフライン保存」で、音声と本文を丸ごとこの端末に保存できます。"));
        return;
      }

      var group = el("div", "group");
      saved.items.forEach(function (it) {
        var b = byId[it.lib + "/" + it.id];
        var row = el("div", "grow");
        var cov = el("span", "cov");
        cov.style.cssText = "width:38px;height:38px;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0;background:var(--bg-elev2)";
        coverInto(cov, it.lib, it.id, b && b.cover, (b && b.title) || it.id, true);
        row.appendChild(cov);
        var lbl = el("span", "lbl");
        var link = document.createElement("a");
        link.href = qs({ view: "book", book: it.id });
        link.textContent = (b && b.title) || it.id;
        lbl.appendChild(link);
        row.appendChild(lbl);
        row.appendChild(el("span", "val", fmtMB(it.bytes)));
        var del = el("button", "off-row-del", "削除");
        del.type = "button";
        var delArm = null;
        del.addEventListener("click", function () {
          if (del.classList.contains("danger-armed")) {
            if (delArm) clearTimeout(delArm);
            deleteBookDownload(it.lib, it.id).then(viewOffline);
            return;
          }
          del.classList.add("danger-armed");
          del.textContent = "本当に削除?";
          delArm = setTimeout(function () {
            del.classList.remove("danger-armed");
            del.textContent = "削除";
          }, 3000);
        });
        row.appendChild(del);
        group.appendChild(row);
      });
      group.style.maxWidth = "560px";
      content.appendChild(group);

      // すべて削除(影響範囲を明示した2段階確認)
      var allDel = el("button", "btn", "すべて削除");
      allDel.type = "button";
      allDel.style.cssText = "margin-top:14px";
      var allArm = null;
      allDel.addEventListener("click", function () {
        if (allDel.classList.contains("danger-armed")) {
          if (allArm) clearTimeout(allArm);
          var chain = Promise.resolve();
          saved.items.forEach(function (it) {
            chain = chain.then(function () { return deleteBookDownload(it.lib, it.id); });
          });
          chain.then(viewOffline);
          return;
        }
        allDel.classList.add("danger-armed");
        allDel.textContent = "すべてのオフライン保存(" + saved.items.length + "冊・" + fmtMB(totalBytes) + ")を削除?";
        allArm = setTimeout(function () {
          allDel.classList.remove("danger-armed");
          allDel.textContent = "すべて削除";
        }, 4000);
      });
      content.appendChild(allDel);

      content.appendChild(el("div", "stats-note",
        "オフライン保存はこの端末のブラウザにのみ置かれ、空き容量が少ないとブラウザの判断で自動削除されることがあります。ホーム画面に追加(インストール)すると保たれやすくなります。"));
    }).catch(function (e) { showError(e); });
  }

  function putCollections(collections) {
    var p = new URLSearchParams();
    if (state.lib) p.set("library", state.lib);
    fetch("/api/collections?" + p.toString(), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ collections: collections })
    }).then(function (r) {
      if (!r.ok) throw new Error("保存に失敗しました(" + r.status + ")");
      viewCollections();  // 全画面リロードせず部分再描画で反映する
    }).catch(function (e) { warn(String(e.message || e)); });
  }

  function showError(e) {
    content.textContent = "";
    content.appendChild(el("div", "empty", "読み込みエラー: " + (e.message || e)));
  }

  // ================= ブック詳細画面 =================
  function getBook(id) {
    // 単体API(v2.1)を使い、無い場合(旧サーバ)は一覧から探すフォールバック
    return api("/api/books/" + encodeURIComponent(id)).then(function (d) { return d.book; })
      .catch(function () {
        return api("/api/books").then(function (d) {
          var b = d.books.filter(function (x) { return x.id === id; })[0];
          if (!b) throw new Error("ブックが見つかりません");
          return b;
        });
      });
  }

  function metaRow(key, valueNode) {
    var row = el("div", "mrow");
    row.appendChild(el("span", "k", key));
    row.appendChild(valueNode);
    return row;
  }
  function metaLink(text, href) {
    var a = document.createElement("a");
    a.className = "v";
    a.href = href;
    a.textContent = text;
    return a;
  }

  function viewBook(bookId) {
    getBook(bookId).then(function (b) {
      document.title = b.title + " — kikimiru";
      content.textContent = "";
      var box = el("div", "detail");

      var cover = el("div", "cover");
      coverInto(cover, b.library, b.id, b.cover, b.title);
      box.appendChild(cover);

      box.appendChild(el("h2", "btitle", b.title));
      if (b.authors && b.authors.length) {
        var au = document.createElement("a");
        au.className = "bauthor";
        au.href = qs({ view: "library", author: b.authors[0] });
        au.textContent = b.authors.join(" / ");
        box.appendChild(au);
      }
      var bmeta = "スライド " + b.slides + "枚";
      if (b.duration) bmeta += " · " + fmt(b.duration);
      box.appendChild(el("div", "bmeta", bmeta));

      // CTA: 進捗があれば「続きから再生」、なければ「再生」
      var pos = loadPos(b.library, b.id);
      var st = posState(pos);
      var cta = document.createElement("a");
      cta.className = "cta";
      cta.href = qs({ book: b.id });
      cta.addEventListener("click", function (ev) {
        ev.preventDefault();
        openPlayerOverlay(b.id);
      });
      // オフライン中、未保存ブックのCTAは薄く見せる(ガード自体は openPlayerOverlay)
      if (!navigator.onLine && offlineCapable()) {
        isBookDownloaded(b.library, b.id).then(function (has) {
          if (!has) cta.classList.add("cta-unsaved");
        });
      }
      var ctaIcon = document.createElement("span");
      ctaIcon.innerHTML = I.play;
      cta.appendChild(ctaIcon.firstChild);
      cta.appendChild(document.createTextNode(
        st.st === "listening" ? "続きから再生 · " + fmt(pos.t) :
        st.st === "done" ? "もう一度再生" : "再生"));
      box.appendChild(cta);

      var subs = el("div", "sub-actions");
      var restart = document.createElement("a");
      restart.className = "sab";
      restart.href = qs({ book: b.id, restart: "1" });
      restart.textContent = "最初から再生";
      subs.appendChild(restart);
      var markDone = el("button", "sab", st.st === "done" ? "聴了を取り消す" : "聴了にする");
      markDone.type = "button";
      markDone.addEventListener("click", function () {
        if (st.st === "done") clearPos(b.library, b.id);
        else if (b.duration) savePos(b.library, b.id, b.duration, b.duration);
        viewBook(bookId);  // 状態を反映して再描画
      });
      subs.appendChild(markDone);
      // チャプター書き出し(Podcasting 2.0 JSON Chapters)。
      // 内容は deck 側の構造(開始秒)+章タイトルのみ(構造と本文の分離の原則)
      var exportBtn = el("button", "sab", "チャプター書き出し");
      exportBtn.type = "button";
      exportBtn.addEventListener("click", function () {
        exportBtn.disabled = true;
        var base2 = bookBase(b.library, b.id);
        Promise.all([
          fetch(base2 + "deck.json").then(function (r) {
            if (!r.ok) throw new Error("deck.json " + r.status);
            return r.json();
          }),
          fetch(base2 + "content.json").then(function (r) {
            return r.ok ? r.json() : null;
          }).catch(function () { return null; })
        ]).then(function (res) {
          var deck = res[0];
          var bodyMap = Object.create(null);
          if (res[1] && res[1].slides) {
            Object.keys(res[1].slides).forEach(function (k) { bodyMap[k] = res[1].slides[k]; });
          }
          var cues2 = (deck.cues || []).slice().sort(function (x, y) { return x.t - y.t; });
          if (!cues2.length) throw new Error("cues がありません");
          var chapters = cues2.map(function (cue) {
            var body2 = bodyMap[cue.slide] || {};
            return {
              startTime: cue.t,
              title: (typeof body2.title === "string" && body2.title) || cue.slide
            };
          });
          var blob = new Blob(
            [JSON.stringify({ version: "1.2.0", chapters: chapters }, null, 2)],
            { type: "application/json+chapters" });
          var dl = document.createElement("a");
          dl.href = URL.createObjectURL(blob);
          dl.download = b.id + ".chapters.json";
          document.body.appendChild(dl);
          dl.click();
          dl.remove();
          setTimeout(function () { URL.revokeObjectURL(dl.href); }, 5000);
        }).catch(function (e) {
          warn("チャプターを書き出せませんでした: " + (e.message || e));
        }).then(function () { exportBtn.disabled = false; });
      });
      subs.appendChild(exportBtn);
      // オフライン保存(Cache Storageへ一式保存。進捗はボタン自体に表示)
      if (offlineCapable()) {
        var dlBtn = el("button", "sab", "オフライン保存");
        dlBtn.type = "button";
        dlBtn.dataset.state = "none";
        var dlArm = null;
        function paintDl() {
          isBookDownloaded(b.library, b.id).then(function (has) {
            if (!dlBtn.isConnected) return;
            dlBtn.classList.remove("danger-armed");
            dlBtn.dataset.state = has ? "saved" : "none";
            dlBtn.textContent = has ? "保存を削除" : "オフライン保存";
          });
        }
        dlBtn.addEventListener("click", function () {
          if (dlBtn.dataset.state === "busy") return;
          if (dlBtn.dataset.state === "saved") {
            // 削除は2段階(1回目で確認・3秒で戻る)
            if (dlBtn.classList.contains("danger-armed")) {
              if (dlArm) clearTimeout(dlArm);
              deleteBookDownload(b.library, b.id).then(paintDl);
              return;
            }
            dlBtn.classList.add("danger-armed");
            dlBtn.textContent = "本当に削除?";
            dlArm = setTimeout(paintDl, 3000);
            return;
          }
          dlBtn.dataset.state = "busy";
          downloadBook(b, function (got, total) {
            dlBtn.textContent = total > 0
              ? "保存中… " + Math.min(99, Math.round(got / total * 100)) + "%"
              : "保存中… " + (got / 1048576).toFixed(1) + "MB";
          }).then(function () {
            paintDl();
            // 非インストール環境には一度だけ、消えやすさを正直に案内する
            if (!window.matchMedia("(display-mode: standalone)").matches &&
                lsGet("kikimiru.dlhint") !== "1") {
              lsSet("kikimiru.dlhint", "1");
              warn("保存しました。ブラウザのタブ利用では、長期間使わないと保存が消されることがあります。ホーム画面に追加(インストール)すると保たれやすくなります。");
            }
          }).catch(function (e) {
            paintDl();
            if (e && e.name === "QuotaExceededError") {
              warn("空き容量が足りないため保存できませんでした。");
            } else {
              warn("オフライン保存に失敗しました: " + (e && e.message || e));
            }
          });
        });
        subs.appendChild(dlBtn);
        paintDl();
      }
      box.appendChild(subs);

      var group = el("div", "meta-group");
      // 進捗
      var pv = el("span", "v");
      pv.style.cssText = "color:var(--tint);font-weight:700";
      pv.textContent = st.st === "done" ? "聴了" :
        st.st === "listening" ? Math.round(st.pct * 100) + "% · 残り " + fmt(pos.d - pos.t) : "未再生";
      group.appendChild(metaRow("進捗", pv));
      if (b.authors && b.authors.length) {
        group.appendChild(metaRow("著者", metaLink(b.authors.join(" / "), qs({ view: "library", author: b.authors[0] }))));
      }
      if (b.narrators && b.narrators.length) {

      }
      if (b.addedAt) {
        group.appendChild(metaRow("追加日", el("span", "v", b.addedAt)));

      if (b.tags && b.tags.length) {

        b.tags.forEach(function (t) {

      box.appendChild(group);

      if (b.description) {

      content.appendChild(box);

      // 同シリーズの他の本
      if (b.series && b.series.name) {
        return api("/api/books", { series: b.series.name, sort: "series" }).then(function (d) {
          var others = d.books.filter(function (x) { return x.id !== b.id; });
          if (!others.length) return;
          var rail = el("section", "sec detail-rail");
          var head = el("div", "sec-head");
          head.appendChild(el("h2", null, "シリーズ「" + b.series.name + "」の他の本"));
          rail.appendChild(head);

  // ================= プレイヤーオーバーレイ制御 =================
  // ミニプレイヤーからページ遷移せず展開し、引き下げで縮小する。
  // <audio> はオーバーレイ内に留まり破棄されないため、開閉しても再生が途切れない。
  var overlayOpen = false;
  var overlayBookId = null;

  function openPlayerOverlay(bookId) {
    if (overlayOpen && overlayBookId === bookId) return;
    // オフライン中は保存済みブックだけ開ける(全ての再生入口をここで一括ガード)
    if (!navigator.onLine && offlineCapable() && overlayBookId !== bookId) {
      isBookDownloaded(state.lib, bookId).then(function (has) {
        if (has) openPlayerOverlayNow(bookId);
        else warn("オフラインです。このブックは保存されていないため再生できません(オンライン時にブック詳細から「オフライン保存」できます)。");
      });
      return;
    }
    openPlayerOverlayNow(bookId);
  }
  function openPlayerOverlayNow(bookId) {
    var host = document.getElementById("playerHost");
    // 同じブックを開き直す場合は再描画しない(audioを作り直すと再生が途切れるため)
    if (!overlayOpen && overlayBookId === bookId && host.childElementCount > 0) {
      overlayOpen = true;
      document.body.classList.remove("player-closing");
      document.body.classList.add("player-open");
      try {
        history.pushState({ player: bookId }, "", qs({ book: bookId }));
      } catch (e) { /* file:// 等では無視 */ }
      return;
    }
    var start = function () {
      host.textContent = "";
      overlayBookId = bookId;
      overlayOpen = true;
      document.body.classList.remove("player-closing");
      document.body.classList.add("player-open");
      // URLを差し替えて共有・再読込・戻るに耐えるようにする(遷移はしない)
      try {
        history.pushState({ player: bookId }, "", qs({ book: bookId }));
      } catch (e) { /* file:// 等では無視 */ }
      viewPlayer(bookId, host);
    };
    // View Transitions が使えるならミニ⇄全画面をブラウザに補間させる
    if (document.startViewTransition) document.startViewTransition(start);
    else start();
  }

  function closePlayerOverlay(replaceUrl) {
    if (!overlayOpen) return;
    overlayOpen = false;
    document.body.classList.add("player-closing");
    document.body.classList.remove("player-open");
    document.body.classList.remove("np-fs");
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function () {});
    }
    document.getElementById("playerOverlay").style.transform = "";
    // 中身は破棄しない — <audio> を生かしたまま隠すことで再生が途切れない
    // (閉じる=破棄ではなく非表示に留める。破棄は別のブックを開くとき)
    setTimeout(function () {
      if (!overlayOpen) document.body.classList.remove("player-closing");
    }, 380);
    if (replaceUrl !== false) {
      try { history.pushState({}, "", qs({ view: state.view })); } catch (e) {}
    }
    // 閉じたらドックを出し直す(再生は継続している)
    api("/api/books").then(function (d) { renderDock(d.books); }).catch(function () {});
  }

  // 引き下げジェスチャー(2段スナップ: 速度500px/s超は方向優先、以下は距離で判定)
  (function initDragToClose() {
    var overlay = document.getElementById("playerOverlay");
    var handle = document.getElementById("dragHandle");
    var startY = 0, startT = 0, dragging = false, lastY = 0, lastT = 0;

    function down(ev) {
      if (!overlayOpen) return;
      dragging = true;
      startY = lastY = ev.clientY;
      startT = lastT = performance.now();
      document.body.classList.add("player-dragging");
      handle.setPointerCapture(ev.pointerId);
    }
    function move(ev) {
      if (!dragging) return;
      var dy = Math.max(0, ev.clientY - startY);   // 下方向のみ追従
      overlay.style.transform = "translateY(" + dy + "px)";
      lastY = ev.clientY; lastT = performance.now();
    }
    function up(ev) {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove("player-dragging");
      var dy = Math.max(0, ev.clientY - startY);
      var dt = Math.max(1, performance.now() - lastT + 1);
      var velocity = (ev.clientY - lastY) / dt * 1000;   // px/s
      overlay.style.transform = "";
      // フリック速度が閾値超なら位置に関係なく方向優先、以下なら移動距離で判定
      var shouldClose = velocity > 500 || (velocity > -500 && dy > window.innerHeight * 0.25);
      if (shouldClose) closePlayerOverlay();
    }
    handle.addEventListener("pointerdown", down);
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
    handle.addEventListener("click", function () { if (overlayOpen) closePlayerOverlay(); });
    handle.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); closePlayerOverlay(); }
    });
  })();

  // 戻る操作でオーバーレイを閉じる(履歴と表示を一致させる)
  window.addEventListener("popstate", function (ev) {
    var wantPlayer = ev.state && ev.state.player;
    if (overlayOpen && !wantPlayer) closePlayerOverlay(false);
    else if (!overlayOpen && wantPlayer) openPlayerOverlay(wantPlayer);
  });

  // ================= プレイヤー画面(Now Playing・再構築版) =================
  // 構成: 表紙既定の縦積み+下部アクション列 / 上部タブで表紙⇄スライド切替 /
  // 下スクロールで章要約の縦積み / 全画面はタップ表示コントロール。

  // 前回の描画で document/window/matchMedia に張ったリスナーの後始末。
  // オーバーレイを閉じても音声は生かすため、後始末は「次の描画の直前」にだけ行う。
  var playerCleanup = null;
  function runPlayerCleanup() {
    if (!playerCleanup) return;
    try { playerCleanup(); } catch (e) { /* 後始末の失敗は無視 */ }

    playerCleanup = function () { cleanups.forEach(function (fn) { fn(); }); };
    function on(target, ev, fn) {

    var wrap = el("div", "np-wrap mode-cover");

      '<button type="button" class="np-tbtn skipnum" id="fwd30" aria-label="30秒進める">' + I.fwd10 + '<span class="n">30</span></button>' +
      '<button type="button" class="np-tbtn" id="next" aria-label="次のチャプター">' + I.nextSlide + '</button>' +
      '</div>' +
      '<div class="np-actions">' +
      '<button type="button" class="np-act" id="actSpeed"><span class="big" id="speedVal">1.0×</span><span class="lb">速度</span></button>' +
      '<button type="button" class="np-act" id="actTimer"><span class="ic">' + I.timer + '</span><span class="lb" id="timerLb">タイマー</span></button>' +
      '<a class="np-act" id="actDetail"><span class="ic">' + I.series + '</span><span class="lb">タイトル詳細</span></a>' +
      '</div>' +
      '<button type="button" class="np-hint" id="npHint">チャプター</button>' +
      '</div>' +
      '<div class="np-chapters" id="npChapters">' +
      '<div class="np-ch-head"><span class="np-ch-tab">チャプター</span><span class="np-ch-count" id="chCount"></span></div>' +
      '<div class="np-chlist" id="chList" role="list"></div>' +
      '</div>' +
      '</div>' +
      '<audio id="audio" preload="metadata" style="display:none"></audio>';
    content.appendChild(wrap);

    function $(id) { return document.getElementById(id); }

    // ---- 閉じる/詳細への導線 ----
    var closeEl = $("npClose");
    closeEl.href = qs({ view: "book", book: bookId });
    if (hostEl) {
      closeEl.addEventListener("click", function (ev) {
        ev.preventDefault();
        closePlayerOverlay();
      });
    }
    ["npDetail", "chipDetail", "actDetail"].forEach(function (id) {
      $(id).href = qs({ view: "book", book: bookId });
    });

    // ---- 表紙⇄スライドのタブ。選択は端末に記憶 ----
    var npMode = lsGet("kikimiru.npTab") === "slide" ? "slide" : "cover";
    var segCover = $("segCover"), segSlide = $("segSlide");
    // スライドタブへ入った時の追加処理(データ読込後に差し込まれる。停止中はコントロール表示)
    var onSlideMode = null;
    function setMode(m, persist) {
      npMode = m;
      if (persist !== false) lsSet("kikimiru.npTab", m);
      wrap.classList.toggle("mode-cover", m === "cover");
      wrap.classList.toggle("mode-slide", m === "slide");
      segCover.classList.toggle("cur", m === "cover");

    segSlide.addEventListener("click", function () { setMode("slide"); });
    setMode(npMode, false);

    // スクロールで上部バーに地を敷き、表紙モードでは小型バーを出す
    var scrollEl = $("npScroll");
    scrollEl.addEventListener("scroll", function () {
      wrap.classList.toggle("scrolled", scrollEl.scrollTop > 30);
    });

    Promise.all([
      fetch(base + "deck.json").then(function (r) { if (!r.ok) throw new Error("deck.json " + r.status); return r.json(); }),
      // content.json は無くても動く(構造/本文分離): その場合はスライドID・種別のみ表示
      fetch(base + "content.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      // 書誌(カバー・著者・シリーズ)。取れなくても再生は成立させる
      getBook(bookId).catch(function () { return null; })
    ]).then(function (res) {
      var deck = res[0];
      var meta = res[2];
      // プロトタイプ汚染耐性: 外部データ(スライドid)をキーにするためObject.create(null)にする
      var bodyMap = Object.create(null);
      if (res[1] && res[1].slides) {
        Object.keys(res[1].slides).forEach(function (k) { bodyMap[k] = res[1].slides[k]; });
      }

      var title = (typeof deck.title === "string" && deck.title) || bookId;
      $("npTitle").textContent = title;
      $("ccTitle").textContent = title;
      $("fsTitle").textContent = title;
      var subParts = [];
      if (meta && meta.authors && meta.authors.length) subParts.push(meta.authors.join(" / "));
      if (meta && meta.series) {
        subParts.push(meta.series.name + (meta.series.sequence ? " #" + meta.series.sequence : ""));
      }
      $("npSub").textContent = subParts.join(" · ");
      // 1行に収まらない長題は左右に流して全文を見せる(幅変化にも追従)
      function fitMarquee() {
        var h1 = $("npTitleBox");
        var span = $("npTitle");
        var over = span.scrollWidth - h1.clientWidth;
        if (over > 8) {
          h1.classList.add("marquee");
          h1.style.setProperty("--marq-x", (-(over + 16)) + "px");
          h1.style.setProperty("--marq-dur", Math.max(6, over / 22) + "s");
        } else {
          h1.classList.remove("marquee");
        }
      }
      fitMarquee();
      on(window, "resize", fitMarquee);
      document.title = title + " — kikimiru";
      if (!res[1]) warn("content.json が無いため、スライドは構成情報のみ表示しています。");

      // 表紙(正方形ボックス・小型バー)とぼかし背景
      coverInto($("npCover"), lib, bookId, meta && meta.cover, title);
      coverInto($("ccCov"), lib, bookId, meta && meta.cover, title, true);
      if (meta && meta.cover) {
        var bgImg = document.createElement("img");
        bgImg.alt = "";
        bgImg.src = bookBase(lib, bookId) + encodeURIComponent(meta.cover);
        $("npBg").appendChild(bgImg);
      }

      if ("mediaSession" in navigator) {
        var msMeta = { title: title, artist: (meta && meta.authors && meta.authors.join(" / ")) || "kikimiru" };
        if (meta && meta.cover) {
          msMeta.artwork = [{ src: bookBase(lib, bookId) + encodeURIComponent(meta.cover) }];
        }
        navigator.mediaSession.metadata = new MediaMetadata(msMeta);
      }

      var audio = $("audio");

      // audio.src の組み立て前にファイル名を検証する(パス区切り・親ディレクトリ参照・
      // クエリ/フラグメントの混入を拒否し、意図しないリクエストになるのを防ぐ)
      var audioName = (deck.audio && typeof deck.audio.src === "string" && deck.audio.src) || "audio.mp3";
      if (/[\/\\]|\.\.|[?#]/.test(audioName)) {
        warn("音声ファイル名が不正なため読み込みを中止しました: " + audioName);
      } else {
        var audioUrl = base + encodeURIComponent(audioName);
        // オフライン再生のフォールバック: 保存済みキャッシュからBlobを取り出し
        // blob: URLで直接再生する。iOSにはメディア要素のリクエストがService Workerを
        // 経由しない挙動があり、SW側の206合成だけでは再生が始まらないことがあるため、
        // HTTP層を通らないこの経路を第二の道として持つ
        var triedBlob = false;
        function tryBlobSrc() {
          if (triedBlob || !offlineCapable()) return Promise.resolve(false);
          triedBlob = true;
          return caches.match(audioUrl).then(function (cached) {
            if (!cached) return false;
            return cached.blob().then(function (bl) {
              var u = URL.createObjectURL(bl);
              cleanups.push(function () { URL.revokeObjectURL(u); });
              var keepT = audio.currentTime;
              var wasPlaying = !audio.paused;
              audio.src = u;
              audio.load();
              audio.addEventListener("loadedmetadata", function () {
                if (keepT > 0) audio.currentTime = keepT;
                if (wasPlaying) audio.play().catch(function () {});
              }, { once: true });
              return true;
            });
          }).catch(function () { return false; });
        }
        audio.addEventListener("error", function () {
          // 通常URLで読めなかった場合、保存済みならBlob経路で立て直す
          tryBlobSrc().then(function (ok) {
            if (!ok) warn("音声を読み込めませんでした: " + audioName);
          });
        });
        if (!navigator.onLine) {
          // 機内モード等: 最初からBlob経路を使う(保存が無ければ通常URLに任せて
          // エラー表示につなげる)
          tryBlobSrc().then(function (ok) {
            if (!ok) audio.src = audioUrl;
          });
        } else {
          audio.src = audioUrl;
        }
      }

      var cues = (deck.cues || []).slice().sort(function (a, b) { return a.t - b.t; });
      if (!cues.length) {
        // cuesが空のdeckはcues[0]参照で例外になりUIが半壊するため、ここで止める
        warn("この本には再生可能なスライドがありません(deck.jsonのcuesが空です)");
        return;
      }

      var slideMeta = Object.create(null);
      (deck.slides || []).forEach(function (s) { if (s && s.id) slideMeta[s.id] = s; });
      var cur = -1;

      function dur() { return audio.duration || (deck.audio && deck.audio.duration) || 0; }

      // ---- スライド描画 ----
      var slideEl = $("slide");

      // 画像スライド(v2.1)のパス検証とURL化。各セグメントを個別に検査・エンコード
      function slideImageUrl(image) {
        if (typeof image !== "string" || !image) return null;
        var segs = image.split("/");
        if (segs.length > 2) return null;
        for (var k = 0; k < segs.length; k++) {
          if (!segs[k] || segs[k].charAt(0) === "." ||
              /\\|\.\.|[?#]/.test(segs[k])) return null;
        }

      // 先読み済み画像の保持。切替時に「読み込み済みか」を同期的に判定できるようにし、

      var imgCache = Object.create(null);
      function prefetchSlideImage(i) {
        if (i < 0 || i >= cues.length) return;

      var chapEls = [];

        slideEl.querySelector(".kind").textContent = kindLabel;

      // ---- シークバー(本体+メディア面内の2本を同時に塗る) ----

      function remainLabel(sec) {

        if (h > 0) return "残り" + h + "時間" + m + "分";
        if (sec >= 60) return "残り" + m + "分";
        return "残り" + sec + "秒";

      function paintScrub() {

        cFillEl.style.width = (pct * 100) + "%";

        $("tRemain").textContent = "−" + fmt(Math.max(0, d - audio.currentTime));

      $("cSpeed").addEventListener("click", function () { openSpeedPop(this); });

      // playbackRateはsrc設定後にリセットされる環境があるため再適用
      audio.addEventListener("loadedmetadata", function () { audio.playbackRate = rate; });

      // ---- スリープタイマー(ポップアップ選択。終了時に一時停止) ----
      var TIMER_MIN = [0, 15, 30, 45, 60];
      var timerMin = 0, timerDeadline = 0, timerTick = null;
      var timerLb = $("timerLb"), actTimer = $("actTimer");
      var cTimerBtn = $("cTimer"), cTimerLb = $("cTimerLb");
      function stopTimer() {

        actTimer.classList.add("on");

        timerLb.textContent = min + "分";
        cTimerLb.textContent = min + "分";

            cTimerLb.textContent = fmt(left / 1000);

      cTimerBtn.addEventListener("click", function () { openTimerPop(this); });

        audio.addEventListener("ratechange", updatePositionState);

      // ---- メディア面のタップ表示コントロール ----
      var stagebox = $("stagebox");
      var ctlTimer = null;
      function armCtl() {
        if (ctlTimer) clearTimeout(ctlTimer);

        if (!audio.paused) {

        }
      }

        stagebox.classList.add("ctl");
        armCtl();
      }
      cleanups.push(function () { if (ctlTimer) clearTimeout(ctlTimer); });
      // スライドタブへ入った時: 停止中、またはチャプターへスクロール済み
      // (=スライド面が唯一の操作場所)ならコントロールを出す

      // タッチ操作はタップで開閉。タッチ+マウス両対応機のため、環境の一発判定でなく
      // 直前のポインタ種別で毎回分岐する

      });

      function flashSkip(label, side) {
        var old = stagebox.querySelector(".np-skipflash");
        if (old) old.remove();
        var f = el("div", "np-skipflash " + side, label);
        stagebox.appendChild(f);
        setTimeout(function () { f.remove(); }, 750);
      }

      cleanups.push(function () { if (tapTimer) clearTimeout(tapTimer); });

        // ボタン側のハンドラが innerHTML でアイコンを差し替えると ev.target が
        // DOMから切り離され closest が効かなくなるため、切り離しも「ボタン操作」とみなす
        if (!ev.target.isConnected ||

        if (lastPointerType === "mouse") { togglePlay(); return; }

        // 単タップは誤発火しないよう260ms待ってから開閉を確定する
        var now = performance.now();
        var x = ev.clientX;

          lastTapT = 0;
          if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }

          var rel = (x - rect.left) / rect.width;

      audio.addEventListener("pause", function () { showCtl(); });

      // 読込前のスクロールで既に scrolled のことがあるため、現在の状態で初期化する
      var wasScrolled = wrap.classList.contains("scrolled");

      // ---- 全画面(⛶ / 端末を横向きで自動) ----

        document.body.classList.add("np-fs");
        showCtl();
        paintFsBtn();
        // ユーザー操作起点のときだけネイティブ全画面+横向き固定を試みる

        if (document.fullscreenElement) {

        }
        try {
          if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        } catch (e) { /* 未対応環境は無視 */ }
        if (tabBeforeFs) { setMode(tabBeforeFs, false); tabBeforeFs = null; }

      var mqTouch = window.matchMedia("(hover: none) and (pointer: coarse)");
      function onOrient() {

      // ---- キーボード操作(Space=再生/停止・←→=前後章・F=全画面) ----
      function onKey(ev) {
        // オーバーレイを閉じてバックグラウンド再生中はショートカットを奪わない
        if (hostEl && !document.body.classList.contains("player-open")) return;
        var tg = ev.target;
        if (tg && /^(INPUT|SELECT|TEXTAREA|BUTTON|AUDIO)$/.test(tg.tagName)) return;
        if (ev.key === " ") {
          ev.preventDefault();
          togglePlay();
        } else if (ev.key === "ArrowLeft") {
          prevChap();
        } else if (ev.key === "ArrowRight") {
          nextChap();
        } else if (ev.key === "f" || ev.key === "F") {
          fsOn ? exitFs() : enterFs(true);
        } else if (ev.key === "Escape" && fsOn) {
          exitFs();
        }
      }
      on(document, "keydown", onKey);

      // ---- 進行と保存 ----
      var lastSaved = 0;
      audio.addEventListener("timeupdate", function () {
        var i = cueAt(audio.currentTime);
        if (i !== cur) { cur = i; render(i); }
        paintScrub();
        // 再生位置の保存は5秒ごとに間引く(毎timeupdateで書くとストレージ書き込みが過剰)
        var now = Date.now();
        if (now - lastSaved > 5000 && !audio.paused) {
          lastSaved = now;
          savePos(lib, bookId, audio.currentTime, dur(), cur + 1, cues.length);
          updatePositionState();
        }
      });
      // 離脱時にも保存する(モバイルSafariはunloadが来ないためpagehide/visibilitychangeで)
      function saveNow() {
        if (audio.currentTime > 0) {
          savePos(lib, bookId, audio.currentTime, dur(), cur + 1, cues.length);
        }
      }
      on(window, "pagehide", saveNow);
      function onVisibility() {
        if (document.visibilityState === "hidden") saveNow();
      }
      on(document, "visibilitychange", onVisibility);
      audio.addEventListener("pause", saveNow);

      // 端末間同期: 再生中は30秒ごと、停止・離脱時は即時に送る
      var syncHandle = setInterval(function () { if (!audio.paused) syncProgressUp(); }, 30000);
      cleanups.push(function () { clearInterval(syncHandle); });
      audio.addEventListener("pause", function () { syncProgressUp(); });
      on(window, "pagehide", function () { syncProgressUp(true); });

      // ---- 前回の続きから再開(先頭・末尾付近の保存値は無視する) ----
      // ?restart=1(詳細画面の「最初から再生」)なら保存値を破棄して先頭から
      if (params.get("restart")) clearPos(lib, bookId);
      var saved = loadPos(lib, bookId);
      if (saved && saved.t > 10 && (!saved.d || saved.t < saved.d - 5)) {
        var bar = $("npResume");
        var resumeDismissed = false;
        bar.style.display = "flex";
        $("resumeAt").textContent = fmt(saved.t);
        audio.addEventListener("loadedmetadata", function () {
          if (!resumeDismissed) { audio.currentTime = saved.t; paintScrub(); }
        }, { once: true });
        $("resumeOff").addEventListener("click", function () {
          resumeDismissed = true;
          bar.style.display = "none";
          audio.currentTime = 0;
          cur = -1;
          render(cueAt(0));
          paintScrub();
        });
        // 用が済んだら自動的に引っ込める(6秒)。押されなければ黙って消える
        setTimeout(function () {
          if (resumeDismissed) return;
          bar.style.transition = "opacity .4s linear";
          bar.style.opacity = "0";
          setTimeout(function () {
            if (!resumeDismissed) bar.style.display = "none";
          }, 420);
        }, 6000);
      }

      // ---- チャプターリスト(番号+時刻+見出し+要点。タップでシーク) ----
      var chList = $("chList");
      cues.forEach(function (cue, i) {
        var body = bodyMap[cue.slide] || {};
        var b = document.createElement("button");
        b.type = "button";
        b.className = "np-chap";
        b.setAttribute("role", "listitem");
        var no = el("span", "no");
        no.appendChild(el("b", null, String(i + 1).padStart(2, "0")));
        no.appendChild(el("span", "tm", fmt(cue.t)));
        b.appendChild(no);
        var bd = el("span", "bd");
        bd.appendChild(el("span", "tt", body.title || cue.slide));
        if (body.bullets && body.bullets.length) {
          var ul = document.createElement("ul");
          body.bullets.forEach(function (bl) {
            var li = document.createElement("li");
            li.textContent = bl;
            ul.appendChild(li);
          });
          bd.appendChild(ul);
        } else if (typeof body.alt === "string" && body.alt) {
          bd.appendChild(el("div", "alt", body.alt));
        }
        if (body.note) bd.appendChild(el("div", "nt", body.note));
        b.appendChild(bd);
        // aria-label は付けない: button の可視テキスト(番号・時刻・見出し・要点)を
        // そのままアクセシブルネームにする(上書きすると要点が読み上げから消える)
        b.addEventListener("click", function () { seekTo(i); });
        chList.appendChild(b);
        chapEls.push(b);
      });
      $("chCount").textContent = "全" + cues.length + "章";
      $("chipChapters").textContent = "チャプター " + cues.length;
      $("npHint").textContent = "チャプター(" + cues.length + ")";

      // ---- チャプターの自動追従 ----
      // 再生が次の章へ進んだら、一覧をその章が見える位置まで寄せる。
      // ユーザーが一覧を触っている間(4秒)は動かさない(読みの邪魔をしない)
      var chFollowMuteUntil = 0;
      function muteFollow() { chFollowMuteUntil = Date.now() + 4000; }
      ["wheel", "touchmove", "pointerdown"].forEach(function (evn) {
        $("npChapters").addEventListener(evn, muteFollow, { passive: true });
        scrollEl.addEventListener(evn, muteFollow, { passive: true });
      });
      function followChapter(i) {
        if (Date.now() < chFollowMuteUntil) return;
        var item = chapEls[i];
        if (!item) return;
        var chs = $("npChapters");
        // デスクトップ2カラムではチャプター列自身が、それ以外はページ全体がスクローラ
        var cont = (chs.scrollHeight > chs.clientHeight + 4) ? chs : scrollEl;
        if (cont === scrollEl && !wrap.classList.contains("scrolled")) return;
        var topPad = 72;
        if (cont === scrollEl) {
          var mediaEl = wrap.querySelector(".np-media");
          topPad = 52 + (npMode === "slide" ? mediaEl.offsetHeight : 58) + 12;
        }
        var cRect = cont.getBoundingClientRect();
        var iRect = item.getBoundingClientRect();
        if (iRect.top < cRect.top + topPad || iRect.bottom > cRect.bottom - 16) {
          cont.scrollTo({ top: cont.scrollTop + (iRect.top - cRect.top) - topPad,
                          behavior: "smooth" });
        }
      }

      // チャプターへのスクロール(チップ/下部の取っ手から)
      function scrollToChapters() {
        // 固定される高さ = 上部バー + (スライドモードなら貼り付くメディア面 / 表紙は小型バー)
        var mediaEl = wrap.querySelector(".np-media");
        var pinned = 52 + (npMode === "slide" ? mediaEl.offsetHeight : 58);
        scrollEl.scrollTo({ top: $("npChapters").offsetTop - pinned, behavior: "smooth" });
      }
      $("chipChapters").addEventListener("click", scrollToChapters);
      $("npHint").addEventListener("click", scrollToChapters);

      // 画像スライドのブックは全枚を裏で先読みしておく(切替のチラつきを完全に無くす)
      if (cues.some(function (c) { return (slideMeta[c.slide] || {}).image; })) {
        cues.forEach(function (_c, i) { prefetchSlideImage(i); });
      }

      cur = 0;
      render(0);
      paintScrub();
      // スライドモードで停止中はコントロールを出しておく(操作場所が最初から分かるように)
      if (npMode === "slide" && audio.paused) showCtl();
      // すでに横向きで開いた場合は最初から全画面にする
      onOrient();
    }).catch(function (e) {
      warn("ブックを読み込めませんでした: " + (e.message || e));
    });
  }

  // ================= 起動 =================
  fetch("/api/libraries").then(function (r) {
    if (r.status === 401) { showLogin(); return null; }
    return r.json();
  }).then(function (d) {
    if (!d) return;  // ログイン待ち
    var libs = d.libraries || [];
    if (!libs.length) {
      warn("ライブラリがありません。--library でブックフォルダのディレクトリを指定してください。");
      return;
    }
    // 選択中ライブラリの解決(URL > localStorage > 先頭)
    var known = libs.map(function (l) { return l.id; });
    if (known.indexOf(state.lib) === -1) state.lib = known[0];
    lsSet("kikimiru.lib", state.lib);

    renderShell();
    initLibSelect(libs);
    paintNetState();

    // 進捗をサーバとマージしてから描画する(続きから・ドックが端末横断で揃う)
    syncProgressDown().then(function () {
      var book = params.get("book");
      switch (state.view) {
        case "player": viewPlayer(book); return;  // 没入画面: ドックは出さない
        case "book": viewBook(book); break;
        case "library": viewLibrary(); break;
        case "series": viewSeries(); break;
        case "search": viewSearch(); break;
        case "authors": viewPeople("authors"); break;
        case "narrators": viewPeople("narrators"); break;
        case "tags": viewTags(); break;
        case "stats": viewStats(); break;
        case "collections": viewCollections(); break;
        case "offline": viewOffline(); break;
        default: state.view = "home"; renderShell(); viewHome();
      }
      // 再開ドック(プレイヤー以外の全画面)
      api("/api/books").then(function (d2) { renderDock(d2.books); }).catch(function () {});
    });
  }).catch(function () {
    warn("サーバに接続できません。");
  });
})();
</script>
</body>
</html>
